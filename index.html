ment（B、D）沒有穩定的儲存身分；DaemonSet（C）是每個節點跑一個，不適合資料庫；B、C 還要手動調整大小。","t":["GKE","Kubernetes Workloads","GKE Autoscaling","Migration"]},{"n":289,"s":"You are the Organization Administrator for your company's Google Cloud resources. Your company has strict compliance rules that require you to be notified about any modifications to files and documents hosted on Cloud Storage. In a recent incident, one of your team members was able to modify files and you did not receive any notifications, causing other production jobs to fail. You must ensure that you receive notifications for all changes to files and documents in Cloud Storage while minimizing management overhead. What should you do?","o":[{"l":"A","t":"View Cloud Audit logs for all Cloud Storage files in Logs Explorer. Filter by Admin Activity logs."},{"l":"B","t":"Enable Cloud Storage object versioning on your bucket. Configure Pub/Sub notifications for your Cloud Storage buckets."},{"l":"C","t":"Enable versioning on the Cloud Storage bucket. Set up a custom script that scans versions of Cloud Storage objects being modified and alert the admin by using the script."},{"l":"D","t":"Configure Object change notifications on the Cloud Storage buckets. Send the events to Pub/Sub."}],"a":"D","e":"要在 Cloud Storage 檔案被修改時收到通知，就在 bucket 設定物件變更通知並送到 Pub/Sub，由 Pub/Sub 推送給管理員，幾乎不需要維護。A 的 Admin Activity 記錄不包含物件的修改，而且只能事後查看；B 多開了版本控管，也不是必要的；C 要自己寫掃描腳本。","t":["Cloud Storage","Cloud Storage Notifications","Pub/Sub"]},{"n":290,"s":"Your company would like to store invoices and other financial documents in Google Cloud. You need to identify a Google-managed solution to store this information for your company. You must ensure that the documents are kept for a duration of three years. Your company’s analysts need frequent access to invoices from the past six months. After six months, invoices should be archived for audit purposes only. You want to minimize costs and follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use Cloud Storage with Object Lifecycle Management to change the object storage class to Coldline after six months."},{"l":"B","t":"Use Cloud Storage with Object Lifecycle Management to change the object storage class to Standard after six months."},{"l":"C","t":"Store your documents on Filestore, and move the documents to Cloud Storage with object storage class set to Coldline after six months."},{"l":"D","t":"Store your documents on Filestore, and move the documents to Cloud Storage with object storage class set to Standard after six months."}],"a":"A","e":"發票前六個月經常存取，之後只為稽核保存，用 Cloud Storage 的物件生命週期規則，在六個月後把儲存類別改成 Coldline，降低成本又能在稽核時取用。B 改成 Standard 不會省錢；Filestore（C、D）是檔案伺服器，比 Cloud Storage 貴，也不是 Google 建議的文件封存方案。","t":["Cloud Storage","Storage Class","Object Lifecycle","Cost Optimization"]},{"n":291,"s":"You are planning to migrate your containerized workloads to Google Kubernetes Engine (GKE). You need to determine which GKE option to use. Your solution must have high availability, minimal downtime, and the ability to promptly apply security updates to your nodes. You also want to pay only for the compute resources that your workloads use without managing nodes. You want to follow Google-recommended practices and minimize operational costs. What should you do?","o":[{"l":"A","t":"Configure a Standard regional GKE duster."},{"l":"B","t":"Configure a Standard zonal GKE duster."},{"l":"C","t":"Configure a Standard multi-zonal GKE cluster."},{"l":"D","t":"Configure an Autopilot GKE cluster."}],"a":"D","e":"只為工作負載實際使用的資源付費、不用管理節點、自動套用安全更新，又要高可用，選 GKE Autopilot（依 Pod 資源計費、Google 管理節點、預設為區域叢集）。Standard 叢集（A、B、C）都要自己管理節點，而且依節點計費。","t":["GKE","GKE Autopilot","High Availability"]},{"n":292,"s":"Your company stores data from multiple sources that have different data storage requirements. These data include:\n1. Customer data that is structured and read with complex queries\n2. Historical log data that is large in volume and accessed infrequently\n3. Real-time sensor data with high-velocity writes, which needs to be available for analysis but can tolerate some data loss\nYou need to design the most cost-effective storage solution that fulfills all data storage requirements. What should you do?","o":[{"l":"A","t":"Use Firestore for customer data, Cloud Storage (Nearline) for historical logs, and Bigtable for sensor data."},{"l":"B","t":"Use Cloud SQL for customer data. Cloud Storage (Coldline) for historical logs, and BigQuery for sensor data."},{"l":"C","t":"Use Cloud SQL for customer data. Cloud Storage (Archive) for historical logs, and Bigtable for sensor data."},{"l":"D","t":"Use Spanner for all data."}],"a":"C","e":"結構化又要複雜查詢的客戶資料用 Cloud SQL；量大又很少存取的歷史記錄用最便宜的 Cloud Storage Archive；高速寫入、要即時分析、可容忍少量遺失的感測器資料用 Bigtable。Firestore 不適合複雜查詢；Coldline 比 Archive 貴；所有資料都放 Spanner（D）成本太高。","t":["Database Selection","Cloud SQL","Bigtable","Cloud Storage","Storage Class","Cost Optimization"]},{"n":293,"s":"You work for a financial services company that operates as a stock market broker. Your company is planning to migrate to Google Cloud. You need to plan the network design in Google Cloud. Your design must:\n• Minimize the latency between all production systems.\n• Minimize costs related to your development environment.\nWhat should you do?","o":[{"l":"A","t":"Create a VPC in the Standard Tier and one in the Premium Tier. Deploy production workloads in the Standard Tier and development workloads in the Premium Tier."},{"l":"B","t":"Create a VPC in the Standard Tier and one in the Premium Tier. Deploy development workloads in the Standard Tier and production workloads in the Premium Tier."},{"l":"C","t":"Create a VPC in the Premium Tier, and deploy both production and development workloads on this VPC."},{"l":"D","t":"Create a VPC in the Standard Tier, and deploy both production and development workloads on this VPC."}],"a":"B","e":"網路服務級別：Premium Tier 走 Google 骨幹網路，延遲最低，用在正式環境；Standard Tier 走一般網際網路，比較便宜，用在開發環境，所以選 B。A 剛好放反；C 開發環境也用 Premium，花太多錢；D 正式環境用 Standard，延遲較高。","t":["VPC","Network Service Tiers","Cost Optimization"]},{"n":294,"s":"You are managing a fleet of Compute Engine Linux instances in a Google Cloud project. Your company's engineering team requires SSH access to all instances to perform routine maintenance tasks. You need to manage the SSH access for the engineering team, and you want to minimize operational overhead when engineers join or leave the team. What should you do?","o":[{"l":"A","t":"Create a single SSH key pair to be shared by all engineering team members. Add the public SSH key to project metadata."},{"l":"B","t":"Create an SSH key pair for each engineer on the team, and add the public SSH key to the metadata of the relevant instances."},{"l":"C","t":"Create a Google Group for all engineering team members, and grant them the Compute Viewer IAM role. Manage group membership when engineers join or leave the team."},{"l":"D","t":"Create a Google Group for all engineering team members, and set up OS Login for this group on the project. Manage group membership when engineers join or leave the team."}],"a":"D","e":"建立工程團隊的 Google 群組，在專案啟用 OS Login，並透過 IAM 授予該群組登入權限。工程師加入或離開時只要調整群組成員，存取權就會自動更新。A 共用金鑰不安全，有人離職就要換金鑰；B 每台 VM 都要管理金鑰；C 的 Compute Viewer 不包含 SSH 登入權限。","t":["Compute Engine","SSH Access","OS Login","Google Groups"]},{"n":295,"s":"Your company was recently impacted by a service disruption that caused multiple Dataflow jobs to get stuck, resulting in significant downtime in downstream applications and revenue loss. You were able to resolve the issue by identifying and fixing an error you found in the code. You need to design a solution with minimal management effort to identify when jobs are stuck in the future to ensure that this issue does not occur again. What should you do?","o":[{"l":"A","t":"Update the Dataflow job configurations to send messages to a Pub/Sub topic when there are delays. Configure a backup Dataflow job to process jobs that are delayed. Use Cloud Tasks to trigger an alert when messages are pushed to the Pub/Sub topic."},{"l":"B","t":"Set up Cloud Monitoring alerts on the data freshness metric for the Dataflow jobs to receive a notification when a certain threshold is reached."},{"l":"C","t":"Set up Error Reporting to identify stack traces that indicate slowdowns in Dataflow jobs. Set up alerts based on these log entries."},{"l":"D","t":"Use the Personalized Service Health dashboard to identify issues with Dataflow jobs across regions."}],"a":"B","e":"在 Cloud Monitoring 對 Dataflow 工作的資料新鮮度（data freshness）指標設定快訊，工作卡住時新鮮度會變差，超過門檻就通知，幾乎不需要管理。A 要額外開發和維運；C 的 Error Reporting 只抓錯誤，工作卡住不一定有錯誤；D 的 Service Health 只顯示 Google 服務本身的問題，不是你工作的問題。","t":["Dataflow","Cloud Monitoring","Alerting"]},{"n":296,"s":"Your company is modernizing its applications and refactoring them to containerized microservices. You need to deploy the infrastructure on Google Cloud so that teams can deploy their applications. The applications cannot be exposed publicly. You want to minimize management and operational overhead. What should you do?","o":[{"l":"A","t":"Provision a Google Kubernetes Engine (GKE) Autopilot cluster."},{"l":"B","t":"Provision a fleet of Compute Engine instances and install Kubernetes."},{"l":"C","t":"Provision a Standard regional Google Kubernetes Engine (GKE) cluster."},{"l":"D","t":"Provision a Standard zonal Google Kubernetes Engine (GKE) cluster."}],"a":"A","e":"容器化微服務、管理和維運負擔最小，選 GKE Autopilot（Google 管理節點，預設啟用許多安全設定），應用程式可以只用內部服務，不公開。B 自己在 VM 上安裝 Kubernetes 維運最重；C、D 的 Standard 叢集要自己管理節點。","t":["GKE","GKE Autopilot","Compute Selection"]},{"n":297,"s":"You have an application running inside a Compute Engine instance. You want to provide the application with secure access to a BigQuery dataset. You must ensure that credentials are only valid for a short period of time, and your application will only have access to the intended BigQuery dataset. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Attach a new service account to the instance every hour, and grant the service account the BigQuery Data Viewer IAM role on the project."},{"l":"B","t":"Attach a custom service account to the instance, and grant the service account the BigQuery Data Viewer IAM role on the dataset."},{"l":"C","t":"Attach a new service account to the instance every hour, and grant the service account the BigQuery Data Viewer IAM role on the dataset."},{"l":"D","t":"Attach a custom service account to the instance, and grant the service account the BigQuery Data Viewer IAM role on the project."}],"a":"B","e":"把一個自訂的 Service Account 附加到 VM，VM 會透過 metadata 伺服器自動取得短期的 OAuth 存取權杖（大約一小時就會更換），不需要自己管理。再只在那個 BigQuery 資料集上授予 BigQuery Data Viewer，符合最小權限。A、C 每小時換 Service Account 不合理又麻煩；A、D 授予在專案層級，權限太大。","t":["Compute Engine","Service Account","BigQuery","Least Privilege"]},{"n":298,"s":"You have an application that is currently processing transactions by using a group of managed VM instances. You need to migrate the application so that it is serverless and scalable. You want to implement an asynchronous transaction processing system, while minimizing management overhead. What should you do?","o":[{"l":"A","t":"Install Kafka on VM instances to acknowledge incoming transactions. Use Cloud Run to process transactions."},{"l":"B","t":"Use Pub/Sub to acknowledge incoming transactions. Use VM instances to process transactions."},{"l":"C","t":"Use Pub/Sub to acknowledge incoming transactions. Use Cloud Run to process transactions."},{"l":"D","t":"Install Kafka on VM instances to acknowledge incoming transactions. Use VM instances to process transactions."}],"a":"C","e":"題目要無伺服器、可擴充、非同步處理交易，又要減少管理：用 Pub/Sub 接收並確認交易，再由 Cloud Run 處理。Kafka（A、D）要自己在 VM 上安裝維運；用 VM 處理（B、D）不是無伺服器。","t":["Pub/Sub","Cloud Run","Event-Driven","Migration"]},{"n":299,"s":"Your company has many legacy third-party applications that rely on a shared NFS server for file sharing between these workloads. You want to modernize the NFS server by using a Google Cloud managed service. You need to select the solution that requires the least amount of change to the application. What should you do?","o":[{"l":"A","t":"Create a Compute Engine instance and configure an NFS server on the instance. Point all NFS mounts to the Compute Engine instance."},{"l":"B","t":"Deploy a Filestore instance. Replace all NFS mounts with a Filestore mount."},{"l":"C","t":"Configure Firestore. Configure all applications to use Firestore instead of the NFS server."},{"l":"D","t":"Create a Cloud Storage bucket. Configure all applications to use Cloud Storage client libraries instead of the NFS server."}],"a":"B","e":"Filestore 是 Google 代管的 NFS 檔案服務，應用程式只要把 NFS 掛載點改成 Filestore 就能使用，改動最少。A 還是自己管理 NFS 伺服器，不是代管服務；C、D 換成 Firestore 或 Cloud Storage，應用程式都要改寫。","t":["Filestore","Migration"]},{"n":300,"s":"Your company is seeking a scalable solution to retain and explore application logs hosted on Compute Engine. You must be able to analyze your logs with SQL queries, and you want to be able to create charts to identify patterns and trends in your logs over time. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Use a custom script to push your application logs to BigQuery for exploration."},{"l":"B","t":"Ingest your application logs to Cloud Logging by using Ops Agent, and explore your logs in Logs Explorer."},{"l":"C","t":"Ingest your application logs to Cloud Logging by using Ops Agent, and explore your logs with Log Analytics."},{"l":"D","t":"Use a custom script to push your application logs to Cloud SQL for exploration."}],"a":"C","e":"用 Ops Agent 把應用程式記錄送進 Cloud Logging，再用 Log Analytics 以 SQL 分析記錄並建立圖表，觀察長期趨勢，全代管又不用另外維運。Logs Explorer（B）不支援 SQL；A、D 要自己寫腳本推送記錄。","t":["Compute Engine","Ops Agent","Cloud Logging","Log Analytics"]},{"n":301,"s":"You are deploying an application to Google Kubernetes Engine (GKE). The application needs to make API calls to a private Cloud Storage bucket. You need to configure your application Pods to authenticate to the Cloud Storage API, but your organization policy prevents the usage of service account keys. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create the GKE cluster with Workload Identity Federation. Configure the default node service account to access the bucket. Deploy the application into the cluster so the application can use the node service account permissions. Use Identity and Access Management (IAM) to grant the service account access to the bucket."},{"l":"B","t":"Create the GKE cluster with Workload Identity Federation. Create a Google service account and a Kubernetes ServiceAccount, and configure both service accounts to use Workload Identity Federation. Attach the Kubernetes ServiceAccount to the application Pods and configure the Google service account to access the bucket with Identity and Access Management (IAM)."},{"l":"C","t":"Create the GKE cluster and deploy the application. Request a security exception to create a Google service account key. Set the constraints/iam.serviceAccountKeyExpiryHours organization policy to 24 hours."},{"l":"D","t":"Create the GKE cluster and deploy the application. Request a security exception to create a Google service account key. Set the constraints/iam.serviceAccountKeyExpiryHours organization policy to 8 hours."}],"a":"B","e":"組織政策不允許使用 Service Account 金鑰，Google 建議的做法是 GKE 的 Workload Identity Federation：建立 Google Service Account 和 Kubernetes ServiceAccount 並綁定，Pod 會自動取得短期憑證，再用 IAM 授權 Google Service Account 存取 bucket。A 讓所有 Pod 共用節點的 Service Account，權限太大；C、D 申請例外使用金鑰，違反政策也不安全。","t":["GKE","Workload Identity","Service Account","Cloud Storage"]},{"n":302,"s":"Your company’s developers use an automation that you recently built to provision Linux VMs in Compute Engine within a Google Cloud project to perform various tasks. You need to manage the Linux account lifecycle and access for these users. You want to follow Google-recommended practices to simplify access management while minimizing operational costs. What should you do?","o":[{"l":"A","t":"Enable OS Login for all VMs. Use IAM roles to grant user permissions."},{"l":"B","t":"Require your developers to create public SSH keys. Write custom startup scripts to update user permissions."},{"l":"C","t":"Require your developers to create public SSH keys. Make the owner of the public key the root user."},{"l":"D","t":"Enable OS Login for all VMs. Write custom startup scripts to update user permissions."}],"a":"A","e":"啟用 OS Login 後，VM 上的 Linux 帳號會綁定使用者的 Google 身分，用 IAM 角色（例如 roles/compute.osLogin）控制誰能登入，人員異動時帳號生命週期自動處理，管理簡單。B、C 要自己管理 SSH 金鑰，C 還讓使用者變成 root；D 自己寫啟動腳本管理權限，維運成本高。","t":["Compute Engine","SSH Access","OS Login","IAM"]},{"n":303,"s":"You are managing the security configuration of your company’s Google Cloud organization. The Operations team needs specific permissions on both a Google Kubernetes Engine (GKE) cluster and a Cloud SQL instance. Two predefined Identity and Access Management (IAM) roles exist that contain a subset of the permissions needed by the team. You need to configure the necessary IAM permissions for this team while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create a custom IAM role that combines the permissions from the two relevant predefined roles."},{"l":"B","t":"Grant the team the two predefined IAM roles."},{"l":"C","t":"Create a custom IAM role that includes only the required permissions from the predefined roles."},{"l":"D","t":"Grant the team the IAM roles of Kubernetes Engine Admin and Cloud SQL Admin."}],"a":"C","e":"兩個預先定義角色只包含團隊需要的「部分」權限，不夠用；而直接給 Admin 角色（D）權限又太大。依最小權限原則，建立只包含團隊實際需要權限的自訂角色。A 把兩個角色的所有權限合併，會多出不需要的權限。","t":["IAM","IAM Custom Role","Least Privilege"]},{"n":304,"s":"Your organization has decided to deploy all its compute workloads to Kubernetes on Google Cloud and two other cloud providers. You want to build an Infrastructure-as-code solution to automate the provisioning process for all cloud resources. What should you do?","o":[{"l":"A","t":"Build the solution by using Config Connector, and provision the resources."},{"l":"B","t":"Build the solution by using Terraform, and provision the resources."},{"l":"C","t":"Build solution by using Python and the cloud SDKs from all providers to provision the resources."},{"l":"D","t":"Build the solution by using YAML manifests, and provision the resources."}],"a":"B","e":"要在 Google Cloud 和另外兩家雲端供應商上用 Infrastructure as Code 自動佈建，選 Terraform，它支援多家雲端的 provider。Config Connector（A）只管理 Google Cloud 資源；C 自己寫 Python 呼叫各家 SDK，開發和維護成本高；D 的 YAML manifest 只能管理 Kubernetes 內的資源。","t":["IAC","Terraform","Multi-Cloud"]},{"n":305,"s":"You are planning to deploy an application to Google Cloud. Your application processes asynchronous events from Google services and must be accessible from the public Internet. You need to identify how to deploy your application. You want to follow a standardized process while minimizing development costs. You also want to have no costs when your workloads are not in use. What should you do?","o":[{"l":"A","t":"Deploy your code to GKE. Use Pub/Sub for event delivery."},{"l":"B","t":"Deploy your code to Compute Engine. Use Pub/Sub for event delivery."},{"l":"C","t":"Deploy your code to GKE. Use Eventarc for event delivery."},{"l":"D","t":"Deploy your code to Cloud Run. Use Eventarc for event delivery."}],"a":"D","e":"Cloud Run 沒有請求時可以縮到 0，不用時沒有費用，也能公開存取；Eventarc 是標準化接收 Google 服務事件的方式（CloudEvents 格式），不需要自己開發事件處理。GKE 和 Compute Engine（A、B、C）即使沒有工作也會持續收費。","t":["Cloud Run","Eventarc","Event-Driven","Compute Selection","Cost Optimization"]},{"n":306,"s":"Your company is migrating its workloads to Google Cloud due to an expiring data center contract. The on-premises environment and Google Cloud are not connected. You have decided to follow a lift-and-shift approach, and you plan to modernize the workloads in a future project. Several old applications connect to each other through hard-coded internal IP addresses. You want to migrate these workloads quickly without modifying the application code. You also want to maintain all functionality. What should you do?","o":[{"l":"A","t":"Migrate your DNS server first. Configure Cloud DNS with a forwarding zone to your migrated DNS server. Then migrate all other workloads with ephemeral internal IP addresses."},{"l":"B","t":"Create a VPC with non-overlapping CIDR ranges compared to your on-premises network. When migrating individual workloads, assign each workload a new static internal IP address."},{"l":"C","t":"Create a VPC with the same CIDR ranges as your on-premises network. When migrating individual workloads, assign each workload the same static internal IP address."},{"l":"D","t":"Migrate all workloads to a single VPC subnet. Configure Cloud NAT for the subnet and manually assign a static IP address to the Cloud NAT gateway."}],"a":"C","e":"地端和 Google Cloud 沒有連線，所以 IP 範圍重疊不會有問題。建立跟地端相同 CIDR 的 VPC，每個工作負載搬過去時都保留原本相同的靜態內部 IP，寫死在程式裡的 IP 就能繼續用，不必改程式碼。A 用臨時 IP 會讓位址改變；B 換成新 IP，程式就連不到；D 的 Cloud NAT 是對外連線用的，解決不了內部 IP 問題。","t":["VPC","Subnets","Static IP","Migration"]},{"n":307,"s":"You are migrating your company’s on-premises compute resources to Google Cloud. You need to deploy batch processing jobs that run every night. The jobs require significant CPU and memory for several hours but can tolerate interruptions. You must ensure that the deployment is cost-effective. What should you do?","o":[{"l":"A","t":"Use the M1 machine series on Compute Engine."},{"l":"B","t":"Containerize the batch processing jobs and deploy them on Compute Engine."},{"l":"C","t":"Use Spot VMs on Compute Engine."},{"l":"D","t":"Use custom machine types on Compute Engine."}],"a":"C","e":"夜間批次工作可以容忍中斷，用 Spot VM 最省錢（比一般 VM 便宜很多）。M1（A）是給記憶體內資料庫用的大型機型；容器化（B）和自訂機器類型（D）都不會大幅降低成本。","t":["Compute Engine","Spot VM","Migration","Cost Optimization"]},{"n":308,"s":"Your company has a rapidly growing social media platform and a user base primarily located in North America. Due to increasing demand, your current on-premises PostgreSQL database, hosted in your United States headquarters data center, no longer meets your needs. You need to identify a cloud-based database solution that offers automatic scaling, multi-region support for future expansion, and maintains low latency. What should you do?","o":[{"l":"A","t":"Use BigQuery."},{"l":"B","t":"Use Spanner."},{"l":"C","t":"Use Cloud SQL for PostgreSQL."},{"l":"D","t":"Use Bigtable."}],"a":"B","e":"要自動擴充、支援多區域、又要低延遲，選 Cloud Spanner（可自動擴充、支援多區域部署，也有 PostgreSQL 介面方便遷移）。Cloud SQL（C）擴充有上限，也不是多區域寫入；BigQuery 是分析用；Bigtable 不是關聯式資料庫，PostgreSQL 應用程式要大改。","t":["Spanner","Database Selection"]},{"n":309,"s":"You are migrating your on-premises workload to Google Cloud. Your company is implementing its Cloud Billing configuration and requires access to a granular breakdown of its Google Cloud costs. You need to ensure that the Cloud Billing datasets are available in BigQuery so you can conduct a detailed analysis of costs. What should you do?","o":[{"l":"A","t":"Enable Cloud Billing data export to BigQuery when you create a Cloud Billing account."},{"l":"B","t":"Enable Cloud Billing on the project, and link a Cloud Billing account. Then view the billing data table in the BigQuery dataset."},{"l":"C","t":"Create a Cloud Billing account. Enable the BigQuery Data Transfer Service API to export pricing data."},{"l":"D","t":"Enable the BigQuery API, and ensure that the BigQuery User IAM role is selected. Change the BigQuery dataset to select a data location."}],"a":"A","e":"帳單匯出只會包含啟用之後產生的資料，所以要在建立 Cloud Billing 帳戶時就啟用匯出到 BigQuery，才能取得完整、詳細的費用資料。B 只連結帳單帳戶不會自動產生 BigQuery 資料；C 的 Data Transfer Service 不是帳單匯出方式；D 只是啟用 API 和選擇位置。","t":["Cloud Billing","Billing Export","BigQuery"]},{"n":310,"s":"Your company’s accounting department needs to run an overnight batch workload every day. You must implement a solution that minimizes the cost to run this workload and automatically retries the batch if an execution fails. What should you do?","o":[{"l":"A","t":"Develop an application that runs the batch workload, and deploy the application as a Google Kubernetes Engine (GKE) CronJob."},{"l":"B","t":"Develop a web application that listens for incoming requests, and deploy the application as a Cloud Run service. Use Cloud Scheduler to call the HTTP endpoint."},{"l":"C","t":"Develop an application that runs the batch workload, and deploy the application as a Cloud Run job. Use Cloud Scheduler to trigger the job."},{"l":"D","t":"Develop a web application that listens for incoming requests, and deploy the application as a Google Kubernetes Engine (GKE) Deployment. Use Cloud Scheduler to call the HTTP endpoint."}],"a":"C","e":"Cloud Run job 是專門跑批次工作的：執行完就結束，只依執行時間計費，可以設定失敗自動重試；再用 Cloud Scheduler 每天觸發。GKE（A、D）叢集一直存在，要持續付費；B、D 用 HTTP 請求跑批次會受到請求逾時限制，也不會自動重試。","t":["Cloud Run","Cloud Run Jobs","Cloud Scheduler","Compute Selection","Cost Optimization"]},{"n":311,"s":"You need to migrate multiple PostgreSQL databases from your on-premises data center to Google Cloud. You want to significantly improve the performance of your databases while minimizing changes to your data schema and application code. You expect to exceed 150 TB of data per geographical region. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Migrate your data to AlloyDB."},{"l":"B","t":"Migrate your data to Spanner."},{"l":"C","t":"Migrate your data to Firebase."},{"l":"D","t":"Migrate your data to Bigtable."}],"a":"A","e":"AlloyDB for PostgreSQL 與 PostgreSQL 相容，結構描述和程式碼幾乎不用改，效能又明顯優於標準 PostgreSQL，支援大量資料，屬於全代管服務，維運成本低。Spanner（B）要調整結構描述和程式；Firebase 和 Bigtable（C、D）不是 PostgreSQL 相容的資料庫。","t":["AlloyDB","Database Selection","Migration"]},{"n":312,"s":"Your company's machine learning team requires a scalable and flexible platform to fine-tune large language models utilizing a large volume of proprietary data on Google Cloud. You are tasked with building a solution for this team. What should you do?","o":[{"l":"A","t":"Use Dataflow as a platform to run the fine-tuning jobs"},{"l":"B","t":"Use a Compute Engine managed instance group as a platform to deploy Jupyter Notebooks and run fine-tuning jobs."},{"l":"C","t":"Use Cloud Run and GPU as a platform to run the fine-tuning jobs."},{"l":"D","t":"Use Google Kubernetes Engine (GKE) and hardware accelerators as a platform to run the fine-tuning jobs."}],"a":"D","e":"微調大型語言模型需要大量 GPU 或 TPU，又要可擴充、彈性，選 GKE 搭配硬體加速器，可以排程大規模的分散式訓練工作。Dataflow（A）是資料處理服務；MIG 跑 Jupyter（B）難以管理大規模訓練；Cloud Run（C）的 GPU 數量有限，不適合大規模微調。","t":["GKE","Hardware Accelerators","AI/ML Workloads","Compute Selection"]},{"n":313,"s":"You recently discovered an issue with your rolling update in Google Kubernetes Engine (GKE). You now need to roll back a rolling update. What should you do?","o":[{"l":"A","t":"Delete the deployment."},{"l":"B","t":"Use the kubectl rollout restart command to revert the deployment."},{"l":"C","t":"Use the kubectl rollout undo command."},{"l":"D","t":"Manually scale down the new Pods and scale up the old Pods."}],"a":"C","e":"kubectl rollout undo 會把 Deployment 回復到上一個版本，就是回滾滾動更新的標準指令。rollout restart（B）只是重新啟動目前版本；刪除 Deployment（A）會讓服務中斷；手動調整 Pod（D）很麻煩，也無法真正回到舊版本。","t":["GKE","Rolling Update","kubectl"]},{"n":314,"s":"You are deploying an application to Google Kubernetes Engine (GKE) that needs to call an external third-party API. You need to provide the external API vendor with a list of IP addresses for their firewall to allow traffic from your application. You want to follow Google-recommended practices and avoid any risk of interrupting traffic to the API due to IP address changes. What should you do?","o":[{"l":"A","t":"Configure your GKE cluster with one node, and set the node to have a static external IP address. Ensure that the GKE cluster autoscaler is off. Send the external IP address of the node to the vendor to be added to the allowlist."},{"l":"B","t":"Configure your GKE cluster with private nodes. Configure a Cloud NAT instance with static IP addresses. Provide these IP addresses to the vendor to be added to the allowlist."},{"l":"C","t":"Configure your GKE cluster with private nodes. Configure a Cloud NAT instance with dynamic IP addresses. Provide these IP addresses to the vendor to be added to the allowlist."},{"l":"D","t":"Configure your GKE cluster with public nodes. Write a Cloud Function that pulls the public IP addresses of each node in the cluster, Trigger the function to run every day with Cloud Scheduler. Send the list to the vendor by email every day."}],"a":"B","e":"讓 GKE 節點只有私人 IP，對外連線全部經過 Cloud NAT，並為 Cloud NAT 設定固定的靜態 IP，提供給廠商加入允許清單，節點增減時也不會改變。A 只有一個節點，沒有可用性；C 的動態 IP 可能改變，流量會被擋；D 每天寄 IP 清單容易出錯，中間仍有斷線風險。","t":["GKE","GKE Private Cluster","Cloud NAT","Static IP"]},{"n":315,"s":"You are planning to move your company's website and a specific asynchronous background job to Google Cloud. Your website contains only static HTML content. The background job is started through an HTTP endpoint and generates monthly invoices for your customers. Your website needs to be available in multiple geographic locations and requires autoscaling. You want to have no costs when your workloads are not in use and follow recommended practices. What should you do?","o":[{"l":"A","t":"Move your website to Google Kubernetes Engine (GKE), and move your background job to Cloud Functions."},{"l":"B","t":"Move both your website and background job to Compute Engine."},{"l":"C","t":"Move both your website and background job to Cloud Run."},{"l":"D","t":"Move your website to Google Kubernetes Engine (GKE), and move your background job to Compute Engine."}],"a":"C","e":"靜態網站和由 HTTP 端點啟動的背景工作，都可以放在 Cloud Run：可以部署到多個區域、自動擴充，沒有流量時縮到 0、不收費。GKE 和 Compute Engine（A、B、D）即使沒人使用也會持續收費。","t":["Cloud Run","Compute Selection","Migration","Cost Optimization"]},{"n":316,"s":"Your company wants to provide engineers with access to explore Google Cloud freely in a sandbox environment. The total budget for testing across your organization is $1,000. You need to ensure that engineers are notified when the budget is about to be reached. You want to automate your solution as much as possible. What should you do?","o":[{"l":"A","t":"Create a separate Cloud Billing account for all sandbox projects. Link a credit card with a limit of $1,000 to this billing account. Ensure all sandbox projects are linked to this new Cloud Billing account."},{"l":"B","t":"Create a Google Cloud Folder and ensure that all sandbox projects are located under that Folder. Create a Budget Alert for $1,000 and scope it to the Folder. Configure an email alert to billing administrators and users once the budget is 90% reached."},{"l":"C","t":"Create an email template reminding people to regularly check their Google Cloud spend. Create a Cloud Function that sends the email to all the project owners. Create a daily job in Cloud Scheduler that triggers the Cloud Function. Deploy this solution for each sandbox."},{"l":"D","t":"Configure a billing data export to a BigQuery dataset on the Cloud Billing account. Create a dashboard for all costs related to the sandbox experiments. Share the dashboard with all engineers."}],"a":"B","e":"把所有沙箱專案放在一個資料夾下，建立 $1,000 的預算並以該資料夾為範圍，達到 90% 時寄信通知帳單管理員和使用者，全部自動完成。A 用有額度的信用卡，刷爆時服務會被停用，也不會事先通知；C 只是定期提醒，沒有實際金額；D 只有儀表板，不會主動通知。","t":["Cloud Billing","Budget Alerts","Resource Hierarchy"]},{"n":317,"s":"You are planning to migrate your on-premises VMs to Google Cloud. You need to set up a landing zone in Google Cloud before migrating the VMs. You must ensure that all VM in your production environment can communicate with each other through private IP addresses. You need to allow all VMs in your Google Cloud organization to accept connections on specific TCP ports. You want to follow Google-recommended practices, and you need to minimize your operational costs. What should you do?","o":[{"l":"A","t":"Create individual VPCs per Google Cloud project. Peer all he VPC together. Apply organization policies on the organization level."},{"l":"B","t":"Create individual VPCs for each Google Cloud project. Peer ail ne VPCs together. Apply hierarchical firewall policies on the organization level."},{"l":"C","t":"Create a host VPC project with each production project as its service project. Apply organization policies on the organization level."},{"l":"D","t":"Create a host VPC project with each production project as its service project. Apply hierarchical firewall policies on the organization level."}],"a":"D","e":"用 Shared VPC：建立一個主專案（host project），正式環境的專案都設為服務專案，所有 VM 在同一個 VPC 中用私人 IP 互通，集中管理成本最低。再在組織層級套用階層式防火牆政策，讓整個組織的 VM 都允許特定 TCP port。每個專案各建 VPC 再互相 peering（A、B）很複雜，peering 也不能遞移；組織政策（A、C）不能控制網路 port。","t":["Shared VPC","Hierarchical Firewall Policies","Migration"]},{"n":318,"s":"You assist different engineering teams in deploying their infrastructure on Google Cloud. Your company has defined certain practices required for all workloads. You need to provide the engineering teams with a solution that enables teams to deploy their infrastructure independently without having to know all implementation details of the company’s required practices. What should you do?","o":[{"l":"A","t":"Configure organization policies to enforce your company's required practices. Ask the teams to provision their infrastructure by using the Google Cloud console."},{"l":"B","t":"Create a service account per team, and grant the service account the Project Editor role. Ask the teams to provision their infrastructure through the Google Cloud CLI (gcloud CL), while impersonating their dedicated service account."},{"l":"C","t":"Write Terraform modules for each component that are compliant with the company's required practices, and ask teams to implement their infrastructure through these modules."},{"l":"D","t":"Provide training for all engineering teams you work with to understand the company’s required practices. Allow the engineering teams to provision the infrastructure to best meet their needs."}],"a":"C","e":"把公司要求的做法寫成符合規範的 Terraform 模組，工程團隊直接使用這些模組部署，不需要了解所有實作細節，也能確保合規。A 用主控台手動建立難以標準化；B 給 Project Editor 權限太大；D 只靠訓練，無法確保每個人都照做。","t":["IAC","Terraform"]},{"n":319,"s":"You ate managing an application deployed on Cloud Run. The development team has released a new version of the application. You want to deploy and redirect traffic to this new version of the application. To ensure traffic to the new version of the application is served with no startup time, you want to ensure that there are two idle instances available for incoming traffic before adjusting the traffic flow. You also want to minimize administrative overhead. What should you do?","o":[{"l":"A","t":"Ensure the checkbox “Serve this revision immediately” is unchecked when deploying the new revision. Before changing the traffic rules, use a traffic simulation tool to send load to the new revision."},{"l":"B","t":"Configure service autoscaling and set the minimum number of instances to 2."},{"l":"C","t":"Configure revision autoscaling for the new revision and set the minimum number of instances to 2."},{"l":"D","t":"Configure revision autoscaling for the existing revision and set the minimum number of instances to 2."}],"a":"C","e":"為新的 revision 設定 revision 層級的自動調度，最少執行個體設為 2，新版本在切換流量之前就會有兩個待命的執行個體，不會有冷啟動。B 是服務層級的設定，不是針對新版本；D 設在舊版本上，對新版本沒幫助；A 用模擬工具送流量，管理負擔高。","t":["Cloud Run","Cloud Run Scaling","Traffic Splitting"]},{"n":320,"s":"You are managing a stateful application deployed on Google Kubernetes Engine (GKE) that can only have one replica. You recently discovered that the application becomes unstable at peak times. You have identified that the application needs more CPU than what has been configured in the manifest at these peak times. You want Kubernetes to allocate the application sufficient CPU resources during these peak times, while ensuring cost efficiency during off-peak periods. What should you do?","o":[{"l":"A","t":"Enable node auto-provisioning on the GKE cluster."},{"l":"B","t":"Configure a Vertical Pod Autoscaler on the Deployment."},{"l":"C","t":"Configure a Horizontal Pod Autoscaler on the Deployment."},{"l":"D","t":"Enable cluster autoscaling on the GKE cluster."}],"a":"B","e":"應用程式只能有一個副本，所以不能靠 HPA 增加 Pod 數量（C）。VPA 會依實際使用量調整 Pod 的 CPU requests，尖峰時給更多 CPU，離峰時降低，兼顧穩定和成本。節點自動佈建和叢集自動調度（A、D）只增減節點，不會讓這個 Pod 拿到更多 CPU。","t":["GKE","GKE Autoscaling"]},{"n":321,"s":"Your company runs a variety of applications and workloads on Google Cloud, and you are responsible for managing cloud costs. You need to identify a solution that enables you to perform detailed cost analysis. You also must be able to visualize the cost data in multiple ways on the same dashboard. What should you do?","o":[{"l":"A","t":"Use the cost breakdown report with the available filters from Cloud Billing to visualize the data."},{"l":"B","t":"Enable the Cloud Billing export to BigQuery, and use Looker Studio to visualize the data."},{"l":"C","t":"Run queries in Cloud Monitoring. Create dashboards to visualize the billing metrics."},{"l":"D","t":"Enable Cloud Monitoring metrics export to BigQuery, and use Looker to visualize the data."}],"a":"B","e":"要做詳細的費用分析，又要在同一個儀表板用多種方式呈現：把 Cloud Billing 匯出到 BigQuery，再用 Looker Studio 建立儀表板。A 的成本明細報表圖表種類有限；C、D 的 Cloud Monitoring 沒有完整的帳單資料。","t":["Cloud Billing","Billing Export","BigQuery","Looker Studio"]},{"n":322,"s":"Your digital media company stores a large number of video files on-premises. Each video file ranges from 100 MB to 100 GB. You are currently storing 150 TB of video data in your on-premises network, with no room for expansion. You need to migrate all infrequently accessed video files older than one year to Cloud Storage to ensure that on-premises storage remains available for new files. You must also minimize costs and control bandwidth usage. What should you do?","o":[{"l":"A","t":"Use Storage Transfer Service to move the data from the selected on-premises file storage systems to a Cloud Storage bucket."},{"l":"B","t":"Use Transfer Appliance to request an appliance. Load the data locally, and ship the appliance back to Google for ingestion into Cloud Storage."},{"l":"C","t":"Set up a Cloud Interconnect connection between the on-premises network and Google Cloud. Establish a private endpoint for Filestore access. Transfer the data from the existing Network File System (NFS) to Filestore."},{"l":"D","t":"Create a Cloud Storage bucket. Establish an Identity and Access Management (IAM) role with write permissions to the bucket. Use the gsutil tool to directly copy files over the network to Cloud Storage."}],"a":"A","e":"Storage Transfer Service 支援從地端檔案系統傳輸到 Cloud Storage，可以只挑選特定條件的檔案（例如超過一年的檔案），還能限制頻寬，又是全代管服務。Transfer Appliance（B）是一次性離線搬遷，不適合挑選特定檔案；C 的 Interconnect 和 Filestore 成本高，也不是封存方案；D 的 gsutil 無法有效控制頻寬，也要自己管理。","t":["Migration","Data Transfer","Storage Transfer Service","Cloud Storage"]},{"n":323,"s":"You are implementing a company-wide standard to control SSH access for your Google Cloud projects. You want to simplify SSH access management to your Compute Engine instances while maintaining audit compliance and eliminating as many manual steps as possible. What should you do?","o":[{"l":"A","t":"Configure a service account to add SSH keys for all VMs."},{"l":"B","t":"Configure metadata SSH keys to manage sudo access to instances."},{"l":"C","t":"Enable OS Login by using an organization policy for each Google Cloud project."},{"l":"D","t":"Enable OS Login with two-factor authentication for the domain."}],"a":"C","e":"用組織政策（constraints/compute.requireOsLogin）在各專案強制啟用 OS Login，SSH 存取改由 IAM 集中控管並留下稽核記錄，不用手動管理金鑰。A、B 用 metadata 中的 SSH 金鑰要手動管理，也難以稽核；D 的雙重驗證能提升安全性，但不是題目要的「簡化管理、減少手動步驟」的主要做法。","t":["Compute Engine","SSH Access","OS Login","Organization Policy"]},{"n":324,"s":"You are developing an internet of things (IoT) application that captures sensor data from multiple devices that have already been set up. You need to identify the global data storage product your company should use to store this data. You must ensure that the storage solution you choose meets your requirements of sub-millisecond latency. What should you do?","o":[{"l":"A","t":"Store the IoT data in Spanner. Use caches to speed up the process and avoid latencies."},{"l":"B","t":"Store the IoT data in Bigtable."},{"l":"C","t":"Capture IoT data in BigQuery datasets."},{"l":"D","t":"Store the IoT data in Cloud Storage. Implement caching by using Cloud CDN."}],"a":"B","e":"IoT 感測器資料寫入量大、讀寫延遲要低，最適合 Bigtable（全代管 NoSQL，延遲在毫秒等級，可大規模擴充）。Spanner（A）是交易型關聯式資料庫，延遲較高；BigQuery（C）是分析用；Cloud Storage 加 CDN（D）是加速物件下載，不是資料庫。","t":["Bigtable","Database Selection"]},{"n":325,"s":"Your company uses Pub/Sub for event-driven workloads. You have a subscription named email-updates attached to the new-orders topic. You need to fetch and acknowledge waiting messages from this subscription. What should you do?","o":[{"l":"A","t":"Use the gcloud pubsub subscriptions seek email-updates command."},{"l":"B","t":"Use the gcloud pubsub topics describe new-orders command."},{"l":"C","t":"Use the gcloud pubsub subscriptions pull email-updates --auto-ack command."},{"l":"D","t":"Use the gcloud pubsub topics list-subscriptions new-orders --filter=\"email-updates\" command."}],"a":"C","e":"gcloud pubsub subscriptions pull email-updates --auto-ack 會從這個訂閱拉取等待中的訊息，並自動確認（acknowledge）。seek（A）是把訂閱回溯到某個時間點；topics describe（B）只是查看 topic 資訊；list-subscriptions（D）只列出訂閱，不會拉取訊息。","t":["Pub/Sub","gcloud CLI"]},{"n":326,"s":"You need to create and manage service accounts for your workloads running on Google Cloud. You want to follow Google-recommended practices. What should you do? (Choose two.)","o":[{"l":"A","t":"Create as few service accounts as possible."},{"l":"B","t":"Delete any unused service accounts immediately."},{"l":"C","t":"Create single-purpose service accounts."},{"l":"D","t":"Manage service accounts as resources."},{"l":"E","t":"Use random names for the service accounts."}],"a":"CD","e":"Google 建議：每個 Service Account 只用於單一用途，權限才不會越加越多；並把 Service Account 當成資源來管理（控制誰能使用或冒用它，管理它的生命週期）。A 共用少數帳號會讓權限過大；B 應該先停用一段時間，確認沒影響再刪除；E 用隨機名稱很難管理。","t":["Service Account"]},{"n":327,"s":"Your company wants to migrate your data from an on-premises relational database to Google Cloud. Your current database can no longer scale with respect to the growth of your users, and you expect the number of users to rapidly grow. You need to choose a relational database that allows you to globally scale while minimizing your management and administration efforts. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use Cloud SQL."},{"l":"B","t":"Use Spanner."},{"l":"C","t":"Use Firestore."},{"l":"D","t":"Use BigQuery."}],"a":"B","e":"要全球擴充的關聯式資料庫，又要減少管理工作，選 Cloud Spanner（全代管、可水平擴充、全球分散）。Cloud SQL（A）擴充有上限；Firestore（C）不是關聯式資料庫；BigQuery（D）是分析用資料倉儲。","t":["Spanner","Database Selection","Migration"]},{"n":328,"s":"You are the Google Cloud systems administrator for your organization. User A reports that they received an error when attempting to access the Cloud SQL database in their Google Cloud project, while User B can access the database. You need to troubleshoot the issue for User A, while following Google-recommended practices. What should you do first?","o":[{"l":"A","t":"Confirm that network firewall rules are not blocking traffic for User A."},{"l":"B","t":"Verify that User A has the Identity and Access Management (IAM) Project Owner role assigned."},{"l":"C","t":"Review recent configuration changes that may have caused unintended modifications to permissions."},{"l":"D","t":"Review the error message that User A received."}],"a":"D","e":"排查問題的第一步是先看 User A 收到的錯誤訊息，它會告訴你是權限、網路還是驗證問題，再決定下一步。A、C 是在還沒看到錯誤前就猜原因；B 給 Project Owner 違反最小權限原則。","t":["Cloud SQL","Troubleshooting"]},{"n":329,"s":"You manage a VPC network in Google Cloud with a subnet that is rapidly approaching its private IP address capacity. You expect the number of Compute Engine VM instances in the same region to double within a week. You need to implement a Google-recommended solution that minimizes operational costs and does not require downtime. What should you do?","o":[{"l":"A","t":"Create a second VPC with the same subnet IP range, and connect this VPC to the existing VPC by using VPC Network Peering."},{"l":"B","t":"Delete the existing subnet, and create a new subnet with double the IP range available."},{"l":"C","t":"Permit additional traffic from the expected range of private IP addresses to reach your VMs by configuring firewall rules."},{"l":"D","t":"Use the Google Cloud CLI tool to expand the primary IP range of your subnet."}],"a":"D","e":"子網路的主要 IP 範圍可以直接擴大（gcloud compute networks subnets expand-ip-range），不用停機也不用改其他設定，成本最低。A 用相同 IP 範圍的 VPC 做 peering，範圍重疊行不通；B 刪除子網路要先移除所有 VM，會停機；C 防火牆規則不會增加可用的 IP。","t":["VPC","Subnets","gcloud CLI"]},{"n":330,"s":"You have developed a web application that serves traffic for a local event and are expecting unpredictable traffic. You have containerized the application, and you now want to deploy the application on Google Cloud. You also want to minimize costs. What should you do?","o":[{"l":"A","t":"Deploy the web application as a Cloud Run job."},{"l":"B","t":"Deploy the web application on Google Kubernetes Engine in Standard mode."},{"l":"C","t":"Deploy the web application as a Cloud Run service."},{"l":"D","t":"Deploy the web application on Google Kubernetes Engine in Autopilot mode."}],"a":"C","e":"網頁應用程式要服務使用者，流量又無法預測，選 Cloud Run 服務：依請求自動擴充，沒有流量時縮到 0，成本最低。Cloud Run job（A）是批次工作，不能接收網頁請求；GKE（B、D）會持續產生叢集費用。","t":["Cloud Run","Compute Selection","Cost Optimization"]},{"n":331,"s":"You host your website on Compute Engine. The number of global users visiting your website is rapidly expanding. You need to minimize latency and support user growth in multiple geographical regions. You also want to follow Google-recommended practices and minimize operational costs. Which two actions should you take? (Choose two.)","o":[{"l":"A","t":"Use an external Application Load Balancer in Regional mode."},{"l":"B","t":"Deploy your VMs in multiple Google Cloud regions closest to your user’s geographical locations."},{"l":"C","t":"Use a Network Load Balancer."},{"l":"D","t":"Use an external Application Load Balancer in Global mode."},{"l":"E","t":"Deploy all of your VMs in a single Google Cloud region with the largest available CIDR range."}],"a":"BD","e":"全球使用者快速成長，要降低延遲：在離使用者最近的多個區域部署 VM，再用全域模式的外部 Application Load Balancer，以單一 anycast IP 把使用者導向最近的區域。區域模式（A）只服務單一區域；Network Load Balancer（C）是區域性的；所有 VM 放在單一區域（E）無法降低其他地區使用者的延遲。","t":["Compute Engine","Load Balancing","Multi-Region"]},{"n":332,"s":"You are writing a shell script that includes a few gcloud CLI commands to access some Google Cloud resources. You want to test the script in your local development environment with a service account in the most secure way. What should you do?","o":[{"l":"A","t":"Generate an ID token for the service account. Use the token with the gcloud CLI commands."},{"l":"B","t":"Enable service account impersonation, and use the gcloud config set command to use it by default."},{"l":"C","t":"Download the service account key file and save it in a secure location. Set the GOOGLE_APPLICATION_CREDENTIALS environment variable to the key file."},{"l":"D","t":"Download the service account key file, and use it to generate an access token. Use the token with the gcloud CLI commands."}],"a":"B","e":"最安全的方式是啟用 Service Account 冒用（impersonation），用 gcloud config set auth/impersonate_service_account 設為預設，gcloud 會用你的身分取得短期憑證，不需要金鑰檔。C、D 下載金鑰檔有外洩風險；A 的 ID token 是用來呼叫特定服務的，不能拿來執行一般的 gcloud 指令。","t":["Service Account","Service Account Impersonation","gcloud CLI"]},{"n":333,"s":"Your company is active in the European Economic Area (EEA), and will adopt Google Cloud for its workloads. Projects are currently structured within different folders. You need to ensure any resources that will be deployed are using Google Cloud locations within the EEA by using the Organization Policy Service resource locations constraint. What should you do?","o":[{"l":"A","t":"Configure the policy at the folder level, and add all allowed locations to the policy."},{"l":"B","t":"Configure the policy at the organization level, and add all allowed locations to the policy."},{"l":"C","t":"Configure the policy at the folder level, and add all disallowed locations to the policy."},{"l":"D","t":"Configure the policy at the organization level, and add all disallowed locations to the policy."}],"a":"B","e":"資源位置限制條件（gcp.resourceLocations）設定在組織層級，所有資料夾和專案都會繼承，不會有遺漏。用「允許清單」只列出 EEA 的位置，比列出所有不允許的位置（C、D）安全，因為 Google 新增區域時不會被意外放行。設在資料夾層級（A、C）要每個資料夾分別設定。","t":["Organization Policy","Resource Hierarchy"]},{"n":334,"s":"You are deploying a large, multi-tiered application with more than 1,000 IP addresses in a Google Cloud project that needs to be securely isolated. The application includes the:\n1. web tier with frontend servers for public traffic,\n2. application tier with servers running core application logic that only need access from the web tier, and\n3. database tier with database servers that only need access from the application tier.\nYou want to minimize cost, complexity, and administrative overhead in the network architecture. What should you do?","o":[{"l":"A","t":"Create a /24 Shared VPC with separate subnets for each tier. Use firewall rules that reference network tags to control traffic."},{"l":"B","t":"Create one custom mode /16 VPC with three subnets. Place each tier in its own subnet and use firewall rules that reference IP subnets to control traffic."},{"l":"C","t":"Deploy each tier into a separate custom mode /16 VPUse VPC Network Peering to securely connect each custom mode VPManage firewall rules individually in each VPC."},{"l":"D","t":"Deploy each tier in a /24 VPC by using network tags to identify instances. Implement firewall rules for fine-grained network segmentation."}],"a":"B","e":"IP 超過 1,000 個，/24（只有 256 個位址）不夠用（A、D）。建立一個自訂模式的 /16 VPC，三層各放一個子網路，用參照子網路 IP 範圍的防火牆規則控制各層之間的流量，成本和複雜度最低。C 拆成三個 VPC 再做 peering，管理負擔大；單一專案也不需要 Shared VPC（A）。","t":["VPC","Subnets","Firewall Rules"]},{"n":335,"s":"Your company is closely monitoring their cloud spend. You need to allow different teams to monitor their Google Cloud costs. You must ensure that team members receive notifications when their cloud spend reaches certain thresholds and give team members the ability to create dashboards for additional insights with detailed billing data. You want to follow Google-recommended practices and minimize engineering costs. What should you do?","o":[{"l":"A","t":"Deploy Grafana to Compute Engine. Create a dashboard for each team that uses the data from the Cloud Billing API. Ask each team to create their own alerts in Cloud Monitoring."},{"l":"B","t":"Set up alerts for each team based on required thresholds. Create a shell script to read data from the Cloud Billing API, and push the results to BigQuery. Grant team members access to BigQuery."},{"l":"C","t":"Deploy Grafana to Compute Engine. Create a dashboard for each team that uses the data from the Cloud Billing Budget API. Ask each team to create their own alerts in Grafana."},{"l":"D","t":"Set up alerts for each team based on required thresholds. Set up billing exports to BigQuery. Grant team members access to BigQuery."}],"a":"D","e":"為各團隊依門檻設定預算快訊（自動通知），再把詳細帳單資料匯出到 BigQuery，授權團隊成員存取，他們就能自己建立儀表板，都是內建功能，工程成本最低。A、C 要自己架設 Grafana；B 要自己寫腳本讀取 API。","t":["Cloud Billing","Budget Alerts","Billing Export","BigQuery"]},{"n":336,"s":"Your company plans to migrate its on-premises PostgreSQL database to Google Cloud. The workloads are demanding, requiring fast transactional and analytical performance. You need to select a fully managed database service on Google Cloud. Your solution must also be able to synchronously replicate and optimize the storage layer. What should you do?","o":[{"l":"A","t":"Migrate the database to Cloud SQL for PostgreSQL by using Database Migration Service."},{"l":"B","t":"Use the psql client installed on a Compute Engine instance. Connect to the Cloud SQL instance to perform the database migration."},{"l":"C","t":"Migrate the database to AlloyDB for PostgreSQL by using Database Migration Service."},{"l":"D","t":"Create a Compute Engine instance. Install and configure PostgreSQL on the instance, and migrate the database."}],"a":"C","e":"AlloyDB for PostgreSQL 是全代管、與 PostgreSQL 相容的資料庫，有欄式引擎可以加速分析查詢，同時兼顧交易和分析效能；它的儲存層會跨可用區同步複製並自動最佳化。用 Database Migration Service 遷移，工作量最少。Cloud SQL（A、B）分析效能和儲存層都不如 AlloyDB；D 自己在 VM 上架設，不是代管服務。","t":["AlloyDB","Database Selection","Database Migration Service","Migration"]},{"n":337,"s":"Your company’s management has chosen Google Cloud as its strategic cloud provider. You need to provision Google Cloud identities for all employees in the IT and Data departments but not to other departments. This access should automatically update when employees change departments, join, or leave the company. All employees are managed centrally in an LDAP directory, with one organizational unit (OU) for each department. What should you do?","o":[{"l":"A","t":"Develop a containerized application that reads user information from the relevant OUs in the LDAP directory. Use the Directory API to create accounts in Cloud Identity for new users. Deploy the application as a scheduled Cloud Run job."},{"l":"B","t":"Develop a containerized application that reads user information from the relevant OUs in the LDAP directory. Use the Admin SDK to synchronize user accounts in Identity Platform with the LDAP directory. Deploy the application as a scheduled Cloud Run job."},{"l":"C","t":"Create a CSV file with the users from the relevant OUs. Upload the CSV file to Cloud Identity. Instruct your Human Resources department to repeat this process for any employee changes."},{"l":"D","t":"Configure Google Cloud Directory Sync to synchronize the relevant OUs between the LDAP directory and Cloud Identity. Set up a scheduled task that triggers a provisioning run."}],"a":"D","e":"Google Cloud Directory Sync（GCDS）可以把 LDAP 中指定 OU 的使用者同步到 Cloud Identity，排程執行後，員工加入、離職或換部門都會自動更新，不需要開發。A、B 要自己寫程式，B 的 Identity Platform 是給應用程式使用者登入用的，不是員工帳號；C 用 CSV 手動上傳，無法自動更新。","t":["Cloud Identity","Google Cloud Directory Sync"]},{"n":338,"s":"You are deploying a new frontend service for an online game. The service was built using a micro-frontend architecture and consists of multiple containers that interact using a service mesh. You need to control the number of compute instances that are running at a given time. What should you do?","o":[{"l":"A","t":"Create a Compute Engine instance template using a container-optimized virtual machine (VM) instance, and create a startup script that installs Istio service mesh. Deploy the service, and create a managed instance group with a fixed number of instances to run the service."},{"l":"B","t":"Create a Cloud Run service specifying the minimum and maximum number of instances, and configure the service to use Cloud Service Mesh. Deploy all the containers to the service."},{"l":"C","t":"Create a Google Kubernetes Engine (GKE) Autopilot cluster, and enable Cloud Service Mesh. Deploy the service, and use vertical and horizontal Pod autoscaling to control the cluster size."},{"l":"D","t":"Create a Google Kubernetes Engine (GKE) Standard cluster with a node pool that has a fixed number of nodes. Enable the Cloud Service Mesh add-on, and deploy the service."}],"a":"D","e":"要「控制運算執行個體的數量」，就用 GKE Standard 叢集，節點集區設定固定的節點數，再啟用 Cloud Service Mesh 外掛讓多個容器透過 service mesh 互動。Autopilot（C）由 Google 管理節點，無法控制數量；A 自己在 VM 上安裝 Istio，維運負擔大；Cloud Run（B）的執行個體不是你能直接控制的運算執行個體。","t":["GKE","GKE Node Pool","Cloud Service Mesh","Compute Selection"]},{"n":339,"s":"You are deploying a new internal web application behind an internal Application Load Balancer. The application must be accessible from both the VPC network and on-premises network using the domain name internal.altostrat.com. This name must not be resolvable from the public internet. Your on-premises network is connected to the VPC network by using Cloud VPN, and you have configured an inbound server policy. You need to resolve the domain name with the least administrative overhead. What should you do?","o":[{"l":"A","t":"Create an A record on the on-premises DNS server that points to the load balancer’s IP address."},{"l":"B","t":"Create a Cloud DNS managed private zone, authorize the VPC network to use it, and add an A record that points to the load balancer’s IP address."},{"l":"C","t":"Create a Cloud DNS managed public zone, and add an A record that points to the load balancer’s IP address."},{"l":"D","t":"On each employee’s workstation, edit the local HOSTS file to map the domain name to the load balancer’s IP address."}],"a":"B","e":"在 Cloud DNS 建立代管私人區域，授權給 VPC 網路使用，新增 A 記錄指向負載平衡器的 IP。VPC 內可以直接解析；地端則透過已設定的 inbound server policy 轉送查詢到 Cloud DNS，也能解析。公開區域（C）會讓網際網路查得到；在地端 DNS（A）或每台電腦的 HOSTS 檔（D）手動維護，管理負擔大。","t":["Cloud DNS","Load Balancing","Cloud VPN","Hybrid Connectivity"]},{"n":340,"s":"Your organization has created hundreds of service accounts for different applications hosted on-premises and in other clouds that use Google Cloud APIs. You need to audit the service account keys that have been created and identify the keys that are older than 90 days. What should you do?","o":[{"l":"A","t":"Execute the gcloud asset search-all-resources\n--scope=\"organizations/[ORG_ID]\"\n--query=\"createTime < [DATE_90_DAYS_AGO]\"\n--asset-types=\"apikeys.googleapis.com/Key\"\n--order-by=\"createTime\" command."},{"l":"B","t":"Execute the gcloud iam service-accounts list\n--filter=\"createTime < [DATE_90_DAYS_AGO]\" command."},{"l":"C","t":"Execute the gcloud tans keys list\n--filter=\"createTime < [DATE_90_DAYS_AGO]\" command."},{"l":"D","t":"Execute the gcloud asset search-all-resources\n--scope=\"organizations/[ORG_ID]\"\n--query=\"createTime < [DATE_90_DAYS_AGO]\"\n--asset-types=\"iam.googleapis.com/ServiceAccountKey\"\n--order-by=\"createTime\" command."}],"a":"D","e":"Cloud Asset Inventory 可以在整個組織範圍搜尋資源，指定資產類型 iam.googleapis.com/ServiceAccountKey，並用 createTime 篩選出超過 90 天的金鑰。A 的資產類型是 API 金鑰，不是 Service Account 金鑰；B 只列出 Service Account 本身，不是金鑰，而且只限單一專案；C 的指令有錯字，也不存在。","t":["Service Account Key","Cloud Asset Inventory","gcloud CLI"]},{"n":341,"s":"You are managing Google Cloud infrastructure with Terraform. The Terraform configuration files are stored in a Git repository. You need to implement a solution that enables multiple team members to work on the Terraform configurations concurrently without conflicts and ensures that sensitive values are not persisted to local machines. What should you do?","o":[{"l":"A","t":"Configure a local backend in Terraform, and deploy all changes by using a shared account on a bastion server."},{"l":"B","t":"Configure a Cloud Storage backend in Terraform."},{"l":"C","t":"Configure a local backend in Terraform, and store the state file in a Git repository."},{"l":"D","t":"Configure a local backend in Terraform, and manually share the Terraform state file with team members after every change."}],"a":"B","e":"把 Terraform backend 設在 Cloud Storage，狀態檔集中存放、支援狀態鎖定，多人同時作業不會互相覆蓋，狀態檔（可能包含敏感資訊）也不會存在個人電腦上。A、C、D 都用本機 backend，C 還把狀態檔放進 Git，敏感資訊會外洩。","t":["IAC","Terraform","Terraform Backend","Cloud Storage"]},{"n":342,"s":"You work for a large company that recently acquired three smaller startups. All of the startups’ Google Cloud resources must be centrally managed under a single Google Cloud organization. However, each startup has its own budget and financial reporting structure. You need to ensure that each startup receives a separate monthly invoice for its Google Cloud consumption. What should you do?","o":[{"l":"A","t":"Create a Google Cloud organization with a folder for each startup. Share a single Cloud Billing account, and use the detailed billing export to allocate costs."},{"l":"B","t":"Create a Google Cloud organization with a folder for each startup. Configure each startup to have its own Cloud Billing account."},{"l":"C","t":"Create a Google Cloud organization for each startup. Configure each startup to have its own Cloud Billing account."},{"l":"D","t":"Create a Google Cloud organization for each startup. Share a single Cloud Billing account, and use the detailed billing export to allocate costs."}],"a":"B","e":"三家新創都要在同一個組織下集中管理，所以在組織中為每家新創建一個資料夾；每家新創各自使用一個 Cloud Billing 帳戶，就能分別收到每月發票。A、D 共用一個帳單帳戶只會有一張發票；C、D 為每家建一個組織，就無法集中管理。","t":["Cloud Billing","Resource Hierarchy"]},{"n":343,"s":"You are troubleshooting a complex application failure. You found several cryptic error messages containing no personally identifiable information (PII) in Cloud Logging that you do not recognize. You need to understand the meaning of these logs and determine what actions to take as quickly as possible. What should you do first?","o":[{"l":"A","t":"Manually copy the error messages, and search for them in public forums and documentation."},{"l":"B","t":"Use Cloud Profiler to analyze the application’s performance during the time of the errors."},{"l":"C","t":"Use the “Explain this log entry” feature in Logs Explorer, and start a conversation with Gemini."},{"l":"D","t":"Search the application source code to determine the cause of the errors."}],"a":"C","e":"最快理解記錄意義的方法是使用 Logs Explorer 中的「Explain this log entry」，讓 Gemini 解釋這筆記錄並建議處理方式。這些記錄不含個人資料，可以安心使用。A、D 手動搜尋或翻原始碼都比較慢；B 的 Cloud Profiler 是分析效能的，不會解釋錯誤訊息。","t":["Cloud Logging","Gemini Cloud Assist","Troubleshooting"]},{"n":344,"s":"You are managing logging for your organization by aggregating logs into a centralized Google Cloud project. The aggregated logs come from two source projects: one for a frontend application and one for a backend application. You need to grant the frontend development team access to view all logs originating from the frontend project and only error-level logs from the backend project. The team must not be able to view any other logs. You want to follow the principle of least privilege and develop a cost-efficient solution. What should you do?","o":[{"l":"A","t":"• In the centralized logging project, craft a query that combines all logs from the frontend project and error-level logs from the backend project, and grant the logging.viewer IAM role.\n• Save and share this query with the frontend team for them to use in the Logs Explorer.\n• Request the frontend team not to use any other query."},{"l":"B","t":"• Create two separate log sinks in the centralized project.\n• Configure one sink to route all frontend logs to a new, dedicated Cloud Storage bucket.\n• Configure a second sink to route only the error-level logs from the backend project to that same bucket.\n• Grant the frontend team read-only access to this bucket."},{"l":"C","t":"• Grant the frontend team the logging.viewer IAM role on both the frontend project and the backend project.\n• Instruct the developers to use a specific filter in the Logs Explorer to find the logs they need."},{"l":"D","t":"• In the centralized logging project, create a log view on the bucket that contains the aggregated logs.\n• Filter the view to include all logs from the frontend project and only logs with a severity level of ERROR from the backend project.\n• Grant the frontend team the logging.viewAccessor IAM role on this specific view."}],"a":"D","e":"在集中記錄專案的記錄儲存桶上建立記錄檢視（log view），篩選出所有前端專案的記錄，以及後端專案中嚴重性為 ERROR 的記錄，再只授予前端團隊這個 view 的 roles/logging.viewAccessor。符合最小權限，也不會多存一份資料。A 只是請團隊自律，無法真正限制；B 另外複製一份記錄，增加儲存成本；C 讓團隊能看到後端所有記錄。","t":["Cloud Logging","Log Views","IAM","Least Privilege"]},{"n":345,"s":"You are managing resources in a Google Cloud project. A new service account needs the ability to invoke a Cloud Run service. You need to gain the permissions to modify IAM policies for service accounts while adhering to the principle of least privilege. What should you do?","o":[{"l":"A","t":"Request the roles/iam.serviceAccountAdmin role for your user account."},{"l":"B","t":"Request the roles/run.invoker role for your user account."},{"l":"C","t":"Request the Editor role for your user account."},{"l":"D","t":"Request the Owner role for your user account."}],"a":"A","e":"題目要你取得「修改 Service Account 的 IAM 政策」的權限，又要符合最小權限，roles/iam.serviceAccountAdmin 包含管理 Service Account 及其 IAM 政策的權限。run.invoker（B）只能呼叫 Cloud Run 服務，不能修改 IAM 政策；Editor 和 Owner（C、D）權限太大。","t":["IAM","IAM Predefined Roles","Service Account","Cloud Run","Least Privilege"]},{"n":346,"s":"You manage a Google Cloud project that contains a critical marketing application. You need to grant an external vendor read-only access to the objects stored in a specific Cloud Storage bucket. The vendor must not be able to view any other resources in the project. What should you do?","o":[{"l":"A","t":"Create a custom IAM role with the storage.objects.get permission, and grant the vendor this role on the project."},{"l":"B","t":"Grant the vendor the Storage Object User role on the project."},{"l":"C","t":"Grant the vendor the Storage Object User role on the bucket."},{"l":"D","t":"Grant the vendor the Storage Object Viewer role on the bucket."}],"a":"D","e":"只在那個 bucket 上授予廠商 Storage Object Viewer 角色，他就只能讀取這個 bucket 中的物件，看不到其他資源。A、B 授予在專案層級，可以存取所有 bucket；Storage Object User（B、C）還包含寫入和刪除物件的權限，不是唯讀。","t":["IAM","IAM Predefined Roles","Cloud Storage","Least Privilege"]},{"n":347,"s":"You manage IAM policies for your organization’s Google Cloud project. A new operations team needs the capability to start, stop, and reset existing Compute Engine VM instances within this project for basic troubleshooting. Due to strict security requirements, the operations team must be prevented from deleting any instances or modifying any networking or configuration settings. You need to grant the minimum necessary permissions to the team members. What should you do?","o":[{"l":"A","t":"Grant the operations team the roles/writer IAM role, and add the resource.type =='compute.googleapis.com/Instance' condition to the role."},{"l":"B","t":"Grant the operations team the predefined roles/compute.instanceAdmin.v1 IAM role on the project. Apply an IAM condition to exclude the compute.instances.delete permission."},{"l":"C","t":"Create a custom IAM role that includes only the compute.instances.start, compute.instances.stop, and compute.instances.reset permissions. Assign this role to the operations team on the project."},{"l":"D","t":"Grant the operations team the predefined roles/compute.viewer IAM role to allow them to view the instances. Instruct them to use the Google Cloud Console’s basic actions such as starting, stopping, and resetting."}],"a":"C","e":"只需要啟動、停止和重設 VM，就建立一個只包含 compute.instances.start、stop、reset 三個權限的自訂角色，授予營運團隊，是最小權限的做法。IAM 條件不能從角色中排除特定權限（B）；instanceAdmin.v1 還包含刪除和修改設定的權限；A 的 roles/writer 不是正確的角色；D 的 compute.viewer 只能查看，無法啟動或停止 VM。","t":["IAM","IAM Custom Role","Compute Engine","Least Privilege"]},{"n":348,"s":"You are conducting an audit of your Google Cloud organization. You need to identify all Compute Engine instances that have a public IP address. You want to implement a solution that is easy to maintain and uses Google Cloud managed services. What should you do?","o":[{"l":"A","t":"Enable the compute.vmExternalIpAccess organization policy at the organization level."},{"l":"B","t":"Use Cloud Shell and Gemini CLI to query the Compute Engine API for instances with a public IP address."},{"l":"C","t":"Use Cloud Asset Inventory to query for all Compute Engine instances with a public IP address."},{"l":"D","t":"Create a shell script using the gcloud CLI to find all instances with a public IP address."}],"a":"C","e":"Cloud Asset Inventory 是全代管服務，可以對整個組織查詢所有 Compute Engine 執行個體的設定，找出有外部 IP 的 VM，不需要維護腳本。A 的組織政策只能限制未來不能使用外部 IP，不會列出現有的 VM；B、D 要自己寫查詢或腳本，難以維護。","t":["Cloud Asset Inventory","Compute Engine"]},{"n":349,"s":"You are responsible for Google Cloud governance at your company and recently implemented a new, automated process for provisioning Google Cloud projects. You have discovered several projects that were manually created before the implementation of this new process. You need to identify the creators of these projects to inform them of the new process. What should you do?","o":[{"l":"A","t":"Review the value of the creator label attached to the project to find the project’s creator."},{"l":"B","t":"Use Resource Manager to identify the responsible department from the folder and project hierarchy."},{"l":"C","t":"Review the Cloud Billing account linked to the project, and then contact the owner of that billing account."},{"l":"D","t":"Use the IAM page in the Google Cloud console to identify the user with the Owner role."}],"a":"D","e":"專案建立者預設會被授予該專案的 Owner 角色，所以在 IAM 頁面查看誰有 Owner 角色，就能找到建立者。Google 不會自動幫專案加上「creator」標籤（A）；資料夾階層（B）和帳單帳戶擁有者（C）都不代表是誰建立了專案。補充：更精確的方法是在 Admin Activity 稽核記錄中查看 CreateProject 事件，但選項中沒有。","t":["IAM","Resource Hierarchy"]}],"g":[{"name":"運算 Compute","tags":["Compute Engine","MIG","MIG Autoscaling","Instance Template","Spot VM","Machine Types","Deletion Protection","Compute Selection"]},{"name":"容器 Containers","tags":["GKE","GKE Autopilot","GKE Node Pool","GKE Autoscaling","GKE Private Cluster","GKE Release Channels","Shielded Nodes","Kubernetes Workloads","Rolling Update","kubectl","Artifact Registry","Cloud Service Mesh","Hardware Accelerators","AI/ML Workloads"]},{"name":"無伺服器 Serverless","tags":["Cloud Run","Cloud Run Scaling","Cloud Run Jobs","Cloud Functions","App Engine","Traffic Splitting","Canary Deployment","Event-Driven","Eventarc","Cloud Scheduler","Cloud Tasks","Speech-to-Text API"]},{"name":"儲存 Storage","tags":["Cloud Storage","Storage Class","Object Lifecycle","Object Versioning","Signed URL","Cloud Storage Notifications","Persistent Disk","Hyperdisk","Snapshot","Filestore","Backup & Recovery"]},{"name":"資料庫 Databases","tags":["Database Selection","Cloud SQL","Cloud SQL Auth Proxy","Spanner","Bigtable","AlloyDB","Database Migration Service"]},{"name":"資料分析 Data","tags":["BigQuery","Pub/Sub","Dataflow","Dataproc","Looker Studio"]},{"name":"網路 Networking","tags":["VPC","Subnets","Firewall Rules","Hierarchical Firewall Policies","Shared VPC","VPC Peering","Private Google Access","Private Service Connect","Serverless VPC Access","Cloud NAT","Static IP","Load Balancing","SSL Certificates","Cloud DNS","Cloud VPN","Cloud Router","Hybrid Connectivity","Network Service Tiers","Multi-Region"]},{"name":"身分與安全 IAM & Security","tags":["IAM","IAM Custom Role","IAM Predefined Roles","Least Privilege","Service Account","Service Account Key","Service Account Impersonation","Workload Identity","Cross-Project Access","Google Groups","Cloud Identity","Google Cloud Directory Sync","MFA","Organization Policy","Resource Hierarchy","IAP","SSH Access","OS Login","Secret Manager","VM Manager","Cloud Asset Inventory"]},{"name":"維運 Operations","tags":["Cloud Logging","Cloud Audit Logs","Log Sink","Log-based Metrics","Log Analytics","Log Views","Ops Agent","Cloud Monitoring","Alerting","Gemini Cloud Assist","Troubleshooting","Quotas"]},{"name":"帳單與成本 Billing & Cost","tags":["Cloud Billing","Budget Alerts","Billing Export","Pricing Calculator","Cost Optimization"]},{"name":"IAC 與部署工具","tags":["IAC","Terraform","Terraform Backend","Deployment Manager","Config Connector","CI/CD","Multi-Cloud","gcloud CLI","gcloud storage","API Enablement","Cloud Marketplace"]},{"name":"遷移與高可用 Migration & HA","tags":["Migration","Data Transfer","Storage Transfer Service","Transfer Appliance","BigQuery Data Transfer Service","High Availability"]}]}</script>
<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('data').textContent);
var Q=D.q, byN={}; Q.forEach(function(q){byN[q.n]=q});
var KEY='ace-progress-v1';
var S={}, pending={};          // S[n]={p:"B",ok:true,star:true}
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
var ui={sel:new Set(),mode:'any',status:'all',q:'',tq:'',view:'list',idx:0,shuffle:false,sort:'group',resetting:false};
var focusList=[];
function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function need(q){return q.a.length}
function done(n){return S[n]&&S[n].p}

/* ---- filtering ---- */
function passBase(q){
  var s=S[q.n]||{};
  if(ui.status==='todo'&&s.p)return false;
  if(ui.status==='right'&&!(s.p&&s.ok))return false;
  if(ui.status==='wrong'&&!(s.p&&!s.ok))return false;
  if(ui.status==='star'&&!s.star)return false;
  if(ui.q){var h=(q.s+' '+q.o.map(function(o){return o.t}).join(' ')+' '+q.t.join(' ')+' #'+q.n).toLowerCase();
    if(ui.q.toLowerCase().split(/\s+/).filter(Boolean).some(function(w){return h.indexOf(w)<0}))return false}
  return true;
}
function passTags(q,sel){
  if(!sel.size)return true;
  var a=Array.from(sel);
  return ui.mode==='all'?a.every(function(t){return q.t.indexOf(t)>=0}):a.some(function(t){return q.t.indexOf(t)>=0});
}
function filtered(){return Q.filter(function(q){return passBase(q)&&passTags(q,ui.sel)})}
function rebuildFocus(){
  focusList=filtered().map(function(q){return q.n});
  if(ui.shuffle){for(var i=focusList.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=focusList[i];focusList[i]=focusList[j];focusList[j]=t}}
  ui.idx=0;
}

/* ---- persistence ---- */
var db=null,uid=null,dirty=false,writing=false,timer=null;
function setSync(t){$('sync').textContent=t}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function persist(){saveLocal();if(!db||!uid)return;dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}
function flush(){
  if(writing||!dirty)return;dirty=false;writing=true;
  db.doc('data/users/'+uid+'/progress').set({q:JSON.parse(JSON.stringify(S))}).then(function(){
    writing=false;setSync('進度已存到你的帳號，換裝置也看得到');if(dirty)flush();
  }).catch(function(){writing=false;setSync('這次沒存到帳號，進度暫存在這個瀏覽器')});
}
function connect(){
  if(!window.claude||!window.claude.use){setSync('進度存在這個瀏覽器');return}
  var waited=setTimeout(function(){setSync('暫時連不上帳號，進度先存在這個瀏覽器')},10000);
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];var user=r[1];
    if(!db||!user){clearTimeout(waited);setSync('進度存在這個瀏覽器');db=null;return null}
    return user.id().then(function(id){
      if(!id){clearTimeout(waited);db=null;setSync('進度存在這個瀏覽器');return null}
      uid=id;
      return db.doc('data/users/'+uid+'/progress').get().then(function(snap){
        clearTimeout(waited);
        if(snap.exists){var d=snap.data();S=JSON.parse(JSON.stringify(d.q||{}));saveLocal();rebuildFocus();renderAll()}
        else if(Object.keys(S).length){dirty=true;flush()}
        setSync('進度已存到你的帳號，換裝置也看得到');
      });
    });
  }).catch(function(){clearTimeout(waited);db=null;setSync('進度存在這個瀏覽器')});
}

/* ---- answering ---- */
function submit(q,picked){
  var p=picked.slice().sort().join('');
  S[q.n]=Object.assign({},S[q.n],{p:p,ok:p===q.a.split('').sort().join('')});
  delete pending[q.n];persist();afterChange(q);
}
function choose(q,l){
  if(done(q.n))return;
  if(need(q)===1){submit(q,[l]);return}
  var cur=pending[q.n]||(pending[q.n]=[]),i=cur.indexOf(l);
  if(i>=0)cur.splice(i,1);else cur.push(l);
  if(cur.length===need(q))submit(q,cur);else repaint(q);
}
function redo(q){var s=S[q.n];if(!s)return;if(s.star)S[q.n]={star:true};else delete S[q.n];persist();afterChange(q)}
function star(q){var s=S[q.n]||{};if(s.star){delete s.star;if(s.p)S[q.n]=s;else delete S[q.n]}else{s.star=true;S[q.n]=s}persist();afterChange(q)}
function repaint(q){var c=$('q'+q.n);if(c)c.replaceWith(card(q))}
function afterChange(q){repaint(q);renderProgress();renderTagState();if(ui.view==='map')renderView()}

/* ---- card ---- */
function card(q){
  var s=S[q.n]||{},answered=!!s.p,sec=el('article','sheet');sec.id='q'+q.n;
  var h=el('div','sheet-head');h.appendChild(el('span','num','#'+q.n));
  if(need(q)>1)h.appendChild(el('span','pill','複選 '+need(q)));
  var b=el('button','star',s.star?'★ 已標記':'☆ 標記');b.setAttribute('aria-pressed',!!s.star);b.onclick=function(){star(q)};h.appendChild(b);
  sec.appendChild(h);sec.appendChild(el('p','stem',q.s));
  var ol=el('ol','opts');
  var pick=answered?s.p.split(''):(pending[q.n]||[]);
  q.o.forEach(function(o){
    var li=el('li'),btn=el('button','opt');btn.disabled=answered;btn.onclick=function(){choose(q,o.l)};
    var isA=q.a.indexOf(o.l)>=0,isP=pick.indexOf(o.l)>=0,flag='';
    if(answered){if(isA){btn.classList.add('right');flag='正確答案'}else if(isP){btn.classList.add('wrong');flag='你選的'}}
    else if(isP)btn.classList.add('picked');
    btn.setAttribute('aria-pressed',isP);
    btn.appendChild(el('span','bubble',o.l));
    var t=el('span','otext',o.t);if(flag)t.appendChild(el('span','flag',flag));btn.appendChild(t);
    li.appendChild(btn);ol.appendChild(li);
  });
  sec.appendChild(ol);
  if(answered){
    var f=el('div','foot');
    f.appendChild(el('span','verdict '+(s.ok?'ok':'no'),s.ok?'答對了':'答錯了，正確答案是 '+q.a));
    var r=el('button','redo','重做這題');r.onclick=function(){redo(q)};f.appendChild(r);sec.appendChild(f);
    if(q.e){var w=el('p','why');w.appendChild(el('b',null,'解析'));w.appendChild(document.createTextNode(q.e));sec.appendChild(w)}
  }
  var tg=el('div','tags');
  q.t.forEach(function(t){var c=el('button','tag'+(ui.sel.has(t)?' on':''),t);c.title='篩選這個標籤';c.onclick=function(){toggleTag(t)};tg.appendChild(c)});
  sec.appendChild(tg);
  return sec;
}

/* ---- panel ---- */
var tagBtns={},groupEls=[];
function buildPanel(){
  seg('status',[['all','全部'],['todo','未作答'],['wrong','答錯'],['right','答對'],['star','已標記']],'status');
  seg('mode',[['any','符合任一'],['all','全部符合']],'mode');
  var g=$('groups');
  D.g.forEach(function(gr){
    var d=el('details','group');d.open=true;d.appendChild(el('summary',null,gr.name));
    var list=el('div','taglist');
    gr.tags.forEach(function(t){
      var b=el('button','tag');b.appendChild(document.createTextNode(t));var sm=el('small');b.appendChild(sm);
      b.onclick=function(){toggleTag(t)};tagBtns[t]={b:b,sm:sm};list.appendChild(b);
    });
    d.appendChild(list);g.appendChild(d);groupEls.push({d:d,tags:gr.tags});
  });
  var q=$('q');q.addEventListener('input',function(){ui.q=q.value.trim();filterChanged()});
  var tq=$('tq');tq.addEventListener('input',function(){ui.tq=tq.value.trim().toLowerCase();renderTagState()});
  $('filtersBtn').onclick=function(){var o=$('panel').classList.toggle('open');this.setAttribute('aria-expanded',o);this.textContent=o?'收起篩選':'篩選'};
  var tabs=$('tabs');[['list','題庫'],['focus','一題一題'],['map','考點總覽']].forEach(function(t){
    var b=el('button',null,t[1]);b.setAttribute('role','tab');b.dataset.v=t[0];b.onclick=function(){ui.view=t[0];if(t[0]==='focus')rebuildFocus();renderTop();renderView();window.scrollTo(0,0)};tabs.appendChild(b);
  });
}
function seg(id,opts,key){
  var box=$(id);opts.forEach(function(o){var b=el('button',null,o[1]);b.dataset.v=o[0];
    b.onclick=function(){ui[key]=o[0];filterChanged()};box.appendChild(b)});
}
function toggleTag(t){if(ui.sel.has(t))ui.sel.delete(t);else ui.sel.add(t);if(ui.view==='map')ui.view='list';filterChanged()}
function filterChanged(){rebuildFocus();renderTop();renderTagState();renderView()}
function renderTagState(){
  ['status','mode'].forEach(function(k){Array.from($(k).children).forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===ui[k])})});
  var base=Q.filter(passBase);
  Object.keys(tagBtns).forEach(function(t){
    var trial=new Set(ui.mode==='all'?Array.from(ui.sel).concat([t]):[t]);
    var c=base.filter(function(q){return passTags(q,trial)}).length,x=tagBtns[t],on=ui.sel.has(t);
    x.sm.textContent=c;x.b.setAttribute('aria-pressed',on);x.b.disabled=!c&&!on;
    x.b.hidden=!!ui.tq&&t.toLowerCase().indexOf(ui.tq)<0;
  });
