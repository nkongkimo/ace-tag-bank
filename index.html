,"Compute Selection"]},{"n":313,"s":"You recently discovered an issue with your rolling update in Google Kubernetes Engine (GKE). You now need to roll back a rolling update. What should you do?","o":[{"l":"A","t":"Delete the deployment."},{"l":"B","t":"Use the kubectl rollout restart command to revert the deployment."},{"l":"C","t":"Use the kubectl rollout undo command."},{"l":"D","t":"Manually scale down the new Pods and scale up the old Pods."}],"a":"C","t":["GKE","Rolling Update","kubectl"]},{"n":314,"s":"You are deploying an application to Google Kubernetes Engine (GKE) that needs to call an external third-party API. You need to provide the external API vendor with a list of IP addresses for their firewall to allow traffic from your application. You want to follow Google-recommended practices and avoid any risk of interrupting traffic to the API due to IP address changes. What should you do?","o":[{"l":"A","t":"Configure your GKE cluster with one node, and set the node to have a static external IP address. Ensure that the GKE cluster autoscaler is off. Send the external IP address of the node to the vendor to be added to the allowlist."},{"l":"B","t":"Configure your GKE cluster with private nodes. Configure a Cloud NAT instance with static IP addresses. Provide these IP addresses to the vendor to be added to the allowlist."},{"l":"C","t":"Configure your GKE cluster with private nodes. Configure a Cloud NAT instance with dynamic IP addresses. Provide these IP addresses to the vendor to be added to the allowlist."},{"l":"D","t":"Configure your GKE cluster with public nodes. Write a Cloud Function that pulls the public IP addresses of each node in the cluster, Trigger the function to run every day with Cloud Scheduler. Send the list to the vendor by email every day."}],"a":"B","t":["GKE","GKE Private Cluster","Cloud NAT","Static IP"]},{"n":315,"s":"You are planning to move your company's website and a specific asynchronous background job to Google Cloud. Your website contains only static HTML content. The background job is started through an HTTP endpoint and generates monthly invoices for your customers. Your website needs to be available in multiple geographic locations and requires autoscaling. You want to have no costs when your workloads are not in use and follow recommended practices. What should you do?","o":[{"l":"A","t":"Move your website to Google Kubernetes Engine (GKE), and move your background job to Cloud Functions."},{"l":"B","t":"Move both your website and background job to Compute Engine."},{"l":"C","t":"Move both your website and background job to Cloud Run."},{"l":"D","t":"Move your website to Google Kubernetes Engine (GKE), and move your background job to Compute Engine."}],"a":"C","t":["Cloud Run","Compute Selection","Migration","Cost Optimization"]},{"n":316,"s":"Your company wants to provide engineers with access to explore Google Cloud freely in a sandbox environment. The total budget for testing across your organization is $1,000. You need to ensure that engineers are notified when the budget is about to be reached. You want to automate your solution as much as possible. What should you do?","o":[{"l":"A","t":"Create a separate Cloud Billing account for all sandbox projects. Link a credit card with a limit of $1,000 to this billing account. Ensure all sandbox projects are linked to this new Cloud Billing account."},{"l":"B","t":"Create a Google Cloud Folder and ensure that all sandbox projects are located under that Folder. Create a Budget Alert for $1,000 and scope it to the Folder. Configure an email alert to billing administrators and users once the budget is 90% reached."},{"l":"C","t":"Create an email template reminding people to regularly check their Google Cloud spend. Create a Cloud Function that sends the email to all the project owners. Create a daily job in Cloud Scheduler that triggers the Cloud Function. Deploy this solution for each sandbox."},{"l":"D","t":"Configure a billing data export to a BigQuery dataset on the Cloud Billing account. Create a dashboard for all costs related to the sandbox experiments. Share the dashboard with all engineers."}],"a":"B","t":["Cloud Billing","Budget Alerts","Resource Hierarchy"]},{"n":317,"s":"You are planning to migrate your on-premises VMs to Google Cloud. You need to set up a landing zone in Google Cloud before migrating the VMs. You must ensure that all VM in your production environment can communicate with each other through private IP addresses. You need to allow all VMs in your Google Cloud organization to accept connections on specific TCP ports. You want to follow Google-recommended practices, and you need to minimize your operational costs. What should you do?","o":[{"l":"A","t":"Create individual VPCs per Google Cloud project. Peer all he VPC together. Apply organization policies on the organization level."},{"l":"B","t":"Create individual VPCs for each Google Cloud project. Peer ail ne VPCs together. Apply hierarchical firewall policies on the organization level."},{"l":"C","t":"Create a host VPC project with each production project as its service project. Apply organization policies on the organization level."},{"l":"D","t":"Create a host VPC project with each production project as its service project. Apply hierarchical firewall policies on the organization level."}],"a":"D","t":["Shared VPC","Hierarchical Firewall Policies","Migration"]},{"n":318,"s":"You assist different engineering teams in deploying their infrastructure on Google Cloud. Your company has defined certain practices required for all workloads. You need to provide the engineering teams with a solution that enables teams to deploy their infrastructure independently without having to know all implementation details of the company’s required practices. What should you do?","o":[{"l":"A","t":"Configure organization policies to enforce your company's required practices. Ask the teams to provision their infrastructure by using the Google Cloud console."},{"l":"B","t":"Create a service account per team, and grant the service account the Project Editor role. Ask the teams to provision their infrastructure through the Google Cloud CLI (gcloud CL), while impersonating their dedicated service account."},{"l":"C","t":"Write Terraform modules for each component that are compliant with the company's required practices, and ask teams to implement their infrastructure through these modules."},{"l":"D","t":"Provide training for all engineering teams you work with to understand the company’s required practices. Allow the engineering teams to provision the infrastructure to best meet their needs."}],"a":"C","t":["IAC","Terraform"]},{"n":319,"s":"You ate managing an application deployed on Cloud Run. The development team has released a new version of the application. You want to deploy and redirect traffic to this new version of the application. To ensure traffic to the new version of the application is served with no startup time, you want to ensure that there are two idle instances available for incoming traffic before adjusting the traffic flow. You also want to minimize administrative overhead. What should you do?","o":[{"l":"A","t":"Ensure the checkbox “Serve this revision immediately” is unchecked when deploying the new revision. Before changing the traffic rules, use a traffic simulation tool to send load to the new revision."},{"l":"B","t":"Configure service autoscaling and set the minimum number of instances to 2."},{"l":"C","t":"Configure revision autoscaling for the new revision and set the minimum number of instances to 2."},{"l":"D","t":"Configure revision autoscaling for the existing revision and set the minimum number of instances to 2."}],"a":"C","t":["Cloud Run","Cloud Run Scaling","Traffic Splitting"]},{"n":320,"s":"You are managing a stateful application deployed on Google Kubernetes Engine (GKE) that can only have one replica. You recently discovered that the application becomes unstable at peak times. You have identified that the application needs more CPU than what has been configured in the manifest at these peak times. You want Kubernetes to allocate the application sufficient CPU resources during these peak times, while ensuring cost efficiency during off-peak periods. What should you do?","o":[{"l":"A","t":"Enable node auto-provisioning on the GKE cluster."},{"l":"B","t":"Configure a Vertical Pod Autoscaler on the Deployment."},{"l":"C","t":"Configure a Horizontal Pod Autoscaler on the Deployment."},{"l":"D","t":"Enable cluster autoscaling on the GKE cluster."}],"a":"B","t":["GKE","GKE Autoscaling"]},{"n":321,"s":"Your company runs a variety of applications and workloads on Google Cloud, and you are responsible for managing cloud costs. You need to identify a solution that enables you to perform detailed cost analysis. You also must be able to visualize the cost data in multiple ways on the same dashboard. What should you do?","o":[{"l":"A","t":"Use the cost breakdown report with the available filters from Cloud Billing to visualize the data."},{"l":"B","t":"Enable the Cloud Billing export to BigQuery, and use Looker Studio to visualize the data."},{"l":"C","t":"Run queries in Cloud Monitoring. Create dashboards to visualize the billing metrics."},{"l":"D","t":"Enable Cloud Monitoring metrics export to BigQuery, and use Looker to visualize the data."}],"a":"B","t":["Cloud Billing","Billing Export","BigQuery","Looker Studio"]},{"n":322,"s":"Your digital media company stores a large number of video files on-premises. Each video file ranges from 100 MB to 100 GB. You are currently storing 150 TB of video data in your on-premises network, with no room for expansion. You need to migrate all infrequently accessed video files older than one year to Cloud Storage to ensure that on-premises storage remains available for new files. You must also minimize costs and control bandwidth usage. What should you do?","o":[{"l":"A","t":"Use Storage Transfer Service to move the data from the selected on-premises file storage systems to a Cloud Storage bucket."},{"l":"B","t":"Use Transfer Appliance to request an appliance. Load the data locally, and ship the appliance back to Google for ingestion into Cloud Storage."},{"l":"C","t":"Set up a Cloud Interconnect connection between the on-premises network and Google Cloud. Establish a private endpoint for Filestore access. Transfer the data from the existing Network File System (NFS) to Filestore."},{"l":"D","t":"Create a Cloud Storage bucket. Establish an Identity and Access Management (IAM) role with write permissions to the bucket. Use the gsutil tool to directly copy files over the network to Cloud Storage."}],"a":"A","t":["Migration","Data Transfer","Storage Transfer Service","Cloud Storage"]},{"n":323,"s":"You are implementing a company-wide standard to control SSH access for your Google Cloud projects. You want to simplify SSH access management to your Compute Engine instances while maintaining audit compliance and eliminating as many manual steps as possible. What should you do?","o":[{"l":"A","t":"Configure a service account to add SSH keys for all VMs."},{"l":"B","t":"Configure metadata SSH keys to manage sudo access to instances."},{"l":"C","t":"Enable OS Login by using an organization policy for each Google Cloud project."},{"l":"D","t":"Enable OS Login with two-factor authentication for the domain."}],"a":"C","t":["Compute Engine","SSH Access","OS Login","Organization Policy"]},{"n":324,"s":"You are developing an internet of things (IoT) application that captures sensor data from multiple devices that have already been set up. You need to identify the global data storage product your company should use to store this data. You must ensure that the storage solution you choose meets your requirements of sub-millisecond latency. What should you do?","o":[{"l":"A","t":"Store the IoT data in Spanner. Use caches to speed up the process and avoid latencies."},{"l":"B","t":"Store the IoT data in Bigtable."},{"l":"C","t":"Capture IoT data in BigQuery datasets."},{"l":"D","t":"Store the IoT data in Cloud Storage. Implement caching by using Cloud CDN."}],"a":"B","t":["Bigtable","Database Selection"]},{"n":325,"s":"Your company uses Pub/Sub for event-driven workloads. You have a subscription named email-updates attached to the new-orders topic. You need to fetch and acknowledge waiting messages from this subscription. What should you do?","o":[{"l":"A","t":"Use the gcloud pubsub subscriptions seek email-updates command."},{"l":"B","t":"Use the gcloud pubsub topics describe new-orders command."},{"l":"C","t":"Use the gcloud pubsub subscriptions pull email-updates --auto-ack command."},{"l":"D","t":"Use the gcloud pubsub topics list-subscriptions new-orders --filter=\"email-updates\" command."}],"a":"C","t":["Pub/Sub","gcloud CLI"]},{"n":326,"s":"You need to create and manage service accounts for your workloads running on Google Cloud. You want to follow Google-recommended practices. What should you do? (Choose two.)","o":[{"l":"A","t":"Create as few service accounts as possible."},{"l":"B","t":"Delete any unused service accounts immediately."},{"l":"C","t":"Create single-purpose service accounts."},{"l":"D","t":"Manage service accounts as resources."},{"l":"E","t":"Use random names for the service accounts."}],"a":"CD","t":["Service Account"]},{"n":327,"s":"Your company wants to migrate your data from an on-premises relational database to Google Cloud. Your current database can no longer scale with respect to the growth of your users, and you expect the number of users to rapidly grow. You need to choose a relational database that allows you to globally scale while minimizing your management and administration efforts. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use Cloud SQL."},{"l":"B","t":"Use Spanner."},{"l":"C","t":"Use Firestore."},{"l":"D","t":"Use BigQuery."}],"a":"B","t":["Spanner","Database Selection","Migration"]},{"n":328,"s":"You are the Google Cloud systems administrator for your organization. User A reports that they received an error when attempting to access the Cloud SQL database in their Google Cloud project, while User B can access the database. You need to troubleshoot the issue for User A, while following Google-recommended practices. What should you do first?","o":[{"l":"A","t":"Confirm that network firewall rules are not blocking traffic for User A."},{"l":"B","t":"Verify that User A has the Identity and Access Management (IAM) Project Owner role assigned."},{"l":"C","t":"Review recent configuration changes that may have caused unintended modifications to permissions."},{"l":"D","t":"Review the error message that User A received."}],"a":"D","t":["Cloud SQL","Troubleshooting"]},{"n":329,"s":"You manage a VPC network in Google Cloud with a subnet that is rapidly approaching its private IP address capacity. You expect the number of Compute Engine VM instances in the same region to double within a week. You need to implement a Google-recommended solution that minimizes operational costs and does not require downtime. What should you do?","o":[{"l":"A","t":"Create a second VPC with the same subnet IP range, and connect this VPC to the existing VPC by using VPC Network Peering."},{"l":"B","t":"Delete the existing subnet, and create a new subnet with double the IP range available."},{"l":"C","t":"Permit additional traffic from the expected range of private IP addresses to reach your VMs by configuring firewall rules."},{"l":"D","t":"Use the Google Cloud CLI tool to expand the primary IP range of your subnet."}],"a":"D","t":["VPC","Subnets","gcloud CLI"]},{"n":330,"s":"You have developed a web application that serves traffic for a local event and are expecting unpredictable traffic. You have containerized the application, and you now want to deploy the application on Google Cloud. You also want to minimize costs. What should you do?","o":[{"l":"A","t":"Deploy the web application as a Cloud Run job."},{"l":"B","t":"Deploy the web application on Google Kubernetes Engine in Standard mode."},{"l":"C","t":"Deploy the web application as a Cloud Run service."},{"l":"D","t":"Deploy the web application on Google Kubernetes Engine in Autopilot mode."}],"a":"C","t":["Cloud Run","Compute Selection","Cost Optimization"]},{"n":331,"s":"You host your website on Compute Engine. The number of global users visiting your website is rapidly expanding. You need to minimize latency and support user growth in multiple geographical regions. You also want to follow Google-recommended practices and minimize operational costs. Which two actions should you take? (Choose two.)","o":[{"l":"A","t":"Use an external Application Load Balancer in Regional mode."},{"l":"B","t":"Deploy your VMs in multiple Google Cloud regions closest to your user’s geographical locations."},{"l":"C","t":"Use a Network Load Balancer."},{"l":"D","t":"Use an external Application Load Balancer in Global mode."},{"l":"E","t":"Deploy all of your VMs in a single Google Cloud region with the largest available CIDR range."}],"a":"BD","t":["Compute Engine","Load Balancing","Multi-Region"]},{"n":332,"s":"You are writing a shell script that includes a few gcloud CLI commands to access some Google Cloud resources. You want to test the script in your local development environment with a service account in the most secure way. What should you do?","o":[{"l":"A","t":"Generate an ID token for the service account. Use the token with the gcloud CLI commands."},{"l":"B","t":"Enable service account impersonation, and use the gcloud config set command to use it by default."},{"l":"C","t":"Download the service account key file and save it in a secure location. Set the GOOGLE_APPLICATION_CREDENTIALS environment variable to the key file."},{"l":"D","t":"Download the service account key file, and use it to generate an access token. Use the token with the gcloud CLI commands."}],"a":"B","t":["Service Account","Service Account Impersonation","gcloud CLI"]},{"n":333,"s":"Your company is active in the European Economic Area (EEA), and will adopt Google Cloud for its workloads. Projects are currently structured within different folders. You need to ensure any resources that will be deployed are using Google Cloud locations within the EEA by using the Organization Policy Service resource locations constraint. What should you do?","o":[{"l":"A","t":"Configure the policy at the folder level, and add all allowed locations to the policy."},{"l":"B","t":"Configure the policy at the organization level, and add all allowed locations to the policy."},{"l":"C","t":"Configure the policy at the folder level, and add all disallowed locations to the policy."},{"l":"D","t":"Configure the policy at the organization level, and add all disallowed locations to the policy."}],"a":"B","t":["Organization Policy","Resource Hierarchy"]},{"n":334,"s":"You are deploying a large, multi-tiered application with more than 1,000 IP addresses in a Google Cloud project that needs to be securely isolated. The application includes the:\n1. web tier with frontend servers for public traffic,\n2. application tier with servers running core application logic that only need access from the web tier, and\n3. database tier with database servers that only need access from the application tier.\nYou want to minimize cost, complexity, and administrative overhead in the network architecture. What should you do?","o":[{"l":"A","t":"Create a /24 Shared VPC with separate subnets for each tier. Use firewall rules that reference network tags to control traffic."},{"l":"B","t":"Create one custom mode /16 VPC with three subnets. Place each tier in its own subnet and use firewall rules that reference IP subnets to control traffic."},{"l":"C","t":"Deploy each tier into a separate custom mode /16 VPUse VPC Network Peering to securely connect each custom mode VPManage firewall rules individually in each VPC."},{"l":"D","t":"Deploy each tier in a /24 VPC by using network tags to identify instances. Implement firewall rules for fine-grained network segmentation."}],"a":"B","t":["VPC","Subnets","Firewall Rules"]},{"n":335,"s":"Your company is closely monitoring their cloud spend. You need to allow different teams to monitor their Google Cloud costs. You must ensure that team members receive notifications when their cloud spend reaches certain thresholds and give team members the ability to create dashboards for additional insights with detailed billing data. You want to follow Google-recommended practices and minimize engineering costs. What should you do?","o":[{"l":"A","t":"Deploy Grafana to Compute Engine. Create a dashboard for each team that uses the data from the Cloud Billing API. Ask each team to create their own alerts in Cloud Monitoring."},{"l":"B","t":"Set up alerts for each team based on required thresholds. Create a shell script to read data from the Cloud Billing API, and push the results to BigQuery. Grant team members access to BigQuery."},{"l":"C","t":"Deploy Grafana to Compute Engine. Create a dashboard for each team that uses the data from the Cloud Billing Budget API. Ask each team to create their own alerts in Grafana."},{"l":"D","t":"Set up alerts for each team based on required thresholds. Set up billing exports to BigQuery. Grant team members access to BigQuery."}],"a":"D","t":["Cloud Billing","Budget Alerts","Billing Export","BigQuery"]},{"n":336,"s":"Your company plans to migrate its on-premises PostgreSQL database to Google Cloud. The workloads are demanding, requiring fast transactional and analytical performance. You need to select a fully managed database service on Google Cloud. Your solution must also be able to synchronously replicate and optimize the storage layer. What should you do?","o":[{"l":"A","t":"Migrate the database to Cloud SQL for PostgreSQL by using Database Migration Service."},{"l":"B","t":"Use the psql client installed on a Compute Engine instance. Connect to the Cloud SQL instance to perform the database migration."},{"l":"C","t":"Migrate the database to AlloyDB for PostgreSQL by using Database Migration Service."},{"l":"D","t":"Create a Compute Engine instance. Install and configure PostgreSQL on the instance, and migrate the database."}],"a":"C","t":["AlloyDB","Database Selection","Database Migration Service","Migration"]},{"n":337,"s":"Your company’s management has chosen Google Cloud as its strategic cloud provider. You need to provision Google Cloud identities for all employees in the IT and Data departments but not to other departments. This access should automatically update when employees change departments, join, or leave the company. All employees are managed centrally in an LDAP directory, with one organizational unit (OU) for each department. What should you do?","o":[{"l":"A","t":"Develop a containerized application that reads user information from the relevant OUs in the LDAP directory. Use the Directory API to create accounts in Cloud Identity for new users. Deploy the application as a scheduled Cloud Run job."},{"l":"B","t":"Develop a containerized application that reads user information from the relevant OUs in the LDAP directory. Use the Admin SDK to synchronize user accounts in Identity Platform with the LDAP directory. Deploy the application as a scheduled Cloud Run job."},{"l":"C","t":"Create a CSV file with the users from the relevant OUs. Upload the CSV file to Cloud Identity. Instruct your Human Resources department to repeat this process for any employee changes."},{"l":"D","t":"Configure Google Cloud Directory Sync to synchronize the relevant OUs between the LDAP directory and Cloud Identity. Set up a scheduled task that triggers a provisioning run."}],"a":"D","t":["Cloud Identity","Google Cloud Directory Sync"]},{"n":338,"s":"You are deploying a new frontend service for an online game. The service was built using a micro-frontend architecture and consists of multiple containers that interact using a service mesh. You need to control the number of compute instances that are running at a given time. What should you do?","o":[{"l":"A","t":"Create a Compute Engine instance template using a container-optimized virtual machine (VM) instance, and create a startup script that installs Istio service mesh. Deploy the service, and create a managed instance group with a fixed number of instances to run the service."},{"l":"B","t":"Create a Cloud Run service specifying the minimum and maximum number of instances, and configure the service to use Cloud Service Mesh. Deploy all the containers to the service."},{"l":"C","t":"Create a Google Kubernetes Engine (GKE) Autopilot cluster, and enable Cloud Service Mesh. Deploy the service, and use vertical and horizontal Pod autoscaling to control the cluster size."},{"l":"D","t":"Create a Google Kubernetes Engine (GKE) Standard cluster with a node pool that has a fixed number of nodes. Enable the Cloud Service Mesh add-on, and deploy the service."}],"a":"D","t":["GKE","GKE Node Pool","Cloud Service Mesh","Compute Selection"]},{"n":339,"s":"You are deploying a new internal web application behind an internal Application Load Balancer. The application must be accessible from both the VPC network and on-premises network using the domain name internal.altostrat.com. This name must not be resolvable from the public internet. Your on-premises network is connected to the VPC network by using Cloud VPN, and you have configured an inbound server policy. You need to resolve the domain name with the least administrative overhead. What should you do?","o":[{"l":"A","t":"Create an A record on the on-premises DNS server that points to the load balancer’s IP address."},{"l":"B","t":"Create a Cloud DNS managed private zone, authorize the VPC network to use it, and add an A record that points to the load balancer’s IP address."},{"l":"C","t":"Create a Cloud DNS managed public zone, and add an A record that points to the load balancer’s IP address."},{"l":"D","t":"On each employee’s workstation, edit the local HOSTS file to map the domain name to the load balancer’s IP address."}],"a":"B","t":["Cloud DNS","Load Balancing","Cloud VPN","Hybrid Connectivity"]},{"n":340,"s":"Your organization has created hundreds of service accounts for different applications hosted on-premises and in other clouds that use Google Cloud APIs. You need to audit the service account keys that have been created and identify the keys that are older than 90 days. What should you do?","o":[{"l":"A","t":"Execute the gcloud asset search-all-resources\n--scope=\"organizations/[ORG_ID]\"\n--query=\"createTime < [DATE_90_DAYS_AGO]\"\n--asset-types=\"apikeys.googleapis.com/Key\"\n--order-by=\"createTime\" command."},{"l":"B","t":"Execute the gcloud iam service-accounts list\n--filter=\"createTime < [DATE_90_DAYS_AGO]\" command."},{"l":"C","t":"Execute the gcloud tans keys list\n--filter=\"createTime < [DATE_90_DAYS_AGO]\" command."},{"l":"D","t":"Execute the gcloud asset search-all-resources\n--scope=\"organizations/[ORG_ID]\"\n--query=\"createTime < [DATE_90_DAYS_AGO]\"\n--asset-types=\"iam.googleapis.com/ServiceAccountKey\"\n--order-by=\"createTime\" command."}],"a":"D","t":["Service Account Key","Cloud Asset Inventory","gcloud CLI"]},{"n":341,"s":"You are managing Google Cloud infrastructure with Terraform. The Terraform configuration files are stored in a Git repository. You need to implement a solution that enables multiple team members to work on the Terraform configurations concurrently without conflicts and ensures that sensitive values are not persisted to local machines. What should you do?","o":[{"l":"A","t":"Configure a local backend in Terraform, and deploy all changes by using a shared account on a bastion server."},{"l":"B","t":"Configure a Cloud Storage backend in Terraform."},{"l":"C","t":"Configure a local backend in Terraform, and store the state file in a Git repository."},{"l":"D","t":"Configure a local backend in Terraform, and manually share the Terraform state file with team members after every change."}],"a":"B","t":["IAC","Terraform","Terraform Backend","Cloud Storage"]},{"n":342,"s":"You work for a large company that recently acquired three smaller startups. All of the startups’ Google Cloud resources must be centrally managed under a single Google Cloud organization. However, each startup has its own budget and financial reporting structure. You need to ensure that each startup receives a separate monthly invoice for its Google Cloud consumption. What should you do?","o":[{"l":"A","t":"Create a Google Cloud organization with a folder for each startup. Share a single Cloud Billing account, and use the detailed billing export to allocate costs."},{"l":"B","t":"Create a Google Cloud organization with a folder for each startup. Configure each startup to have its own Cloud Billing account."},{"l":"C","t":"Create a Google Cloud organization for each startup. Configure each startup to have its own Cloud Billing account."},{"l":"D","t":"Create a Google Cloud organization for each startup. Share a single Cloud Billing account, and use the detailed billing export to allocate costs."}],"a":"B","t":["Cloud Billing","Resource Hierarchy"]},{"n":343,"s":"You are troubleshooting a complex application failure. You found several cryptic error messages containing no personally identifiable information (PII) in Cloud Logging that you do not recognize. You need to understand the meaning of these logs and determine what actions to take as quickly as possible. What should you do first?","o":[{"l":"A","t":"Manually copy the error messages, and search for them in public forums and documentation."},{"l":"B","t":"Use Cloud Profiler to analyze the application’s performance during the time of the errors."},{"l":"C","t":"Use the “Explain this log entry” feature in Logs Explorer, and start a conversation with Gemini."},{"l":"D","t":"Search the application source code to determine the cause of the errors."}],"a":"C","t":["Cloud Logging","Gemini Cloud Assist","Troubleshooting"]},{"n":344,"s":"You are managing logging for your organization by aggregating logs into a centralized Google Cloud project. The aggregated logs come from two source projects: one for a frontend application and one for a backend application. You need to grant the frontend development team access to view all logs originating from the frontend project and only error-level logs from the backend project. The team must not be able to view any other logs. You want to follow the principle of least privilege and develop a cost-efficient solution. What should you do?","o":[{"l":"A","t":"• In the centralized logging project, craft a query that combines all logs from the frontend project and error-level logs from the backend project, and grant the logging.viewer IAM role.\n• Save and share this query with the frontend team for them to use in the Logs Explorer.\n• Request the frontend team not to use any other query."},{"l":"B","t":"• Create two separate log sinks in the centralized project.\n• Configure one sink to route all frontend logs to a new, dedicated Cloud Storage bucket.\n• Configure a second sink to route only the error-level logs from the backend project to that same bucket.\n• Grant the frontend team read-only access to this bucket."},{"l":"C","t":"• Grant the frontend team the logging.viewer IAM role on both the frontend project and the backend project.\n• Instruct the developers to use a specific filter in the Logs Explorer to find the logs they need."},{"l":"D","t":"• In the centralized logging project, create a log view on the bucket that contains the aggregated logs.\n• Filter the view to include all logs from the frontend project and only logs with a severity level of ERROR from the backend project.\n• Grant the frontend team the logging.viewAccessor IAM role on this specific view."}],"a":"D","t":["Cloud Logging","Log Views","IAM","Least Privilege"]},{"n":345,"s":"You are managing resources in a Google Cloud project. A new service account needs the ability to invoke a Cloud Run service. You need to gain the permissions to modify IAM policies for service accounts while adhering to the principle of least privilege. What should you do?","o":[{"l":"A","t":"Request the roles/iam.serviceAccountAdmin role for your user account."},{"l":"B","t":"Request the roles/run.invoker role for your user account."},{"l":"C","t":"Request the Editor role for your user account."},{"l":"D","t":"Request the Owner role for your user account."}],"a":"A","t":["IAM","IAM Predefined Roles","Service Account","Cloud Run","Least Privilege"]},{"n":346,"s":"You manage a Google Cloud project that contains a critical marketing application. You need to grant an external vendor read-only access to the objects stored in a specific Cloud Storage bucket. The vendor must not be able to view any other resources in the project. What should you do?","o":[{"l":"A","t":"Create a custom IAM role with the storage.objects.get permission, and grant the vendor this role on the project."},{"l":"B","t":"Grant the vendor the Storage Object User role on the project."},{"l":"C","t":"Grant the vendor the Storage Object User role on the bucket."},{"l":"D","t":"Grant the vendor the Storage Object Viewer role on the bucket."}],"a":"D","t":["IAM","IAM Predefined Roles","Cloud Storage","Least Privilege"]},{"n":347,"s":"You manage IAM policies for your organization’s Google Cloud project. A new operations team needs the capability to start, stop, and reset existing Compute Engine VM instances within this project for basic troubleshooting. Due to strict security requirements, the operations team must be prevented from deleting any instances or modifying any networking or configuration settings. You need to grant the minimum necessary permissions to the team members. What should you do?","o":[{"l":"A","t":"Grant the operations team the roles/writer IAM role, and add the resource.type =='compute.googleapis.com/Instance' condition to the role."},{"l":"B","t":"Grant the operations team the predefined roles/compute.instanceAdmin.v1 IAM role on the project. Apply an IAM condition to exclude the compute.instances.delete permission."},{"l":"C","t":"Create a custom IAM role that includes only the compute.instances.start, compute.instances.stop, and compute.instances.reset permissions. Assign this role to the operations team on the project."},{"l":"D","t":"Grant the operations team the predefined roles/compute.viewer IAM role to allow them to view the instances. Instruct them to use the Google Cloud Console’s basic actions such as starting, stopping, and resetting."}],"a":"C","t":["IAM","IAM Custom Role","Compute Engine","Least Privilege"]},{"n":348,"s":"You are conducting an audit of your Google Cloud organization. You need to identify all Compute Engine instances that have a public IP address. You want to implement a solution that is easy to maintain and uses Google Cloud managed services. What should you do?","o":[{"l":"A","t":"Enable the compute.vmExternalIpAccess organization policy at the organization level."},{"l":"B","t":"Use Cloud Shell and Gemini CLI to query the Compute Engine API for instances with a public IP address."},{"l":"C","t":"Use Cloud Asset Inventory to query for all Compute Engine instances with a public IP address."},{"l":"D","t":"Create a shell script using the gcloud CLI to find all instances with a public IP address."}],"a":"C","t":["Cloud Asset Inventory","Compute Engine"]},{"n":349,"s":"You are responsible for Google Cloud governance at your company and recently implemented a new, automated process for provisioning Google Cloud projects. You have discovered several projects that were manually created before the implementation of this new process. You need to identify the creators of these projects to inform them of the new process. What should you do?","o":[{"l":"A","t":"Review the value of the creator label attached to the project to find the project’s creator."},{"l":"B","t":"Use Resource Manager to identify the responsible department from the folder and project hierarchy."},{"l":"C","t":"Review the Cloud Billing account linked to the project, and then contact the owner of that billing account."},{"l":"D","t":"Use the IAM page in the Google Cloud console to identify the user with the Owner role."}],"a":"D","t":["IAM","Resource Hierarchy"]}],"g":[{"name":"運算 Compute","tags":["Compute Engine","MIG","MIG Autoscaling","Instance Template","Spot VM","Machine Types","Deletion Protection","Compute Selection"]},{"name":"容器 Containers","tags":["GKE","GKE Autopilot","GKE Node Pool","GKE Autoscaling","GKE Private Cluster","GKE Release Channels","Shielded Nodes","Kubernetes Workloads","Rolling Update","kubectl","Artifact Registry","Cloud Service Mesh","Hardware Accelerators","AI/ML Workloads"]},{"name":"無伺服器 Serverless","tags":["Cloud Run","Cloud Run Scaling","Cloud Run Jobs","Cloud Functions","App Engine","Traffic Splitting","Canary Deployment","Event-Driven","Eventarc","Cloud Scheduler","Cloud Tasks","Speech-to-Text API"]},{"name":"儲存 Storage","tags":["Cloud Storage","Storage Class","Object Lifecycle","Object Versioning","Signed URL","Cloud Storage Notifications","Persistent Disk","Hyperdisk","Snapshot","Filestore","Backup & Recovery"]},{"name":"資料庫 Databases","tags":["Database Selection","Cloud SQL","Cloud SQL Auth Proxy","Spanner","Bigtable","AlloyDB","Database Migration Service"]},{"name":"資料分析 Data","tags":["BigQuery","Pub/Sub","Dataflow","Dataproc","Looker Studio"]},{"name":"網路 Networking","tags":["VPC","Subnets","Firewall Rules","Hierarchical Firewall Policies","Shared VPC","VPC Peering","Private Google Access","Private Service Connect","Serverless VPC Access","Cloud NAT","Static IP","Load Balancing","SSL Certificates","Cloud DNS","Cloud VPN","Cloud Router","Hybrid Connectivity","Network Service Tiers","Multi-Region"]},{"name":"身分與安全 IAM & Security","tags":["IAM","IAM Custom Role","IAM Predefined Roles","Least Privilege","Service Account","Service Account Key","Service Account Impersonation","Workload Identity","Cross-Project Access","Google Groups","Cloud Identity","Google Cloud Directory Sync","MFA","Organization Policy","Resource Hierarchy","IAP","SSH Access","OS Login","Secret Manager","VM Manager","Cloud Asset Inventory"]},{"name":"維運 Operations","tags":["Cloud Logging","Cloud Audit Logs","Log Sink","Log-based Metrics","Log Analytics","Log Views","Ops Agent","Cloud Monitoring","Alerting","Gemini Cloud Assist","Troubleshooting","Quotas"]},{"name":"帳單與成本 Billing & Cost","tags":["Cloud Billing","Budget Alerts","Billing Export","Pricing Calculator","Cost Optimization"]},{"name":"IAC 與部署工具","tags":["IAC","Terraform","Terraform Backend","Deployment Manager","Config Connector","CI/CD","Multi-Cloud","gcloud CLI","gcloud storage","API Enablement","Cloud Marketplace"]},{"name":"遷移與高可用 Migration & HA","tags":["Migration","Data Transfer","Storage Transfer Service","Transfer Appliance","BigQuery Data Transfer Service","High Availability"]}]}</script>
<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('data').textContent);
var Q=D.q, byN={}; Q.forEach(function(q){byN[q.n]=q});
var KEY='ace-progress-v1';
var S={}, pending={};          // S[n]={p:"B",ok:true,star:true}
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
var ui={sel:new Set(),mode:'any',status:'all',q:'',tq:'',view:'list',idx:0,shuffle:false,sort:'group',resetting:false};
var focusList=[];
function $(id){return document.getElementById(id)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function need(q){return q.a.length}
function done(n){return S[n]&&S[n].p}

/* ---- filtering ---- */
function passBase(q){
  var s=S[q.n]||{};
  if(ui.status==='todo'&&s.p)return false;
  if(ui.status==='right'&&!(s.p&&s.ok))return false;
  if(ui.status==='wrong'&&!(s.p&&!s.ok))return false;
  if(ui.status==='star'&&!s.star)return false;
  if(ui.q){var h=(q.s+' '+q.o.map(function(o){return o.t}).join(' ')+' '+q.t.join(' ')+' #'+q.n).toLowerCase();
    if(ui.q.toLowerCase().split(/\s+/).filter(Boolean).some(function(w){return h.indexOf(w)<0}))return false}
  return true;
}
function passTags(q,sel){
  if(!sel.size)return true;
  var a=Array.from(sel);
  return ui.mode==='all'?a.every(function(t){return q.t.indexOf(t)>=0}):a.some(function(t){return q.t.indexOf(t)>=0});
}
function filtered(){return Q.filter(function(q){return passBase(q)&&passTags(q,ui.sel)})}
function rebuildFocus(){
  focusList=filtered().map(function(q){return q.n});
  if(ui.shuffle){for(var i=focusList.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=focusList[i];focusList[i]=focusList[j];focusList[j]=t}}
  ui.idx=0;
}

/* ---- persistence ---- */
var db=null,uid=null,dirty=false,writing=false,timer=null;
function setSync(t){$('sync').textContent=t}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function persist(){saveLocal();if(!db||!uid)return;dirty=true;clearTimeout(timer);timer=setTimeout(flush,700)}
function flush(){
  if(writing||!dirty)return;dirty=false;writing=true;
  db.doc('data/users/'+uid+'/progress').set({q:JSON.parse(JSON.stringify(S))}).then(function(){
    writing=false;setSync('進度已存到你的帳號，換裝置也看得到');if(dirty)flush();
  }).catch(function(){writing=false;setSync('這次沒存到帳號，進度暫存在這個瀏覽器')});
}
function connect(){
  if(!window.claude||!window.claude.use){setSync('進度存在這個瀏覽器');return}
  var waited=setTimeout(function(){setSync('暫時連不上帳號，進度先存在這個瀏覽器')},10000);
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];var user=r[1];
    if(!db||!user){clearTimeout(waited);setSync('進度存在這個瀏覽器');db=null;return null}
    return user.id().then(function(id){
      if(!id){clearTimeout(waited);db=null;setSync('進度存在這個瀏覽器');return null}
      uid=id;
      return db.doc('data/users/'+uid+'/progress').get().then(function(snap){
        clearTimeout(waited);
        if(snap.exists){var d=snap.data();S=JSON.parse(JSON.stringify(d.q||{}));saveLocal();rebuildFocus();renderAll()}
        else if(Object.keys(S).length){dirty=true;flush()}
        setSync('進度已存到你的帳號，換裝置也看得到');
      });
    });
  }).catch(function(){clearTimeout(waited);db=null;setSync('進度存在這個瀏覽器')});
}

/* ---- answering ---- */
function submit(q,picked){
  var p=picked.slice().sort().join('');
  S[q.n]=Object.assign({},S[q.n],{p:p,ok:p===q.a.split('').sort().join('')});
  delete pending[q.n];persist();afterChange(q);
}
function choose(q,l){
  if(done(q.n))return;
  if(need(q)===1){submit(q,[l]);return}
  var cur=pending[q.n]||(pending[q.n]=[]),i=cur.indexOf(l);
  if(i>=0)cur.splice(i,1);else cur.push(l);
  if(cur.length===need(q))submit(q,cur);else repaint(q);
}
function redo(q){var s=S[q.n];if(!s)return;if(s.star)S[q.n]={star:true};else delete S[q.n];persist();afterChange(q)}
function star(q){var s=S[q.n]||{};if(s.star){delete s.star;if(s.p)S[q.n]=s;else delete S[q.n]}else{s.star=true;S[q.n]=s}persist();afterChange(q)}
function repaint(q){var c=$('q'+q.n);if(c)c.replaceWith(card(q))}
function afterChange(q){repaint(q);renderProgress();renderTagState();if(ui.view==='map')renderView()}

/* ---- card ---- */
function card(q){
  var s=S[q.n]||{},answered=!!s.p,sec=el('article','sheet');sec.id='q'+q.n;
  var h=el('div','sheet-head');h.appendChild(el('span','num','#'+q.n));
  if(need(q)>1)h.appendChild(el('span','pill','複選 '+need(q)));
  var b=el('button','star',s.star?'★ 已標記':'☆ 標記');b.setAttribute('aria-pressed',!!s.star);b.onclick=function(){star(q)};h.appendChild(b);
  sec.appendChild(h);sec.appendChild(el('p','stem',q.s));
  var ol=el('ol','opts');
  var pick=answered?s.p.split(''):(pending[q.n]||[]);
  q.o.forEach(function(o){
    var li=el('li'),btn=el('button','opt');btn.disabled=answered;btn.onclick=function(){choose(q,o.l)};
    var isA=q.a.indexOf(o.l)>=0,isP=pick.indexOf(o.l)>=0,flag='';
    if(answered){if(isA){btn.classList.add('right');flag='正確答案'}else if(isP){btn.classList.add('wrong');flag='你選的'}}
    else if(isP)btn.classList.add('picked');
    btn.setAttribute('aria-pressed',isP);
    btn.appendChild(el('span','bubble',o.l));
    var t=el('span','otext',o.t);if(flag)t.appendChild(el('span','flag',flag));btn.appendChild(t);
    li.appendChild(btn);ol.appendChild(li);
  });
  sec.appendChild(ol);
  if(answered){
    var f=el('div','foot');
    f.appendChild(el('span','verdict '+(s.ok?'ok':'no'),s.ok?'答對了':'答錯了，正確答案是 '+q.a));
    var r=el('button','redo','重做這題');r.onclick=function(){redo(q)};f.appendChild(r);sec.appendChild(f);
    if(q.note)sec.appendChild(el('p','note',q.note));
  }
  var tg=el('div','tags');
  q.t.forEach(function(t){var c=el('button','tag'+(ui.sel.has(t)?' on':''),t);c.title='篩選這個標籤';c.onclick=function(){toggleTag(t)};tg.appendChild(c)});
  sec.appendChild(tg);
  return sec;
}

/* ---- panel ---- */
var tagBtns={},groupEls=[];
function buildPanel(){
  seg('status',[['all','全部'],['todo','未作答'],['wrong','答錯'],['right','答對'],['star','已標記']],'status');
  seg('mode',[['any','符合任一'],['all','全部符合']],'mode');
  var g=$('groups');
  D.g.forEach(function(gr){
    var d=el('details','group');d.open=true;d.appendChild(el('summary',null,gr.name));
    var list=el('div','taglist');
    gr.tags.forEach(function(t){
      var b=el('button','tag');b.appendChild(document.createTextNode(t));var sm=el('small');b.appendChild(sm);
      b.onclick=function(){toggleTag(t)};tagBtns[t]={b:b,sm:sm};list.appendChild(b);
    });
    d.appendChild(list);g.appendChild(d);groupEls.push({d:d,tags:gr.tags});
  });
  var q=$('q');q.addEventListener('input',function(){ui.q=q.value.trim();filterChanged()});
  var tq=$('tq');tq.addEventListener('input',function(){ui.tq=tq.value.trim().toLowerCase();renderTagState()});
  $('filtersBtn').onclick=function(){var o=$('panel').classList.toggle('open');this.setAttribute('aria-expanded',o);this.textContent=o?'收起篩選':'篩選'};
  var tabs=$('tabs');[['list','題庫'],['focus','一題一題'],['map','考點總覽']].forEach(function(t){
    var b=el('button',null,t[1]);b.setAttribute('role','tab');b.dataset.v=t[0];b.onclick=function(){ui.view=t[0];if(t[0]==='focus')rebuildFocus();renderTop();renderView();window.scrollTo(0,0)};tabs.appendChild(b);
  });
}
function seg(id,opts,key){
  var box=$(id);opts.forEach(function(o){var b=el('button',null,o[1]);b.dataset.v=o[0];
    b.onclick=function(){ui[key]=o[0];filterChanged()};box.appendChild(b)});
}
function toggleTag(t){if(ui.sel.has(t))ui.sel.delete(t);else ui.sel.add(t);if(ui.view==='map')ui.view='list';filterChanged()}
function filterChanged(){rebuildFocus();renderTop();renderTagState();renderView()}
function renderTagState(){
  ['status','mode'].forEach(function(k){Array.from($(k).children).forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===ui[k])})});
  var base=Q.filter(passBase);
  Object.keys(tagBtns).forEach(function(t){
    var trial=new Set(ui.mode==='all'?Array.from(ui.sel).concat([t]):[t]);
    var c=base.filter(function(q){return passTags(q,trial)}).length,x=tagBtns[t],on=ui.sel.has(t);
    x.sm.textContent=c;x.b.setAttribute('aria-pressed',on);x.b.disabled=!c&&!on;
    x.b.hidden=!!ui.tq&&t.toLowerCase().indexOf(ui.tq)<0;
  });
  groupEls.forEach(function(g){g.d.hidden=!!ui.tq&&!g.tags.some(function(t){return t.toLowerCase().indexOf(ui.tq)>=0})});
  renderReset();
}
function renderProgress(){
  var d=0,r=0;Q.forEach(function(q){var s=S[q.n];if(s&&s.p){d++;if(s.ok)r++}});
  $('pDone').textContent='已作答 '+d+' / '+Q.length;
  $('pRate').textContent=d?'正確率 '+Math.round(r/d*100)+'%':'尚未作答';
  fillBar($('pBar'),r,d-r,Q.length);
  $('pBar').setAttribute('aria-label','答對 '+r+' 題，答錯 '+(d-r)+' 題，共 '+Q.length+' 題');
}
function fillBar(b,r,w,total){
  b.textContent='';var a=el('i','r'),c=el('i','w');a.style.width=(total?r/total*100:0)+'%';c.style.width=(total?w/total*100:0)+'%';b.appendChild(a);b.appendChild(c);
}
function renderReset(){
  var box=$('reset');box.textContent='';
  if(!Object.keys(S).length)return;
  if(ui.resetting){
    box.appendChild(el('span',null,'確定清除全部作答與標記？'));
    var y=el('button','danger','清除');y.onclick=function(){S={};pending={};ui.resetting=false;persist();renderAll()};box.appendChild(y);
    var n=el('button','clear','取消');n.onclick=function(){ui.resetting=false;renderReset()};box.appendChild(n);
  }else{var b=el('button','danger','清除全部進度');b.onclick=function(){ui.resetting=true;renderReset()};box.appendChild(b)}
}

/* ---- top + views ---- */
function renderTop(){
  Array.from($('tabs').children).forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===ui.view)});
  $('count').textContent=ui.view==='map'?Object.keys(tagBtns).length+' 個標籤':'符合 '+filtered().length+' / '+Q.length+' 題';
  var box=$('selected');box.textContent='';box.hidden=!ui.sel.size;
  ui.sel.forEach(function(t){var b=el('button','tag',t+' ✕');b.setAttribute('aria-label','移除標籤 '+t);b.onclick=function(){toggleTag(t)};box.appendChild(b)});
  if(ui.sel.size){var c=el('button','clear','清除標籤');c.onclick=function(){ui.sel.clear();filterChanged()};box.appendChild(c)}
}
function renderView(){
  var v=$('view');v.textContent='';
  if(ui.view==='map'){v.appendChild(mapView());return}
  var list=filtered();
  if(!list.length){v.appendChild(el('div','empty','沒有符合的題目。試著移除標籤，或把作答狀態切回全部。'));return}
  if(ui.view==='list'){var frag=document.createDocumentFragment();list.forEach(function(q){frag.appendChild(card(q))});v.appendChild(frag);return}
  if(ui.idx>=focusList.length)ui.idx=0;
  v.appendChild(pager());v.appendChild(card(byN[focusList[ui.idx]]));
}
function go(d){var i=ui.idx+d;if(i<0||i>=focusList.length)return;ui.idx=i;renderView();window.scrollTo(0,0)}
function pager(){
  var p=el('div','pager');
  var a=el('button','btn','上一題');a.disabled=ui.idx===0;a.onclick=function(){go(-1)};
  var b=el('button','btn','下一題');b.disabled=ui.idx>=focusList.length-1;b.onclick=function(){go(1)};
  p.appendChild(a);p.appendChild(el('span','count',(ui.idx+1)+' / '+focusList.length));p.appendChild(b);
  var sh=el('button','btn',ui.shuffle?'依題號排序':'打亂順序');sh.onclick=function(){ui.shuffle=!ui.shuffle;rebuildFocus();renderView()};p.appendChild(sh);
  p.appendChild(el('span','hint','鍵盤：A 到 E 作答，← → 換題'));
  return p;
}
function tagStats(t){
  var total=0,r=0,w=0;Q.forEach(function(q){if(q.t.indexOf(t)<0)return;total++;var s=S[q.n];if(s&&s.p){if(s.ok)r++;else w++}});
  return{t:t,total:total,r:r,w:w};
}
function row(st){
  var b=el('button','row');b.onclick=function(){ui.sel=new Set([st.t]);ui.view='list';filterChanged();window.scrollTo(0,0)};
  b.appendChild(el('b',null,st.t));var bar=el('div','bar');fillBar(bar,st.r,st.w,st.total);b.appendChild(bar);
  var ans=st.r+st.w;b.appendChild(el('span',null,ans?st.r+'/'+ans+' 對 · 共 '+st.total:'共 '+st.total+' 題'));
  return b;
}
function mapView(){
  var m=el('div','map'),tools=el('div','map-tools'),sel=el('select');sel.id='sort';sel.setAttribute('aria-label','排序方式');
  [['group','依主題'],['count','題數最多'],['weak','最弱的優先']].forEach(function(o){var op=el('option',null,o[1]);op.value=o[0];op.selected=ui.sort===o[0];sel.appendChild(op)});
  sel.onchange=function(){ui.sort=sel.value;renderView()};tools.appendChild(sel);
  var lg=el('div','legend');[['var(--good)','答對'],['var(--bad)','答錯'],['var(--sunken)','未作答']].forEach(function(l){var s=el('span'),i=el('i');i.style.background=l[0];s.appendChild(i);s.appendChild(document.createTextNode(l[1]));lg.appendChild(s)});
  tools.appendChild(lg);m.appendChild(tools);
  if(ui.sort==='group'){
    D.g.forEach(function(g){var sec=el('section','sheet');sec.style.gap='2px';sec.appendChild(el('h2',null,g.name));
      g.tags.map(tagStats).sort(function(a,b){return b.total-a.total}).forEach(function(s){sec.appendChild(row(s))});m.appendChild(sec)});
  }else{
    var all=[];D.g.forEach(function(g){all=all.concat(g.tags)});all=all.map(tagStats);
    if(ui.sort==='weak'){
      all=all.filter(function(s){return s.r+s.w>0}).sort(function(a,b){return a.r/(a.r+a.w)-b.r/(b.r+b.w)||(b.w-a.w)});
      if(!all.length){m.appendChild(el('div','empty','先作答幾題，這裡就會列出你最弱的考點。'));return m}
    }else all.sort(function(a,b){return b.total-a.total});
    var sec=el('section','sheet');sec.style.gap='2px';all.forEach(function(s){sec.appendChild(row(s))});m.appendChild(sec);
  }
  return m;
}
document.addEventListener('keydown',function(e){
  if(ui.view!=='focus'||e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||!focusList.length)return;
  if(e.key==='ArrowLeft')go(-1);else if(e.key==='ArrowRight')go(1);
  else{var q=byN[focusList[ui.idx]],l=e.key.toUpperCase();if(q.o.some(function(o){return o.l===l}))choose(q,l)}
});
function renderAll(){renderProgress();renderTop();renderTagState();renderView()}
buildPanel();rebuildFocus();renderAll();connect();
})();
</script>

</body></html>
