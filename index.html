ud SQL"},{"l":"D","t":"Firestore"}],"a":"C","e":"跟第 188 題相同：單一地點、需要 ACID 和強一致性、原本就是 PostgreSQL，選 Cloud SQL 改動最少。Bigtable 和 Firestore 是 NoSQL；BigQuery 是分析用資料倉儲。","t":["Cloud SQL","Database Selection"]},{"n":218,"s":"Your company runs one batch process in an on-premises server that takes around 30 hours to complete. The task runs monthly, can be performed offline, and must be restarted if interrupted. You want to migrate this workload to the cloud while minimizing cost. What should you do?","o":[{"l":"A","t":"Create an Instance Template with Spot VMs On. Create a Managed Instance Group from the template and adjust Target CPU Utilization. Migrate the workload."},{"l":"B","t":"Migrate the workload to a Compute Engine VM. Start and stop the instance as needed."},{"l":"C","t":"Migrate the workload to a Google Kubernetes Engine cluster with Spot nodes."},{"l":"D","t":"Migrate the workload to a Compute Engine Spot VM."}],"a":"B","e":"這個工作要跑 30 小時，中斷就必須從頭開始。Spot VM 雖然便宜，但隨時可能被回收，跑 30 小時被中斷的機率很高，重跑反而浪費，所以 A、C、D 都不適合。用一般 Compute Engine VM，只在需要時啟動、跑完就停止，只付實際使用的費用，是最划算的做法。","t":["Compute Engine","Spot VM","Migration","Cost Optimization"]},{"n":219,"s":"You are planning to migrate the following on-premises data management solutions to Google Cloud:\n• One MySQL cluster for your main database\n• Apache Kafka for your event streaming platform\n• One Cloud SQL for PostgreSQL database for your analytical and reporting needs\nYou want to implement Google-recommended solutions for the migration. You need to ensure that the new solutions provide global scalability and require minimal operational and infrastructure management. What should you do?","o":[{"l":"A","t":"Migrate from MySQL to Cloud SQL, from Kafka to Pub/Sub, and from Cloud SQL for PostgreSQL to BigQuery."},{"l":"B","t":"Migrate from MySQL to Cloud Spanner, from Kafka to Pub/Sub, and from Cloud SQL for PostgreSQL to BigQuery."},{"l":"C","t":"Migrate from MySQL to Cloud Spanner, from Kafka to Memorystore, and from Cloud SQL for PostgreSQL to Cloud SQL."},{"l":"D","t":"Migrate from MySQL to Cloud SQL, from Kafka to Memorystore, and from Cloud SQL for PostgreSQL to Cloud SQL."}],"a":"B","e":"題目要全球擴充和最少維運：MySQL 換成 Cloud Spanner（全球可擴充的關聯式資料庫），Kafka 換成 Pub/Sub（全代管訊息服務），分析報表的 PostgreSQL 換成 BigQuery（全代管資料倉儲）。Cloud SQL 無法全球擴充；Memorystore 是快取，不是事件串流平台。","t":["Database Selection","Spanner","Pub/Sub","BigQuery","Migration"]},{"n":220,"s":"During a recent audit of your existing Google Cloud resources, you discovered several users with email addresses outside of your Google Workspace domain. You want to ensure that your resources are only shared with users whose email addresses match your domain. You need to remove any mismatched users, and you want to avoid having to audit your resources to identify mismatched users. What should you do?","o":[{"l":"A","t":"Create a Cloud Scheduler task to regularly scan your projects and delete mismatched users."},{"l":"B","t":"Create a Cloud Scheduler task to regularly scan your resources and delete mismatched users."},{"l":"C","t":"Set an organizational policy constraint to limit identities by domain to automatically remove mismatched users."},{"l":"D","t":"Set an organizational policy constraint to limit identities by domain, and then retroactively remove the existing mismatched users"}],"a":"D","e":"設定網域限制共用的組織政策（iam.allowedPolicyMemberDomains），之後就不能再授權給網域外的使用者。但這個政策不會回溯，已經存在的網域外使用者不會自動被移除，所以還要手動移除。C 誤以為會自動移除；A、B 用排程掃描要自己開發和維護。","t":["Organization Policy","IAM"]},{"n":221,"s":"Your application is running on Google Cloud in a managed instance group (MIG). You see errors in Cloud Logging for one VM that one of the processes is not responsive. You want to replace this VM in the MIG quickly. What should you do?","o":[{"l":"A","t":"Use the gcloud compute instances update command with a REFRESH action for the VM."},{"l":"B","t":"Use the gcloud compute instance-groups managed recreate-instances command to recreate the VM."},{"l":"C","t":"Select the MIG from the Compute Engine console and, in the menu, select Replace VMs."},{"l":"D","t":"Update and apply the instance template of the MIG."}],"a":"B","e":"gcloud compute instance-groups managed recreate-instances 可以只重建 MIG 中指定的那台 VM，最快處理這台有問題的 VM。A 的指令沒有 REFRESH 這個動作；C 的 Replace VMs 是對整個群組做滾動更換；D 更新範本會影響所有 VM，也不是替換單一台。","t":["MIG","gcloud CLI"]},{"n":222,"s":"You want to permanently delete a Pub/Sub topic managed by Config Connector in your Google Cloud project. What should you do?","o":[{"l":"A","t":"Use kubectl to create the label deleted-by-cnrm and to change its value to true for the topic resource."},{"l":"B","t":"Use kubectl to delete the topic resource."},{"l":"C","t":"Use gcloud CLI to delete the topic."},{"l":"D","t":"Use gcloud CLI to update the topic label managed-by-cnrm to false."}],"a":"B","e":"由 Config Connector 管理的資源是以 Kubernetes 物件表示，要刪除就用 kubectl 刪除那個 Kubernetes 資源，Config Connector 會一併刪除 Google Cloud 上的 Pub/Sub topic。直接用 gcloud 刪除（C），Config Connector 會依設定再把它建回來；A、D 的標籤不是刪除方式。","t":["IAC","Config Connector","Pub/Sub","kubectl"]},{"n":223,"s":"Your company is using Google Workspace to manage employee accounts. Anticipated growth will increase the number of personnel from 100 employees to 1,000 employees within 2 years. Most employees will need access to your company’s Google Cloud account. The systems and processes will need to support 10x growth without performance degradation, unnecessary complexity, or security issues. What should you do?","o":[{"l":"A","t":"Migrate the users to Active Directory. Connect the Human Resources system to Active Directory. Turn on Google Cloud Directory Sync (GCDS) for Cloud Identity. Turn on Identity Federation from Cloud Identity to Active Directory."},{"l":"B","t":"Organize the users in Cloud Identity into groups. Enforce multi-factor authentication in Cloud Identity."},{"l":"C","t":"Turn on identity federation between Cloud Identity and Google Workspace. Enforce multi-factor authentication for domain wide delegation."},{"l":"D","t":"Use a third-party identity provider service through federation. Synchronize the users from Google Workplace to the third-party provider in real time."}],"a":"B","e":"公司已經使用 Google Workspace（裡面已包含 Cloud Identity）。最簡單又能擴充的做法是把使用者分組，用群組授權，並強制多重驗證（MFA）提升安全性。A、D 引入額外的身分系統，增加複雜度；C 的 Workspace 和 Cloud Identity 本來就是同一套身分，不需要聯合驗證。","t":["Cloud Identity","Google Groups","MFA"]},{"n":224,"s":"You want to host your video encoding software on Compute Engine. Your user base is growing rapidly, and users need to be able to encode their videos at any time without interruption or CPU limitations. You must ensure that your encoding solution is highly available, and you want to follow Google-recommended practices to automate operations. What should you do?","o":[{"l":"A","t":"Deploy your solution on multiple standalone Compute Engine instances, and increase the number of existing instances when CPU utilization on Cloud Monitoring reaches a certain threshold."},{"l":"B","t":"Deploy your solution on multiple standalone Compute Engine instances, and replace existing instances with high-CPU instances when CPU utilization on Cloud Monitoring reaches a certain threshold."},{"l":"C","t":"Deploy your solution to an instance group, and increase the number of available instances whenever you see high CPU utilization in Cloud Monitoring."},{"l":"D","t":"Deploy your solution to an instance group, and set the autoscaling based on CPU utilization."}],"a":"D","e":"執行個體群組（MIG）搭配以 CPU 使用率為依據的自動調度，可以自動增減 VM，並提供自動修復，達到高可用性。A、B、C 都要人工觀察後手動調整，不符合「自動化」的要求。","t":["Compute Engine","MIG","MIG Autoscaling","High Availability"]},{"n":225,"s":"Your managed instance group raised an alert stating that new instance creation has failed to create new instances. You need to solve the instance creation problem. What should you do?","o":[{"l":"A","t":"Create an instance template that contains valid syntax which will be used by the instance group. Delete any persistent disks with the same name as instance names."},{"l":"B","t":"Create an instance template that contains valid syntax that will be used by the instance group. Verify that the instance name and persistent disk name values are not the same in the template."},{"l":"C","t":"Verify that the instance template being used by the instance group contains valid syntax. Delete any persistent disks with the same name as instance names. Set the disks.autoDelete property to true in the instance template."},{"l":"D","t":"Delete the current instance template and replace it with a new instance template. Verify that the instance name and persistent disk name values are not the same in the template. Set the disks.autoDelete property to true in the instance template."}],"a":"A","e":"MIG 建立執行個體失敗，常見原因有兩個：執行個體範本語法錯誤，或已經存在與新執行個體同名的永久磁碟。執行個體範本建立後不能修改，所以要建立新的有效範本，並刪除同名的磁碟。C 想「檢查」現有範本，但範本無法編輯；D 不能刪除正在被群組使用的範本。","t":["MIG","Instance Template","Troubleshooting"]},{"n":226,"s":"You have created an application that is packaged into a Docker image. You want to deploy the Docker image as a workload on Google Kubernetes Engine. What should you do?","o":[{"l":"A","t":"Upload the image to Cloud Storage and create a Kubernetes Service referencing the image."},{"l":"B","t":"Upload the image to Cloud Storage and create a Kubernetes Deployment referencing the image."},{"l":"C","t":"Upload the image to Artifact Registry and create a Kubernetes Service referencing the image."},{"l":"D","t":"Upload the image to Artifact Registry and create a Kubernetes Deployment referencing the image."}],"a":"D","e":"跟第 192 題相同：把映像檔上傳到 Artifact Registry（Container Registry 的後繼服務），再建立 Kubernetes Deployment 指向這個映像檔。Service 只負責網路存取，不會執行容器；Cloud Storage 不是容器倉庫。","t":["GKE","Kubernetes Workloads","Artifact Registry"]},{"n":227,"s":"You are using Looker Studio to visualize a table from your data warehouse that is built on top of BigQuery. Data is appended to the data warehouse during the day. At night, the daily summary is recalculated by overwriting the table. You just noticed that the charts in Looker Studio are broken, and you want to analyze the problem. What should you do?","o":[{"l":"A","t":"In Cloud Logging, create a filter for your Looker Studio report."},{"l":"B","t":"Use the open source CLI tool, Snapshot Debugger, to find out why the data was not refreshed correctly."},{"l":"C","t":"Review the Error Reporting page in the Google Cloud console to find any errors."},{"l":"D","t":"Use the BigQuery interface to review the nightly job and look for any errors."}],"a":"D","e":"跟第 193 題相同：資料表每晚被工作覆寫，圖表壞掉最可能是那個工作失敗，所以到 BigQuery 查看夜間工作的紀錄和錯誤。Looker Studio 報表不會出現在 Cloud Logging；Snapshot Debugger 和 Error Reporting 是給應用程式用的。","t":["BigQuery","Looker Studio","Troubleshooting"]},{"n":228,"s":"You have a batch workload that runs every night and uses a large number of virtual machines (VMs). It is fault-tolerant and can tolerate some of the VMs being terminated. The current cost of VMs is too high. What should you do?","o":[{"l":"A","t":"Run a test using simulated maintenance events. If the test is successful, use Spot N2 Standard VMs when running future jobs."},{"l":"B","t":"Run a test using simulated maintenance events. If the test is successful, use N2 Standard VMs when running future jobs."},{"l":"C","t":"Run a test using a managed instance group. If the test is successful, use N2 Standard VMs in the managed instance group when running future jobs."},{"l":"D","t":"Run a test using N1 standard VMs instead of N2. If the test is successful, use N1 Standard VMs when running future jobs."}],"a":"A","e":"工作可以容忍部分 VM 被終止，最省錢的做法是改用 Spot VM（比一般 VM 便宜很多）。先用模擬維護事件測試，確認工作在 VM 被回收時能正常處理，再正式改用。B、C、D 還是一般 VM，價格差異不大。","t":["Compute Engine","Spot VM","Cost Optimization"]},{"n":229,"s":"You created several resources in multiple Google Cloud projects. All projects are linked to different billing accounts. To better estimate future charges, you want to have a single visual representation of all costs incurred. You want to include new cost data as soon as possible. What should you do?","o":[{"l":"A","t":"Fill all resources in the Pricing Calculator to get an estimate of the monthly cost."},{"l":"B","t":"Use the Reports view in the Cloud Billing Console to view the desired cost information."},{"l":"C","t":"Visit the Cost Table page to get a CSV export and visualize it using Looker Studio."},{"l":"D","t":"Configure Billing Data Export to BigQuery and visualize the data in Looker Studio."}],"a":"D","e":"專案分別連到不同帳單帳戶，要用單一畫面看所有費用，又要盡快納入新資料：把各個帳單帳戶的帳單資料匯出到 BigQuery，再用 Looker Studio 視覺化，資料會持續自動更新。Pricing Calculator（A）只是估價；Reports（B）一次只看一個帳單帳戶；CSV 匯出（C）要手動。","t":["Cloud Billing","Billing Export","BigQuery","Looker Studio"]},{"n":230,"s":"Your company has a large quantity of unstructured data in different file formats. You want to perform ETL transformations on the data. You need to make the data accessible on Google Cloud so it can be processed by a Dataflow job. What should you do?","o":[{"l":"A","t":"Upload the data to BigQuery using the bq command line tool."},{"l":"B","t":"Upload the data to Cloud Storage using the gcloud storage command."},{"l":"C","t":"Upload the data into Cloud SQL using the import function in the Google Cloud console."},{"l":"D","t":"Upload the data into Cloud Spanner using the import function in the Google Cloud console."}],"a":"B","e":"非結構化、各種格式的檔案最適合放 Cloud Storage，再讓 Dataflow 從 Cloud Storage 讀取做 ETL。BigQuery、Cloud SQL、Spanner（A、C、D）都需要結構化資料，無法直接存放各種格式的原始檔案。","t":["Cloud Storage","Data Transfer","gcloud storage","Dataflow"]},{"n":231,"s":"You have deployed an application on a single Compute Engine instance. The application writes logs to disk. Users start reporting errors with the application. You want to diagnose the problem. What should you do?","o":[{"l":"A","t":"Navigate to Cloud Logging and view the application logs."},{"l":"B","t":"Configure a health check on the instance and set a “consecutive successes” Healthy threshold value of 1."},{"l":"C","t":"Connect to the instance’s serial console and read the application logs."},{"l":"D","t":"Install and configure the Ops agent and view the logs from Cloud Logging."}],"a":"D","e":"應用程式把記錄寫在磁碟上，Cloud Logging 預設看不到。安裝並設定 Ops Agent，把應用程式記錄檔送進 Cloud Logging 後就能查看和分析。A 在沒有 agent 的情況下看不到這些記錄；B 的健康檢查不能診斷問題；C 的序列主控台不是讀取應用程式記錄的建議方式。","t":["Compute Engine","Ops Agent","Cloud Logging","Troubleshooting"]},{"n":232,"s":"You recently received a new Google Cloud project with an attached billing account where you will work. You need to create instances, set firewalls, and store data in Cloud Storage. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use the gcloud CLI services enable cloudresourcemanager.googleapis.com command to enable all resources."},{"l":"B","t":"Use the gcloud services enable compute.googleapis.com command to enable Compute Engine and the gcloud services enable storage-api.googleapis.com command to enable the Cloud Storage APIs."},{"l":"C","t":"Open the Google Cloud console and enable all Google Cloud APIs from the API dashboard."},{"l":"D","t":"Open the Google Cloud console and run gcloud init --project in a Cloud Shell."}],"a":"B","e":"Google 建議只啟用需要的 API：用 gcloud services enable 啟用 compute.googleapis.com（VM 和防火牆）以及 Cloud Storage 的 API。A 的 Resource Manager API 不會啟用其他服務；C 啟用所有 API 違反最小權限；D 的 gcloud init 只是初始化設定，不會啟用 API。","t":["API Enablement","gcloud CLI"]},{"n":233,"s":"Your application development team has created Docker images for an application that will be deployed on Google Cloud. Your team does not want to manage the infrastructure associated with this application. You need to ensure that the application can scale automatically as it gains popularity. What should you do?","o":[{"l":"A","t":"Create an instance template with the container image, and deploy a Managed Instance Group with Autoscaling."},{"l":"B","t":"Upload Docker images to Artifact Registry, and deploy the application on Google Kubernetes Engine using Standard mode."},{"l":"C","t":"Upload Docker images to the Cloud Storage, and deploy the application on Google Kubernetes Engine using Standard mode."},{"l":"D","t":"Upload Docker images to Artifact Registry, and deploy the application on Cloud Run."}],"a":"D","e":"團隊不想管理基礎架構，又要自動擴充：把映像檔放到 Artifact Registry，部署到 Cloud Run（無伺服器，依流量自動擴充）。A 的 MIG 要管理 VM；B、C 的 GKE Standard 要管理節點，C 還把映像檔放在 Cloud Storage。","t":["Cloud Run","Artifact Registry","Compute Selection"]},{"n":234,"s":"You are migrating a business critical application from your local data center into Google Cloud. As part of your high-availability strategy, you want to ensure that any data used by the application will be immediately available if a zonal failure occurs. What should you do?","o":[{"l":"A","t":"Store the application data on a zonal persistent disk. Create a snapshot schedule for the disk. If an outage occurs, create a new disk from the most recent snapshot and attach it to a new VM in another zone."},{"l":"B","t":"Store the application data on a zonal persistent disk. If an outage occurs, create an instance in another zone with this disk attached."},{"l":"C","t":"Store the application data on a regional persistent disk. Create a snapshot schedule for the disk. If an outage occurs, create a new disk from the most recent snapshot and attach it to a new VM in another zone."},{"l":"D","t":"Store the application data on a regional persistent disk. If an outage occurs, create an instance in another zone with this disk attached."}],"a":"D","e":"區域永久磁碟（regional persistent disk）會同步複製到同一區域內的兩個可用區，一個可用區故障時，可以直接把磁碟掛到另一個可用區的新 VM 上，資料立刻可用。快照（A、C）會遺失最後一次快照後的資料，還原也要時間；可用區磁碟（B）在可用區故障時無法掛載。","t":["Persistent Disk","High Availability"]},{"n":235,"s":"The DevOps group in your organization needs full control of Compute Engine resources in your development project. However, they should not have permission to create or update any other resources in the project. You want to follow Google’s recommendations for setting permissions for the DevOps group. What should you do?","o":[{"l":"A","t":"Grant the basic role roles/viewer and the predefined role roles/compute.admin to the DevOps group."},{"l":"B","t":"Create an IAM policy and grant all compute.instanceAdmin.* permissions to the policy. Attach the policy to the DevOps group."},{"l":"C","t":"Create a custom role at the folder level and grant all compute.instanceAdmin.* permissions to the role. Grant the custom role to the DevOps group."},{"l":"D","t":"Grant the basic role roles/editor to the DevOps group."}],"a":"A","e":"Compute Admin（roles/compute.admin）提供 Compute Engine 的完整控制，再加上基本角色 Viewer 讓他們能查看但不能修改其他資源。Google 建議優先使用預先定義角色。B 的「把權限加到 IAM 政策」不是 IAM 的運作方式；C 的 instanceAdmin 只涵蓋執行個體，不是完整的 Compute Engine；D 的 Editor 能修改所有資源，權限太大。","t":["IAM","IAM Predefined Roles","Least Privilege"]},{"n":236,"s":"Your team is running an on-premises ecommerce application. The application contains a complex set of microservices written in Python, and each microservice is running on Docker containers. Configurations are injected by using environment variables. You need to deploy your current application to a serverless Google Cloud cloud solution. What should you do?","o":[{"l":"A","t":"Use your existing CI/CD pipeline. Use the generated Docker images and deploy them to Cloud Run. Update the configurations and the required endpoints."},{"l":"B","t":"Use your existing continuous integration and delivery (CI/CD) pipeline. Use the generated Docker images and deploy them to Cloud Function. Use the same configuration as on-premises."},{"l":"C","t":"Use the existing codebase and deploy each service as a separate Cloud Function. Update the configurations and the required endpoints."},{"l":"D","t":"Use your existing codebase and deploy each service as a separate Cloud Run. Use the same configurations as on-premises."}],"a":"A","e":"應用程式已經是 Docker 容器，設定也用環境變數，最適合直接部署到 Cloud Run（無伺服器容器）。沿用現有 CI/CD 產生的映像檔，再更新設定和服務之間的端點網址（服務部署後網址會不同）。Cloud Functions 不能直接部署 Docker 映像檔（B、C）；D 直接沿用地端設定，端點不會正確。","t":["Cloud Run","Compute Selection","Migration","CI/CD"]},{"n":237,"s":"You are running multiple microservices in a Kubernetes Engine cluster. One microservice is rendering images. The microservice responsible for the image rendering requires a large amount of CPU time compared to the memory it requires. The other microservices are workloads that are optimized for n2-standard machine types. You need to optimize your cluster so that all workloads are using resources as efficiently as possible. What should you do?","o":[{"l":"A","t":"Assign the pods of the image rendering microservice a higher pod priority than the other microservices."},{"l":"B","t":"Create a node pool with compute-optimized machine type nodes for the image rendering microservice. Use the node pool with general-purpose machine type nodes for the other microservices."},{"l":"C","t":"Use the node pool with general-purpose machine type nodes for the image rendering microservice. Create a node pool with compute-optimized machine type nodes for the other microservices."},{"l":"D","t":"Configure the required amount of CPU and memory in the resource requests specification of the image rendering microservice deployment. Keep the resource requests for the other microservices at the default."}],"a":"B","e":"跟第 196 題相同：吃 CPU 的影像算圖服務放到運算最佳化機器類型的節點集區，其他服務留在一般用途節點集區，資源使用最有效率。Pod 優先順序和 resource requests 都不會改變底層機器類型。","t":["GKE","GKE Node Pool","Machine Types"]},{"n":238,"s":"You are working in a team that has developed a new application that needs to be deployed on Kubernetes. The production application is business critical and should be optimized for reliability. You need to provision a Kubernetes cluster and want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create a GKE Autopilot cluster. Enroll the cluster in the rapid release channel."},{"l":"B","t":"Create a GKE Autopilot cluster. Enroll the cluster in the stable release channel."},{"l":"C","t":"Create a zonal GKE standard cluster. Enroll the cluster in the stable release channel."},{"l":"D","t":"Create a regional GKE standard cluster. Enroll the cluster in the rapid release channel."}],"a":"B","e":"正式環境、重視可靠性又要符合 Google 建議，選 GKE Autopilot（Google 代管節點，預設就是區域叢集）並加入 stable 發布版本（經過最多測試）。Rapid 版本最新但較不穩定（A、D）；可用區叢集（C）有單點故障風險。","t":["GKE","GKE Autopilot","GKE Release Channels"]},{"n":239,"s":"You are responsible for a web application on Compute Engine. You want your support team to be notified automatically if users experience high latency for at least 5 minutes. You need a Google-recommended solution with no development cost. What should you do?","o":[{"l":"A","t":"Export Cloud Monitoring metrics to BigQuery and use a Looker Studio dashboard to monitor your web application’s latency."},{"l":"B","t":"Create an alert policy to send a notification when the HTTP response latency exceeds the specified threshold."},{"l":"C","t":"Implement an App Engine service which invokes the Cloud Monitoring API and sends a notification in case of anomalies."},{"l":"D","t":"Use the Cloud Monitoring dashboard to observe latency and take the necessary actions when the response latency exceeds the specified threshold."}],"a":"B","e":"建立快訊政策，在 HTTP 回應延遲超過門檻並持續 5 分鐘時發送通知，不需要開發，是 Google 建議的做法。A、D 要有人一直盯著儀表板；C 要自己開發服務。","t":["Compute Engine","Cloud Monitoring","Alerting"]},{"n":240,"s":"You have an on-premises data analytics set of binaries that processes data files in memory for about 45 minutes every midnight. The sizes of those data files range from 1 gigabyte to 16 gigabytes. You want to migrate this application to Google Cloud with minimal effort and cost. What should you do?","o":[{"l":"A","t":"Create a container for the set of binaries. Use Cloud Scheduler to start a Cloud Run job for the container."},{"l":"B","t":"Create a container for the set of binaries. Deploy the container to Google Kubernetes Engine (GKE) and use the Kubernetes scheduler to start the application."},{"l":"C","t":"Upload the code to Cloud Functions. Use Cloud Scheduler to start the application."},{"l":"D","t":"Lift and shift to a VM on Compute Engine. Use an instance schedule to start and stop the instance."}],"a":"D","e":"要用最少的工作量和成本搬遷：直接把程式原封不動搬到 Compute Engine VM（lift and shift），再用執行個體排程在午夜前開機、跑完後關機，只付使用的時間。A、B 要先把程式容器化；C 要改寫成 Cloud Functions，處理 16 GB 記憶體內的資料也不適合。","t":["Compute Engine","Compute Selection","Migration","Cost Optimization"]},{"n":241,"s":"You used the gcloud container clusters command to create two Google Cloud Kubernetes (GKE) clusters: prod-cluster and dev-cluster.\n• prod-cluster is a standard cluster.\n• dev-cluster is an auto-pilot cluster.\nWhen you run the kubectl get nodes command, you only see the nodes from prod-cluster. Which commands should you run to check the node status for dev-cluster?","o":[{"l":"A","t":"gcloud container clusters get-credentials dev-cluster\nkubectl get nodes"},{"l":"B","t":"gcloud container clusters update -generate-password dev-cluster kubectl get nodes"},{"l":"C","t":"kubectl config set-context dev-cluster\nkubectl cluster-info"},{"l":"D","t":"kubectl config set-credentials dev-cluster\nkubectl cluster-info"}],"a":"A","e":"kubectl 只會操作目前 kubeconfig 中的叢集。要看 dev-cluster 的節點，先用 gcloud container clusters get-credentials dev-cluster 取得憑證並切換到這個叢集，再執行 kubectl get nodes。C 的 set-context 不會產生憑證；B 和 D 不是正確的指令。","t":["GKE","kubectl","gcloud CLI"]},{"n":242,"s":"You recently discovered that your developers are using many service account keys during their development process. While you work on a long term improvement, you need to quickly implement a process to enforce short-lived service account credentials in your company. You have the following requirements:\n• All service accounts that require a key should be created in a centralized project called pj-sa.\n• Service account keys should only be valid for one day.\nYou need a Google-recommended solution that minimizes cost. What should you do?","o":[{"l":"A","t":"Implement a Cloud Run job to rotate all service account keys periodically in pj-sa. Enforce an org policy to deny service account key creation with an exception to pj-sa."},{"l":"B","t":"Implement a Kubernetes CronJob to rotate all service account keys periodically. Disable attachment of service accounts to resources in all projects with an exception to pj-sa."},{"l":"C","t":"Enforce an org policy constraint allowing the lifetime of service account keys to be 24 hours. Enforce an org policy constraint denying service account key creation with an exception on pj-sa."},{"l":"D","t":"Enforce a DENY org policy constraint over the lifetime of service account keys for 24 hours. Disable attachment of service accounts to resources in all projects with an exception to pj-sa."}],"a":"C","e":"不用寫程式又能馬上強制執行：設定組織政策 iam.serviceAccountKeyExpiryHours，讓金鑰 24 小時後過期；再設定 iam.disableServiceAccountKeyCreation 禁止建立金鑰，只對 pj-sa 專案例外。A、B 要自己寫輪替程式；D 停用 Service Account 附加到資源，跟金鑰期限無關。","t":["Service Account","Service Account Key","Organization Policy"]},{"n":243,"s":"Your company is running a three-tier web application on virtual machines that use a MySQL database. You need to create an estimated total cost of cloud infrastructure to run this application on Google Cloud instances and Cloud SQL. What should you do?","o":[{"l":"A","t":"Create a Google spreadsheet with multiple Google Cloud resource combinations. On a separate sheet, import the current Google Cloud prices and use these prices for the calculations within formulas."},{"l":"B","t":"Use the Google Cloud Pricing Calculator and select the Cloud Operations template to define your web application with as much detail as possible."},{"l":"C","t":"Implement a similar architecture on Google Cloud, and run a reasonable load test on a smaller scale. Check the billing information, and calculate the estimated costs based on the real load your system usually handles."},{"l":"D","t":"Use the Google Cloud Pricing Calculator to determine the cost of every Google Cloud resource you expect to use. Use similar size instances for the web server, and use your current on-premises machines as a comparison for Cloud SQL."}],"a":"D","e":"用 Google Cloud Pricing Calculator 估算預計使用的每項資源，VM 選跟目前相近的規格，Cloud SQL 參考目前地端資料庫機器的規格。A 自己維護價格試算表容易出錯；B 的 Cloud Operations 範本跟網頁應用程式無關；C 實際建置做負載測試要花錢又花時間。","t":["Pricing Calculator"]},{"n":244,"s":"You have a Bigtable instance that consists of three nodes that store personally identifiable information (PII) data. You need to log all read or write operations, including any metadata or configuration reads of this database table, in your company’s Security Information and Event Management (SIEM) system. What should you do?","o":[{"l":"A","t":"• Navigate to Cloud Monitoring in the Google Cloud console, and create a custom monitoring job for the Bigtable instance to track all changes.\n• Create an alert by using webhook endpoints, with the SIEM endpoint as a receiver."},{"l":"B","t":"• Navigate to the Audit Logs page in the Google Cloud console, and enable Admin Write logs for the Bigtable instance.\n• Create a Cloud Functions instance to export logs from Cloud Logging to your SIEM."},{"l":"C","t":"• Navigate to the Audit Logs page in the Google Cloud console, and enable Data Read, Data Write and Admin Read logs for the Bigtable instance.\n• Create a Pub/Sub topic as a Cloud Logging sink destination, and add your SIEM as a subscriber to the topic."},{"l":"D","t":"• Install the Ops Agent on the Bigtable instance during configuration.\n• Create a service account with read permissions for the Bigtable instance.\n• Create a custom Dataflow job with this service account to export logs to the company’s SIEM system."}],"a":"C","e":"要記錄所有讀寫操作，包括中繼資料和設定的讀取，就要在稽核記錄中為 Bigtable 開啟 Data Read、Data Write 和 Admin Read（Admin Write 預設一律開啟）。再建立以 Pub/Sub 為目的地的記錄接收器（sink），讓 SIEM 訂閱即時接收。B 只開 Admin Write，不包含資料讀寫；D 的 Bigtable 是代管服務，無法安裝 Ops Agent。","t":["Bigtable","Cloud Audit Logs","Log Sink","Pub/Sub"]},{"n":245,"s":"You want to set up a Google Kubernetes Engine cluster. Verifiable node identity and integrity are required for the cluster, and nodes cannot be accessed from the internet. You want to reduce the operational cost of managing your cluster, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Deploy a private autopilot cluster."},{"l":"B","t":"Deploy a public autopilot cluster."},{"l":"C","t":"Deploy a standard public cluster and enable shielded nodes."},{"l":"D","t":"Deploy a standard private cluster and enable shielded nodes."}],"a":"A","e":"節點不能從網際網路存取，要用私人叢集；可驗證的節點身分與完整性就是 Shielded Nodes，Autopilot 預設啟用。Autopilot 由 Google 管理節點，又能降低維運成本，所以選私人 Autopilot 叢集。B、C 是公開叢集；D 的 Standard 叢集維運成本較高。","t":["GKE","GKE Autopilot","GKE Private Cluster","Shielded Nodes"]},{"n":246,"s":"Your company wants to migrate their on-premises workloads to Google Cloud. The current on-premises workloads consist of:\n• A Flask web application\n• A backend API\n• A scheduled long-running background job for ETL and reporting\nYou need to keep operational costs low. You want to follow Google-recommended practices to migrate these workloads to serverless solutions on Google Cloud. What should you do?","o":[{"l":"A","t":"Migrate the web application to App Engine and the backend API to Cloud Run. Use Cloud Tasks to run your background job on Compute Engine."},{"l":"B","t":"Migrate the web application to App Engine and the backend API to Cloud Run. Use Cloud Tasks to run your background job on Cloud Run."},{"l":"C","t":"Run the web application on a Cloud Storage bucket and the backend API on Cloud Run. Use Cloud Tasks to run your background job on Cloud Run."},{"l":"D","t":"Run the web application on a Cloud Storage bucket and the backend API on Cloud Run. Use Cloud Tasks to run your background job on Compute Engine."}],"a":"B","e":"題目要無伺服器又低成本：Flask 網頁應用程式放 App Engine，後端 API 放 Cloud Run，長時間的背景工作用 Cloud Tasks 觸發 Cloud Run 執行。Compute Engine（A、D）不是無伺服器；Cloud Storage 只能放靜態網站，不能執行 Flask（C、D）。補充：現在長時間批次工作也常用 Cloud Run jobs。","t":["App Engine","Cloud Run","Cloud Tasks","Compute Selection","Migration"]},{"n":247,"s":"Your company is moving its continuous integration and delivery (CI/CD) pipeline to Compute Engine instances. The pipeline will manage the entire cloud infrastructure through code. How can you ensure that the pipeline has appropriate permissions while your system is following security best practices?","o":[{"l":"A","t":"• Attach a single service account to the compute instances.\n• Add minimal rights to the service account.\n• Allow the service account to impersonate a Cloud Identity user with elevated permissions to create, update, or delete resources."},{"l":"B","t":"• Add a step for human approval to the CI/CD pipeline before the execution of the infrastructure provisioning.\n• Use the human approvals IAM account for the provisioning."},{"l":"C","t":"• Attach a single service account to the compute instances.\n• Add all required Identity and Access Management (IAM) permissions to this service account to create, update, or delete resources."},{"l":"D","t":"• Create multiple service accounts, one for each pipeline with the appropriate minimal Identity and Access Management (IAM) permissions.\n• Use a secret manager service to store the key files of the service accounts.\n• Allow the CI/CD pipeline to request the appropriate secrets during the execution of the pipeline."}],"a":"D","e":"每條 pipeline 各用一個 Service Account，只給最小必要權限，金鑰放在 Secret Manager，pipeline 執行時再取用，符合最小權限和安全保存憑證的原則。A 的 Service Account 無法冒用使用者帳號；B 用人的帳號執行自動化不安全；C 單一 Service Account 權限過大。補充：Google 現在更建議避免使用金鑰，直接把 Service Account 附加到 VM，或使用 impersonation。","t":["CI/CD","Service Account","Service Account Key","Secret Manager","Least Privilege"]},{"n":248,"s":"Your application stores files on Cloud Storage by using the Standard Storage class. The application only requires access to files created in the last 30 days. You want to automatically save costs on files that are no longer accessed by the application. What should you do?","o":[{"l":"A","t":"Create an object lifecycle on the storage bucket to change the storage class to Archive Storage for objects with an age over 30 days."},{"l":"B","t":"Create a cron job in Cloud Scheduler to call a Cloud Functions instance every day to delete files older than 30 days."},{"l":"C","t":"Create a retention policy on the storage bucket of 30 days, and lock the bucket by using a retention policy lock."},{"l":"D","t":"Enable object versioning on the storage bucket and add lifecycle rules to expire non-current versions after 30 days."}],"a":"A","e":"應用程式只需要 30 天內的檔案，用物件生命週期規則把超過 30 天的物件改成 Archive 儲存類別，自動節省成本又保留檔案。B 是直接刪除，資料就不見了；C 的保留政策鎖定是防止刪除，不是省錢；D 只處理舊版本，目前版本還是 Standard。","t":["Cloud Storage","Storage Class","Object Lifecycle","Cost Optimization"]},{"n":249,"s":"Your manager asks you to deploy a workload to a Kubernetes cluster. You are not sure of the workload's resource requirements or how the requirements might vary depending on usage patterns, external dependencies, or other factors. You need a solution that makes cost-effective recommendations regarding CPU and memory requirements, and allows the workload to function consistently in any situation. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Configure the Horizontal Pod Autoscaler for availability, and configure the cluster autoscaler for suggestions."},{"l":"B","t":"Configure the Horizontal Pod Autoscaler for availability, and configure the Vertical Pod Autoscaler recommendations for suggestions."},{"l":"C","t":"Configure the Vertical Pod Autoscaler recommendations for availability, and configure the Cluster autoscaler for suggestions."},{"l":"D","t":"Configure the Vertical Pod Autoscaler recommendations for availability, and configure the Horizontal Pod Autoscaler for suggestions."}],"a":"B","e":"HPA 依負載增減 Pod 數量，確保可用性；VPA 的建議模式（recommendation）會分析使用狀況，提供 CPU 和記憶體設定建議，不會自動修改。叢集自動調度（A、C）只增減節點，不會提供資源建議；D 把兩者的角色放反了。","t":["GKE","GKE Autoscaling"]},{"n":250,"s":"You need to migrate invoice documents stored on-premises to Cloud Storage. The documents have the following storage requirements:\n• Documents must be kept for five years.\n• Up to five revisions of the same invoice document must be stored, to allow for corrections.\n• Documents older than 365 days should be moved to lower cost storage tiers.\nYou want to follow Google-recommended practices to minimize your operational and development costs. What should you do?","o":[{"l":"A","t":"Enable retention policies on the bucket, and use Cloud Scheduler to invoke a Cloud Function to move or delete your documents based on their metadata."},{"l":"B","t":"Enable retention policies on the bucket, use lifecycle rules to change the storage classes of the objects, set the number of versions, and delete old files."},{"l":"C","t":"Enable object versioning on the bucket, and use Cloud Scheduler to invoke a Cloud Functions instance to move or delete your documents based on their metadata."},{"l":"D","t":"Enable object versioning on the bucket, use lifecycle conditions to change the storage class of the objects, set the number of versions, and delete old files."}],"a":"D","e":"要保存同一份發票的多個修訂版本，就要啟用物件版本控管（object versioning）。再用生命週期條件：365 天後改成較便宜的儲存類別、保留最多 5 個版本、5 年後刪除，全部自動處理，不用寫程式。保留政策（A、B）不能和物件版本控管同時使用；C 要自己寫 Cloud Function，增加開發和維運成本。","t":["Cloud Storage","Object Versioning","Object Lifecycle","Storage Class"]},{"n":251,"s":"You installed the Google Cloud CLI on your workstation and set the proxy configuration. However, you are worried that your proxy credentials will be recorded in the gcloud CLI logs. You want to prevent your proxy credential from being logged. What should you do?","o":[{"l":"A","t":"Configure username and password by using gcloud config set proxy/username and gcloud config set proxy/password commands."},{"l":"B","t":"Encode username and password in sha256 encoding, and save in to a text file. Use filename as a value in the gcloud config set core/custom_ca_certs_file command."},{"l":"C","t":"Provide values for CLOUDSDK_PROXY_USERNAME and CLOUDSDK_PROXY_PASSWORD in the gcloud CLI tool configuration file."},{"l":"D","t":"Set the CLOUDSDK_PROXY_USERNAME and CLOUDSDK_PROXY_PASSWORD properties by using environment variables in your command line tool."}],"a":"D","e":"用環境變數設定 CLOUDSDK_PROXY_USERNAME 和 CLOUDSDK_PROXY_PASSWORD，帳密只存在目前的終端機工作階段，不會寫進 gcloud 設定檔，也不會出現在 gcloud 記錄中。A 和 C 會把帳密存進設定檔，可能被記錄；B 的 custom_ca_certs_file 是放 CA 憑證的，跟 proxy 帳密無關。","t":["gcloud CLI"]},{"n":252,"s":"Your company developed an application to deploy on Google Kubernetes Engine. Certain parts of the application are not fault-tolerant and are allowed to have downtime. Other parts of the application are critical and must always be available. You need to configure a Google Kubernetes Engine cluster while optimizing for cost. What should you do?","o":[{"l":"A","t":"Create a cluster with a single node-pool by using standard VMs. Label he fault-tolerant Deployments as spot_true."},{"l":"B","t":"Create a cluster with a single node-pool by using Spot VMs. Label the critical Deployments as spot_false."},{"l":"C","t":"Create a cluster with both a Spot VM node pool and a node pool by using standard VMs. Deploy the critical deployments on the Spot VM node pool and the fault-tolerant deployments on the node pool by using standard VMs."},{"l":"D","t":"Create a cluster with both a Spot VM node pool and a nods pool by using standard VMs. Deploy the critical deployments on the node pool by using standard VMs and the fault-tolerant deployments on the Spot VM node pool."}],"a":"D","e":"最省錢的做法是建立兩個節點集區：Spot VM 節點集區（便宜但可能被回收）跑可以容忍中斷的部分，一般 VM 節點集區跑必須一直可用的關鍵部分。A、B 只有一個節點集區，加標籤不會改變 Pod 實際跑在哪種 VM 上；C 把關鍵服務放在 Spot VM，剛好放反。","t":["GKE","GKE Node Pool","Spot VM","Cost Optimization"]},{"n":253,"s":"You need to deploy an application in Google Cloud using serverless technology. You want to test a new version of the application with a small percentage of production traffic. What should you do?","o":[{"l":"A","t":"Deploy the application to Cloud Run. Use gradual rollouts for traffic splitting."},{"l":"B","t":"Deploy the application to Google Kubernetes Engine. Use Anthos Service Mash for traffic splitting."},{"l":"C","t":"Deploy the application to Cloud Functions. Specify the version number in the functions name."},{"l":"D","t":"Deploy the application to App Engine. For each new version, create a new service."}],"a":"A","e":"題目要無伺服器又要小比例測試新版本：部署到 Cloud Run，用漸進式發布（gradual rollout）在 revision 之間分配流量。GKE（B）不是無伺服器；Cloud Functions（C）用函式名稱區分版本無法分流；App Engine（D）每個版本建新 service 也無法分流。","t":["Cloud Run","Traffic Splitting","Canary Deployment","Compute Selection"]},{"n":254,"s":"Your company's security vulnerability management policy wants a member of the security team to have visibility into vulnerabilities and other OS metadata for a specific Compute Engine instance. This Compute Engine instance hosts a critical application in your Google Cloud project. You need to implement your company's security vulnerability management policy. What should you do?","o":[{"l":"A","t":"• Ensure that the Ops Agent is installed on the Compute Engine instance.\n• Create a custom metric in the Cloud Monitoring dashboard.\n• Provide the security team member with access to this dashboard."},{"l":"B","t":"• Ensure that the Ops Agent is installed on the Compute Engine instance.\n• Provide the security team member roles/osconfig.inventoryViewer permission."},{"l":"C","t":"• Ensure that the OS Config agent is installed on the Compute Engine instance.\n• Provide the security team member roles/osconfig.vulnerabilityReportViewer permission."},{"l":"D","t":"• Ensure that the OS Config agent is installed on the Compute Engine instance.\n• Create a log sink to BigQuery dataset.\n• Provide the security team member with access to this dataset."}],"a":"C","e":"要查看 VM 的漏洞和作業系統資訊，要用 VM Manager 的 OS Config agent，它會產生漏洞報告。再給資安人員 roles/osconfig.vulnerabilityReportViewer，只能查看漏洞報告。Ops Agent（A、B）收集的是記錄和指標，不是漏洞資訊；D 匯出到 BigQuery 多此一舉。","t":["Compute Engine","VM Manager","IAM"]},{"n":255,"s":"You want to enable your development team to deploy new features to an existing Cloud Run service in production. To minimize the risk associated with a new revision, you want to reduce the number of customers who might be affected by an outage without introducing any development or operational costs to your customers. You want to follow Google-recommended practices for managing revisions to a service. What should you do?","o":[{"l":"A","t":"Ask your customers to retry access to your service with exponential backoff to mitigate any potential problems after the new revision is deployed."},{"l":"B","t":"Gradually roll out the new revision and split customer traffic between the revisions to allow rollback in case a problem occurs."},{"l":"C","t":"Send all customer traffic to the new revision, and roll back to a previous revision if you witness any problems in production."},{"l":"D","t":"Deploy your application to a second Cloud Run service, and ask your customers to use the second Cloud Run service."}],"a":"B","e":"漸進式發布新 revision，並在新舊 revision 之間分配流量，出問題時只有少部分客戶受影響，還能快速回滾，這是 Cloud Run 建議的做法。A 把成本轉嫁給客戶；C 一次把全部流量切過去，所有客戶都會受影響；D 要客戶改用新網址。","t":["Cloud Run","Traffic Splitting","Canary Deployment"]},{"n":256,"s":"You have deployed an application on a Compute Engine instance. An external consultant needs to access the Linux-based instance. The consultant is connected to your corporate network through a VPN connection, but the consultant has no Google account. What should you do?","o":[{"l":"A","t":"Instruct the external consultant to use the gcloud compute ssh command line tool by using Identity-Aware Proxy to access the instance."},{"l":"B","t":"Instruct the external consultant to use the gcloud compute ssh command line tool by using the public IP address of the instance to access it."},{"l":"C","t":"Instruct the external consultant to generate an SSH key pair, and request the public key from the consultant. Add the public key to the instance yourself, and have the consultant access the instance through SSH with their private key."},{"l":"D","t":"Instruct the external consultant to generate an SSH key pair, and request the private key from the consultant. Add the private key to the instance yourself, and have the consultant access the instance through SSH with their public key."}],"a":"C","e":"顧問沒有 Google 帳號，就無法使用 gcloud 或 IAP（A、B），這兩者都需要 Google 身分。正確做法是請顧問產生 SSH 金鑰組，把公鑰交給你加到 VM 上，顧問用自己的私鑰登入；顧問已經透過 VPN 連進公司網路，可以連到 VM 的內部 IP。私鑰絕對不能交給別人（D）。","t":["Compute Engine","SSH Access"]},{"n":257,"s":"After a recent security incident, your startup company wants better insight into what is happening in the Google Cloud environment. You need to monitor unexpected firewall changes and instance creation. Your company prefers simple solutions. What should you do?","o":[{"l":"A","t":"Create a log sink to forward Cloud Audit Logs filtered for firewalls and compute instances to Cloud Storage. Use BigQuery to periodically analyze log events in the storage bucket."},{"l":"B","t":"Use Cloud Logging filters to create log-based metrics for firewall and instance actions. Monitor the changes and set up reasonable alerts."},{"l":"C","t":"Install Kibana on a compute instance. Create a log sink to forward Cloud Audit Logs filtered for firewalls and compute instances to Pub/Sub. Target the Pub/Sub topic to push messages to the Kibana instance. Analyze the logs on Kibana in real time."},{"l":"D","t":"Turn on Google Cloud firewall rules logging, and set up alerts for any insert, update, or delete events."}],"a":"B","e":"最簡單的方式：從 Cloud Audit Logs 中篩選防火牆和執行個體的變更，建立以記錄為基礎的指標，再設定快訊。A、C 要搭建額外的分析流程，太複雜；D 的防火牆規則記錄只記錄連線，不記錄規則的新增或修改。","t":["Cloud Logging","Cloud Audit Logs","Log-based Metrics","Alerting"]},{"n":258,"s":"You are configuring service accounts for an application that spans multiple projects. Virtual machines (VMs) running in the web-applications project need access to BigQuery datasets in the crm-databases project. You want to follow Google-recommended practices to grant access to the service account in the web-applications project. What should you do?","o":[{"l":"A","t":"Grant \"project owner\" for web-applications appropriate roles to crm-databases."},{"l":"B","t":"Grant \"project owner\" role to crm-databases and the web-applications project."},{"l":"C","t":"Grant \"project owner\" role to crm-databases and roles/bigquery.dataViewer role to web-applications."},{"l":"D","t":"Grant roles/bigquery.dataViewer role to crm-databases and appropriate roles to web-applications."}],"a":"D","e":"題目要讓 web-applications 專案中的 Service Account 讀取 crm-databases 專案的 BigQuery 資料集：在 crm-databases 授予它 roles/bigquery.dataViewer 讀取資料，在 web-applications 授予它執行查詢需要的角色（例如 BigQuery Job User）。A、B、C 都用到 project owner，違反最小權限原則。","t":["IAM","Service Account","BigQuery","Cross-Project Access"]},{"n":259,"s":"Your Dataproc cluster runs in a single Virtual Private Cloud (VPC) network in a single subnetwork with range 172.16.20.128/25. There are no private IP addresses available in the subnetwork. You want to add new VMs to communicate with your cluster using the minimum number of steps. What should you do?","o":[{"l":"A","t":"Modify the existing subnet range to 172.16.20.0/24."},{"l":"B","t":"Create a new Secondary IP Range in the VPC and configure the VMs to use that range."},{"l":"C","t":"Create a new VPC network for the VMs. Enable VPC Peering between the VMs'VPC network and the Dataproc cluster VPC network."},{"l":"D","t":"Create a new VPC network for the VMs with a subnet of 172.32.0.0/16. Enable VPC network Peering between the Dataproc VPC network and the VMs VPC network. Configure a custom Route exchange."}],"a":"A","e":"172.16.20.0/24 包含原本的 172.16.20.128/25，直接把子網路範圍擴大到 /24，就能多出 IP 給新的 VM，不需停機，步驟最少。B 的次要 IP 範圍是給別名 IP 用的；C、D 另建 VPC 再做 peering，步驟多很多。","t":["VPC","Subnets","Dataproc"]},{"n":260,"s":"You are building a backend service for an ecommerce platform that will persist transaction data from mobile and web clients. After the platform is launched, you expect a large volume of global transactions. Your business team wants to run SQL queries to analyze the data. You need to build a highly available and scalable data store for the platform. What should you do?","o":[{"l":"A","t":"Create a multi-region Cloud Spanner instance with an optimized schema."},{"l":"B","t":"Create a multi-region Firestore database with aggregation query enabled."},{"l":"C","t":"Create a multi-region Cloud SQL for PostgreSQL database with optimized indexes."},{"l":"D","t":"Create a multi-region BigQuery dataset with optimized tables."}],"a":"A","e":"全球大量交易又要能用 SQL 分析，還要高可用和可擴充，選多區域 Cloud Spanner（全球分散、強一致性的關聯式資料庫）。Firestore 不是 SQL 資料庫；Cloud SQL 無法多區域寫入，擴充也有限；BigQuery 是分析用，不適合當交易資料庫。","t":["Spanner","Database Selection"]},{"n":261,"s":"You are in charge of provisioning access for all Google Cloud users in your organization. Your company recently acquired a startup company that has their own Google Cloud organization. You need to ensure that your Site Reliability Engineers (SREs) have the same project permissions in the startup company's organization as in your own organization. What should you do?","o":[{"l":"A","t":"In the Google Cloud console for your organization, select Create role from selection, and choose destination as the startup company's organization."},{"l":"B","t":"In the Google Cloud console for the startup company, select Create role from selection and choose source as the startup company's Google Cloud organization."},{"l":"C","t":"Use the gcloud iam roles copy command, and provide the Organization ID of the startup company's Google Cloud Organization as the destination."},{"l":"D","t":"Use the gcloud iam roles copy command, and provide the project IDs of all projects in the startup company's organization as the destination."}],"a":"C","e":"gcloud iam roles copy 可以把自訂角色複製到另一個組織，目的地指定新創公司的組織 ID，角色就能用在該組織的所有專案。D 指定每個專案 ID 要逐一複製，工作量大；A、B 的主控台操作不是正確的流程。","t":["IAM","IAM Custom Role","gcloud CLI"]},{"n":262,"s":"You need to extract text from audio files by using the Speech-to-Text API. The audio files are pushed to a Cloud Storage bucket. You need to implement a fully managed, serverless compute solution that requires authentication and aligns with Google-recommended practices. You want to automate the call to the API by submitting each file to the API as the audio file arrives in the bucket. What should you do?","o":[{"l":"A","t":"Create an App Engine standard environment triggered by Cloud Storage bucket events to submit the file URI to the Google Speech-to-TextAPI."},{"l":"B","t":"Run a Kubernetes job to scan the bucket regularly for incoming files, and call the Speech-to-Text API for each unprocessed file."},{"l":"C","t":"Run a Python script by using a Linux cron job in Compute Engine to scan the bucket regularly for incoming files, and call the Speech-to-Text API for each unprocessed file."},{"l":"D","t":"Create a Cloud Function triggered by Cloud Storage bucket events to submit the file URI to the Google Speech-to-Text API."}],"a":"D","e":"要全代管、無伺服器、事件驅動：建立由 Cloud Storage 物件事件觸發的 Cloud Function，檔案一上傳就把檔案 URI 送給 Speech-to-Text API。App Engine 標準環境（A）不能直接由 Cloud Storage 事件觸發；B、C 定期掃描 bucket，不是檔案一到就處理，也不是全代管。","t":["Cloud Functions","Cloud Storage","Event-Driven","Speech-to-Text API"]},{"n":263,"s":"Your customer wants you to create a secure website with autoscaling based on the compute instance CPU load. You want to enhance performance by storing static content in Cloud Storage. Which resources are needed to distribute the user traffic?","o":[{"l":"A","t":"An external HTTP(S) load balancer with a managed SSL certificate to distribute the load and a URL map to target the requests for the static content to the Cloud Storage backend."},{"l":"B","t":"An external network load balancer pointing to the backend instances to distribute the load evenly. The web servers will forward the request to the Cloud Storage as needed."},{"l":"C","t":"An internal HTTP(S) load balancer together with Identity-Aware Proxy to allow only HTTPS traffic."},{"l":"D","t":"An external HTTP(S) load balancer to distribute the load and a URL map to target the requests for the static content to the Cloud Storage backend. Install the HTTPS certificates on the instance."}],"a":"A","e":"外部 HTTP(S) 負載平衡器搭配 Google 代管的 SSL 憑證處理 HTTPS，再用 URL 對應把靜態內容的請求導向 Cloud Storage 後端 bucket，其餘導向依 CPU 自動擴充的執行個體群組。D 在每台 VM 安裝憑證，管理麻煩；Network Load Balancer（B）沒有 URL 對應功能；內部負載平衡器（C）無法服務外部使用者。","t":["Load Balancing","Cloud Storage","SSL Certificates"]},{"n":264,"s":"The core business of your company is to rent out construction equipment at large scale. All the equipment that is being rented out has been equipped with multiple sensors that send event information every few seconds. These signals can vary from engine status, distance traveled, fuel level, and more. Customers are billed based on the consumption monitored by these sensors. You expect high throughput – up to thousands of events per hour per device – and need to retrieve consistent data based on the time of the event. Storing and retrieving individual signals should be atomic. What should you do?","o":[{"l":"A","t":"Create files in Cloud Storage as data comes in."},{"l":"B","t":"Create a file in Filestore per device, and append new data to that file."},{"l":"C","t":"Ingest the data into Cloud SQL. Use multiple read replicas to match the throughput."},{"l":"D","t":"Ingest the data into Bigtable. Create a row key based on the event timestamp."}],"a":"D","e":"大量感測器事件、高吞吐量、要依事件時間讀取，單筆讀寫要具原子性，最適合 Bigtable（時間序列的大量寫入、單一 row 操作具原子性）。以時間戳記設計 row key 方便依時間查詢（實務上通常會加上裝置 ID，避免熱點）。Cloud SQL 的寫入量撐不住；Cloud Storage 和 Filestore 不是資料庫。","t":["Bigtable","Database Selection"]},{"n":265,"s":"You just installed the Google Cloud CLI on your new corporate laptop. You need to list the existing instances of your company on Google Cloud. What must you do before you run the gcloud compute instances list command? (Choose two.)","o":[{"l":"A","t":"Run gcloud auth login, enter your login credentials in the dialog window, and paste the received login token to gcloud CLI."},{"l":"B","t":"Create a Google Cloud service account, and download the service account key. Place the key file in a folder on your machine where gcloud CLI can find it."},{"l":"C","t":"Download your Cloud Identity user account key. Place the key file in a folder on your machine where gcloud CLI can find it."},{"l":"D","t":"Run gcloud config set compute/zone $my_zone to set the default zone for gcloud CLI."},{"l":"E","t":"Run gcloud config set project $my_project to set the default project for gcloud CLI."}],"a":"A","e":"執行 gcloud compute instances list 前要先驗證身分（gcloud auth login），並指定要查詢的專案（gcloud config set project）。題目要選兩個，應該是 A 和 E，但來源 PDF 只列出 A。B 下載金鑰不安全；C 沒有「使用者帳號金鑰」這種東西；D 的預設可用區對列出執行個體不是必要的。","t":["gcloud CLI"]},{"n":266,"s":"You are planning to migrate your on-premises data to Google Cloud. The data includes:\n• 200 TB of video files in SAN storage\n• Data warehouse data stored on Amazon Redshift\n• 20 GB of PNG files stored on an S3 bucket\nYou need to load the video files into a Cloud Storage bucket, transfer the data warehouse data into BigQuery, and load the PNG files into a second Cloud Storage bucket. You want to follow Google-recommended practices and avoid writing any code for the migration. What should you do?","o":[{"l":"A","t":"Use gcloud storage for the video files, Dataflow for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"B","t":"Use Transfer Appliance for the videos, BigQuery Data Transfer Service for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"C","t":"Use Storage Transfer Service for the video files, BigQuery Data Transfer Service for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"D","t":"Use Cloud Data Fusion for the video files, Dataflow for the data warehouse data, and Storage Transfer Service for the PNG files."}],"a":"B","e":"200 TB 的影片檔要從 SAN 搬上雲，用 Transfer Appliance 實體裝置離線傳輸最快。Amazon Redshift 的資料倉儲用 BigQuery Data Transfer Service（支援 Redshift 遷移）；S3 上的 PNG 檔用 Storage Transfer Service。三者都不需要寫程式。Dataflow 和 Cloud Data Fusion 需要開發 pipeline。","t":["Migration","Data Transfer","Transfer Appliance","Storage Transfer Service","BigQuery Data Transfer Service"]},{"n":267,"s":"You want to deploy a new containerized application into Google Cloud by using a Kubernetes manifest. You want to have full control over the Kubernetes deployment, and at the same time, you want to minimize configuring infrastructure. What should you do?","o":[{"l":"A","t":"Deploy the application on GKE Autopilot."},{"l":"B","t":"Deploy the application on Cloud Run."},{"l":"C","t":"Deploy the application on GKE Standard."},{"l":"D","t":"Deploy the application on Cloud Functions."}],"a":"A","e":"要用 Kubernetes manifest 並保有完整的部署控制，就要用 GKE；又要減少基礎架構設定，所以選 GKE Autopilot（Google 管理節點）。GKE Standard（C）要自己管理節點；Cloud Run 和 Cloud Functions 不是用 Kubernetes manifest 部署。","t":["GKE","GKE Autopilot","Compute Selection"]},{"n":268,"s":"Your team is building a website that handles votes from a large user population. The incoming votes will arrive at various rates. You want to optimize the storage and processing of the votes. What should you do?","o":[{"l":"A","t":"Save the incoming votes to Firestore. Use Cloud Scheduler to trigger a Cloud Functions instance to periodically process the votes."},{"l":"B","t":"Use a dedicated instance to process the incoming votes. Send the votes directly to this instance."},{"l":"C","t":"Save the incoming votes to a JSON file on Cloud Storage. Process the votes in a batch at the end of the day."},{"l":"D","t":"Save the incoming votes to Pub/Sub. Use the Pub/Sub topic to trigger a Cloud Functions instance to process the votes."}],"a":"D","e":"投票流量時多時少，先把投票送進 Pub/Sub 緩衝，再由 Pub/Sub topic 觸發 Cloud Functions 處理，能自動擴充、不會漏票。A 定期批次處理會有延遲；B 單一執行個體在尖峰時撐不住；C 寫入同一個 JSON 檔會衝突，一天才處理一次也太慢。","t":["Pub/Sub","Cloud Functions","Event-Driven"]},{"n":269,"s":"You are deploying an application on Google Cloud that requires a relational database for storage. To satisfy your company’s security policies, your application must connect to your database through an encrypted and authenticated connection that requires minimal management and integrates with Identity and Access Management (IAM). What should you do?","o":[{"l":"A","t":"Deploy a Cloud SQL database with the SSL mode set to encrypted only, configure SSL/TLS client certificates, and configure a database user and password."},{"l":"B","t":"Deploy a Cloud SQL database with the SSL mode set to encrypted only, configure SSL/TLS client certificates, and configure IAM database authentication."},{"l":"C","t":"Deploy a Cloud SQL database and configure IAM database authentication. Access the database through the Cloud SQL Auth Proxy."},{"l":"D","t":"Deploy a Cloud SQL database and configure a database user and password. Access the database through the Cloud SQL Auth Proxy."}],"a":"C","e":"Cloud SQL Auth Proxy 會自動建立加密（TLS）且經過 IAM 授權的連線，不需要自己管理 SSL 憑證；再搭配 IAM 資料庫驗證，使用者登入也整合 IAM。A、B 要自己管理用戶端憑證，維運較多；A、D 用資料庫帳號密碼，沒有整合 IAM。","t":["Cloud SQL","Cloud SQL Auth Proxy","IAM"]},{"n":270,"s":"You have two Google Cloud projects: project-a with VPC vpc-a (10.0.0.0/16) and project-b with VPC vpc-b (10.8.0.0/16). Your frontend application resides in vpc-a and the backend API services are deployed in vpc-b. You need to efficiently and cost-effectively enable communication between these Google Cloud projects. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create an OpenVPN connection between vpc-a and vpc-b."},{"l":"B","t":"Create VPC Network Peering between vpc-a and vpc-b."},{"l":"C","t":"Configure a Cloud Router in vpc-a and another Cloud Router in vpc-b."},{"l":"D","t":"Configure a Cloud Interconnect connection between vpc-a and vpc-b."}],"a":"B","e":"兩個 VPC 的 IP 範圍不重疊（10.0.0.0/16 和 10.8.0.0/16），用 VPC Network Peering 就能透過內部 IP 直接互通，延遲低、成本低。OpenVPN（A）要自己維護；Cloud Interconnect（D）是連接地端用的；只建 Cloud Router（C）不會讓兩個 VPC 互通。","t":["VPC","VPC Peering"]},{"n":271,"s":"Your company is running a critical workload on a single Compute Engine VM instance. Your company's disaster recovery policies require you to back up the entire instance’s disk data every day. The backups must be retained for 7 days. You must configure a backup solution that complies with your company’s security policies and requires minimal setup and configuration. What should you do?","o":[{"l":"A","t":"Configure the instance to use persistent disk asynchronous replication."},{"l":"B","t":"Configure daily scheduled persistent disk snapshots with a retention period of 7 days."},{"l":"C","t":"Configure Cloud Scheduler to trigger a Cloud Function each day that creates a new machine image and deletes machine images that are older than 7 days."},{"l":"D","t":"Configure a bash script using gsutil to run daily through a cron job. Copy the disk’s files to a Cloud Storage bucket with archive storage class and an object lifecycle rule to delete the objects after 7 days."}],"a":"B","e":"永久磁碟快照排程可以每天自動備份整個磁碟，並設定保留 7 天，設定最簡單。A 的非同步複製是災難復原用的，不是每日備份；C、D 要自己寫程式或腳本，維護成本高，D 只複製檔案，不是完整的磁碟資料。","t":["Persistent Disk","Snapshot","Backup & Recovery"]},{"n":272,"s":"Your company requires that Google Cloud products are created with a specific configuration to comply with your company’s security policies. You need to implement a mechanism that will allow software engineers at your company to deploy and update Google Cloud products in a preconfigured and approved manner. What should you do?","o":[{"l":"A","t":"Create Java packages that utilize the Google Cloud Client Libraries for Java to configure Google Cloud products. Store and share the packages in a source code repository."},{"l":"B","t":"Create bash scripts that utilize the Google Cloud CLI to configure Google Cloud products. Store and share the bash scripts in a source code repository."},{"l":"C","t":"Use the Google Cloud APIs by using curl to configure Google Cloud products. Store and share the curl commands in a source code repository."},{"l":"D","t":"Create Terraform modules that utilize the Google Cloud Terraform Provider to configure Google Cloud products. Store and share the modules in a source code repository."}],"a":"D","e":"把公司核准的設定寫成 Terraform 模組，放在程式碼儲存庫共用，工程師用這些模組部署和更新資源，就能確保都符合安全政策。Terraform 是宣告式的，可以管理狀態和更新；A、B、C 的 Java、bash 和 curl 都是命令式腳本，難以安全地更新已存在的資源。","t":["IAC","Terraform"]},{"n":273,"s":"You are a Google Cloud organization administrator. You need to configure organization policies and log sinks on Google Cloud projects that cannot be removed by project users to comply with your company's security policies. The security policies are different for each company department. Each company department has a user with the Project Owner role assigned to their projects. What should you do?","o":[{"l":"A","t":"Use a standard naming convention for projects that includes the department name. Configure organization policies on the organization and log sinks on the projects."},{"l":"B","t":"Use a standard naming convention for projects that includes the department name. Configure both organization policies and log sinks on the projects."},{"l":"C","t":"Organize projects under folders for each department. Configure both organization policies and log sinks on the folders."},{"l":"D","t":"Organize projects under folders for each department. Configure organization policies on the organization and log sinks on the folders."}],"a":"C","e":"每個部門一個資料夾，把組織政策和記錄接收器（log sink）都設在資料夾上，底下專案會繼承。Project Owner 只有專案權限，不能移除資料夾層級的設定。設在專案上（A、B）Project Owner 可以自己移除；設在組織上（D）所有部門會套用同一套政策，但題目說各部門政策不同。","t":["Resource Hierarchy","Organization Policy","Log Sink"]},{"n":274,"s":"You are deploying a web application using Compute Engine. You created a managed instance group (MIG) to host the application. You want to follow Google-recommended practices to implement a secure and highly available solution. What should you do?","o":[{"l":"A","t":"Use SSL proxy load balancing for the MIG and an A record in your DNS private zone with the load balancer's IP address."},{"l":"B","t":"Use SSL proxy load balancing for the MIG and a CNAME record in your DNS public zone with the load balancer’s IP address."},{"l":"C","t":"Use HTTP(S) load balancing for the MIG and a CNAME record in your DNS private zone with the load balancer’s IP address."},{"l":"D","t":"Use HTTP(S) load balancing for the MIG and an A record in your DNS public zone with the load balancer’s IP address."}],"a":"D","e":"網頁應用程式用 HTTP(S) 負載平衡，安全又高可用；再在公開 DNS 區域建立 A 記錄指向負載平衡器的 IP。CNAME（B、C）只能指向網域名稱，不能指向 IP；私人區域（A、C）網際網路上的使用者查不到；SSL Proxy（A、B）是給非 HTTP 的 TLS 流量用的。","t":["MIG","Load Balancing","Cloud DNS","High Availability"]},{"n":275,"s":"You have several hundred microservice applications running in a Google Kubernetes Engine (GKE) cluster. Each microservice is a deployment with resource limits configured for each container in the deployment. You've observed that the resource limits for memory and CPU are not appropriately set for many of the microservices. You want to ensure that each microservice has right sized limits for memory and CPU. What should you do?","o":[{"l":"A","t":"Configure a Vertical Pod Autoscaler for each microservice."},{"l":"B","t":"Modify the cluster's node pool machine type and choose a machine type with more memory and CPU."},{"l":"C","t":"Configure a Horizontal Pod Autoscaler for each microservice."},{"l":"D","t":"Configure GKE cluster autoscaling."}],"a":"A","e":"VPA（Vertical Pod Autoscaler）會依實際使用量自動調整每個容器的 CPU 和記憶體 requests 與 limits，讓資源大小剛好。HPA（C）調整 Pod 數量，不調整資源大小；B 換機器類型和 D 叢集自動調度都只影響節點，不會修正 Pod 的資源設定。","t":["GKE","GKE Autoscaling"]},{"n":276,"s":"Your company uses BigQuery to store and analyze data. Upon submitting your query in BigQuery, the query fails with a quotaExceeded error. You need to diagnose the issue causing the error. What should you do? (Choose two.)","o":[{"l":"A","t":"Use BigQuery BI Engine to analyze the issue."},{"l":"B","t":"Use the INFORMATION_SCHEMA views to analyze the underlying issue."},{"l":"C","t":"Configure Cloud Trace to analyze the issue."},{"l":"D","t":"Search errors in Cloud Audit Logs to analyze the issue."},{"l":"E","t":"View errors in Cloud Monitoring to analyze the issue."}],"a":"BD","e":"診斷 BigQuery 的 quotaExceeded 錯誤，Google 建議查詢 INFORMATION_SCHEMA 檢視表（例如 JOBS，可看到工作和錯誤），以及在 Cloud Audit Logs 中搜尋錯誤記錄。BI Engine（A）是加速查詢的；Cloud Trace（C）是追蹤應用程式延遲的。","t":["BigQuery","Quotas","Cloud Audit Logs","Troubleshooting"]},{"n":277,"s":"Your team has developed a stateless application which requires it to be run directly on virtual machines. The application is expected to receive a fluctuating amount of traffic and needs to scale automatically. You need to deploy the application. What should you do?","o":[{"l":"A","t":"Deploy the application on a managed instance group and configure autoscaling."},{"l":"B","t":"Deploy the application on a Kubernetes Engine cluster and configure node pool autoscaling."},{"l":"C","t":"Deploy the application on Cloud Functions and configure the maximum number instances."},{"l":"D","t":"Deploy the application on Cloud Run and configure autoscaling."}],"a":"A","e":"應用程式必須直接在 VM 上執行，又要依流量自動擴充，選代管執行個體群組（MIG）並啟用自動調度。GKE、Cloud Functions、Cloud Run（B、C、D）都不是「直接在 VM 上執行」。","t":["MIG","MIG Autoscaling","Compute Selection"]},{"n":278,"s":"Your web application is hosted on Cloud Run and needs to query a Cloud SQL database. Every morning during a traffic spike, you notice API quota errors in Cloud SQL logs. The project has already reached the maximum API quota. You want to make a configuration change to mitigate the issue. What should you do?","o":[{"l":"A","t":"Modify the minimum number of Cloud Run instances."},{"l":"B","t":"Use traffic splitting."},{"l":"C","t":"Modify the maximum number of Cloud Run instances."},{"l":"D","t":"Set a minimum concurrent requests environment variable for the application."}],"a":"A","e":"每天早上流量暴增時，Cloud Run 會一次冷啟動大量新執行個體，每個新執行個體啟動時都會透過 Cloud SQL 連接器呼叫 Cloud SQL Admin API，瞬間就超過 API 配額。設定最少執行個體數，讓執行個體預先保持待命，尖峰時就不必一次啟動那麼多，API 呼叫也跟著減少。補充：這題有爭議，也有人認為限制最多執行個體數（C）也能減少 API 呼叫，不過 C 會讓尖峰時的請求排隊或失敗。","t":["Cloud Run","Cloud Run Scaling","Cloud SQL","Quotas"]},{"n":279,"s":"You need to deploy a single stateless web application with a web interface and multiple endpoints. For security reasons, the web application must be reachable from an internal IP address from your company's private VPC and on-premises network. You also need to update the web application multiple times per day with minimal effort and want to manage a minimal amount of cloud infrastructure. What should you do?","o":[{"l":"A","t":"Deploy the web application on Google Kubernetes Engine standard edition with an internal ingress."},{"l":"B","t":"Deploy the web application on Cloud Run with Private Google Access configured."},{"l":"C","t":"Deploy the web application on Cloud Run with Private Service Connect configured."},{"l":"D","t":"Deploy the web application to GKE Autopilot with Private Google Access configured."}],"a":"C","e":"要從公司 VPC 和地端用內部 IP 存取，又要少管基礎架構、方便每天多次更新：部署到 Cloud Run，再用 Private Service Connect 提供內部 IP 端點，地端可以透過 VPN 或 Interconnect 連到。Private Google Access（B、D）是讓 VM 往外連 Google API，不是讓別人從內部 IP 連進來；GKE（A、D）要管理的基礎架構較多。","t":["Cloud Run","Private Service Connect","Compute Selection"]},{"n":280,"s":"You use Cloud Logging to capture application logs. You now need to use SQL to analyze the application logs in Cloud Logging, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Develop SQL queries by using Gemini for Google Cloud."},{"l":"B","t":"Enable Log Analytics for the log bucket and create a linked dataset in BigQuery."},{"l":"C","t":"Create a schema for the storage bucket and run SQL queries for the data in the bucket."},{"l":"D","t":"Export logs to a storage bucket and create an external view in BigQuery."}],"a":"B","e":"在記錄儲存桶（log bucket）啟用 Log Analytics，並建立 BigQuery 連結資料集，就能直接用 SQL 分析 Cloud Logging 中的記錄，不需要另外匯出。Gemini（A）只能幫忙寫查詢，記錄本身還是不能用 SQL 查詢；C、D 要另外匯出，多一份資料。","t":["Cloud Logging","Log Analytics","BigQuery"]},{"n":281,"s":"You need to deploy a third-party software application onto a single Compute Engine VM instance. The application requires the highest speed read and write disk access for the internal database. You need to ensure the instance will recover on failure. What should you do?","o":[{"l":"A","t":"Create an instance template. Set the disk type to be an SSD Persistent Disk. Launch the instance template as part of a stateful managed instance group."},{"l":"B","t":"Create an instance template. Set the disk type to be an SSD Persistent Disk. Launch the instance template as part of a stateless managed instance group."},{"l":"C","t":"Create an instance template. Set the disk type to be Hyperdisk Extreme. Launch the instance template as part of a stateful managed instance group."},{"l":"D","t":"Create an instance template. Set the disk type to be Hyperdisk Extreme. Launch the instance template as part of a stateless managed instance group."}],"a":"C","e":"Hyperdisk Extreme 提供最高的 IOPS 和吞吐量，最符合「最高速讀寫」的需求。有狀態 MIG（stateful MIG）在 VM 故障自動修復時會保留磁碟資料，資料庫才不會遺失。SSD Persistent Disk（A、B）效能較低；無狀態 MIG（B、D）重建 VM 時會丟掉磁碟資料。","t":["Compute Engine","MIG","Instance Template","Hyperdisk"]},{"n":282,"s":"You have a VM instance running in a VPC with single-stack subnets. You need to ensure that the VM instance has a fixed IP address so that other services hosted in the same VPC can communicate with the VM. You want to follow Google-recommended practices while minimizing cost. What should you do?","o":[{"l":"A","t":"Promote the existing IP address of the VM to become a static external IP address."},{"l":"B","t":"Promote the existing IP address of the VM to become a static internal IP address."},{"l":"C","t":"Reserve a new static external IPv6 address and assign the new IP address to the VM."},{"l":"D","t":"Reserve a new static external IP address and assign the new IP address to the VM."}],"a":"B","e":"VPC 內部的其他服務要連到這台 VM，只需要固定的內部 IP。把目前的臨時內部 IP 升級成靜態內部 IP，不用換位址也最省錢。外部 IP（A、C、D）會額外收費，內部通訊也用不到。","t":["Compute Engine","VPC","Static IP"]},{"n":283,"s":"Your preview application, deployed on a single-zone Google Kubernetes Engine (GKE) cluster in us-central1, has gained popularity. You are now ready to make the application generally available. You need to deploy the application to production while ensuring high availability and resilience. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use the gcloud container clusters create command with the options --enable-multi-networking and\n--enable-autoscaling to create an autoscaling zonal cluster and deploy the application to it."},{"l":"B","t":"Use the gcloud container clusters create-auto command to create an autopilot cluster and deploy the application to it."},{"l":"C","t":"Use the gcloud container clusters update command with the option --region us-central1 to update the cluster and deploy the application to it."},{"l":"D","t":"Use the gcloud container clusters update command with the option --node-locations us-central1-a,us-central1-b to update the cluster and deploy the application to the nodes."}],"a":"B","e":"要高可用又符合 Google 建議，用 gcloud container clusters create-auto 建立 Autopilot 叢集，Autopilot 預設就是區域叢集，控制層和節點分散在多個可用區。已存在的可用區叢集無法改成區域叢集（C）；D 只把節點分散到多個可用區，控制層仍是單一可用區；A 仍然是可用區叢集。","t":["GKE","GKE Autopilot","High Availability","gcloud CLI"]},{"n":284,"s":"You are developing an application that will be deployed on Google Cloud. The application will use a service account to retrieve data from BigQuery. Before you deploy your application, you want to test the permissions of this service account from your local machine to ensure there will be no authentication issues. You want to ensure that you use the most secure method while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Generate a service account key, and configure the gcloud CLI to use this key. Issue a relevant BigQuery request through the gdoud CLI to test the access."},{"l":"B","t":"Grant the service account the BigQuery Administrator IAM role to ensure the service account has all required access."},{"l":"C","t":"Configure the gcloud CLI to use service account impersonation. Issue a relevant BigQuery request through the gcloud CLI to test the access."},{"l":"D","t":"Configure the gcloud CLI with Application Default Credentials using your user account. Issue a relevant BigQuery request through the gcloud CLI to test the access."}],"a":"C","e":"最安全的做法是讓 gcloud 使用 Service Account 冒用（impersonation），用自己的身分取得 Service Account 的短期憑證來測試，不需要下載金鑰。A 的金鑰外洩風險高；B 給 BigQuery Admin 違反最小權限，也不是測試方法；D 用的是你自己的權限，測不出 Service Account 的權限。","t":["Service Account","Service Account Impersonation","BigQuery","gcloud CLI"]},{"n":285,"s":"Your organization is migrating to Google Cloud. You want only users with company-issued Google accounts to access your Google Cloud environment. You must ensure that users of the same department can only access resources within their own department. You want to minimize operational costs while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Assign users to the relevant Google Groups, and provide access to cloud resources through Identity and Access Management (IAM) roles. Periodically identify and remove non-company issued Google accounts."},{"l":"B","t":"Assign users to the relevant Google Groups, and provide access to cloud resources through Identity and Access Management (IAM) roles. Use organization policies to block non-company issued emails."},{"l":"C","t":"Create a folder for each department in Resource Manager. Grant the users of each department the Folder Admin role on the folder of their department."},{"l":"D","t":"Create a folder for each department in Resource Manager. Grant all company users the Folder Admin role on the organization level."}],"a":"B","e":"用 Google 群組加上 IAM 角色，控制每個部門只能存取自己的資源；再用組織政策（網域限制共用）阻擋非公司發放的帳號。A 要定期手動清查，維運成本高；C、D 的 Folder Admin 權限太大，D 還讓所有人管理所有資料夾。","t":["IAM","Google Groups","Organization Policy"]},{"n":286,"s":"You are deploying an application to Cloud Run. Your application requires the use of an API that runs on Google Kubernetes Engine (GKE). You need to ensure that your Cloud Run service can privately reach the API on GKE, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Deploy an ingress resource on the GKE cluster to expose the API to the internet. Use Cloud Armor to filter for IP addresses that can connect to the API. On the Cloud Run service, configure the application to fetch its public IP address and update the Cloud Armor policy on startup to allow this IP address to call the API on ports 80 and 443."},{"l":"B","t":"Create an ingress firewall rule on the VPC to allow connections from 0.0.0.0/0 on ports 80 and 443."},{"l":"C","t":"Create an egress firewall rule on the VPC to allow connections to 0.0.0.0/ on ports 80 and 443."},{"l":"D","t":"Deploy an internal Application Load Balancer to expose the API on GKE to the VPC. Configure Cloud DNS with the IP address of the internal Application Load Balancer. Deploy a Serverless VPC Access connector to allow the Cloud Run service to call the API through the FQDN on Cloud DNS."}],"a":"D","e":"用內部 Application Load Balancer 在 VPC 內提供 GKE 上的 API，用 Cloud DNS 設定名稱，再部署 Serverless VPC Access connector，讓 Cloud Run 能透過私人網路呼叫 API。A、B、C 都把 API 暴露在網際網路上，不符合「私下存取」的要求。","t":["Cloud Run","GKE","Serverless VPC Access","Load Balancing","Cloud DNS"]},{"n":287,"s":"Your company uses a multi-cloud strategy that includes Google Cloud. You want to centralize application logs in a third-party software-as-a-service (SaaS) tool from all environments. You need to integrate logs originating from Cloud Logging, and you want to ensure the export occurs with the least amount of delay possible. What should you do?","o":[{"l":"A","t":"Create a Cloud Logging sink and configure BigQuery as the destination. Configure the SaaS tool to query BigQuery to retrieve the logs."},{"l":"B","t":"Create a Cloud Logging sink and configure Pub/Sub as the destination. Configure the SaaS tool to subscribe to the Pub/Sub topic to retrieve the logs."},{"l":"C","t":"Create a Cloud Logging sink and configure Cloud Storage as the destination. Configure the SaaS tool to read the Cloud Storage bucket to retrieve the logs."},{"l":"D","t":"Use a Cloud Scheduler cron job to trigger a Cloud Function that queries Cloud Logging and sends the logs to the SaaS tool."}],"a":"B","e":"要把記錄以最小延遲匯出到外部 SaaS，就建立以 Pub/Sub 為目的地的記錄接收器，SaaS 工具訂閱 topic 接近即時地取得記錄。BigQuery 和 Cloud Storage（A、C）都要再查詢或讀檔，Cloud Storage 的匯出還是每小時批次寫入；D 定期查詢會有延遲，也要自己寫程式。","t":["Cloud Logging","Log Sink","Pub/Sub"]},{"n":288,"s":"You are planning to migrate a database and a backend application to a Standard Google Kubernetes Engine (GKE) cluster. You need to prevent data loss and make sure there are enough nodes available for your backend application based on the demands of your workloads. You want to follow Google-recommended practices and minimize the amount of manual work required. What should you do?","o":[{"l":"A","t":"Run your database as a StatefulSet. Configure cluster autoscaling to handle changes in the demands of your workloads."},{"l":"B","t":"Run your database as a single Pod. Run the resize command when you notice changes in the demands of your workloads."},{"l":"C","t":"Run your database as a DaemonSet. Run the resize command when you notice changes in the demands of your workloads."},{"l":"D","t":"Run your database as a Deployment. Configure cluster autoscaling to handle changes in the demands of your workloads."}],"a":"A","e":"資料庫用 StatefulSet 搭配永久磁碟，Pod 有穩定的名稱和儲存空間，重新排程也不會遺失資料；再啟用叢集自動調度，節點會依工作負載自動增減。單一 Pod 和 Deploy
