,"t":"Configure a health check on the instance and set a “consecutive successes” Healthy threshold value of 1."},{"l":"C","t":"Connect to the instance’s serial console and read the application logs."},{"l":"D","t":"Install and configure the Ops agent and view the logs from Cloud Logging."}],"a":"D","t":["Compute Engine","Ops Agent","Cloud Logging","Troubleshooting"]},{"n":232,"s":"You recently received a new Google Cloud project with an attached billing account where you will work. You need to create instances, set firewalls, and store data in Cloud Storage. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use the gcloud CLI services enable cloudresourcemanager.googleapis.com command to enable all resources."},{"l":"B","t":"Use the gcloud services enable compute.googleapis.com command to enable Compute Engine and the gcloud services enable storage-api.googleapis.com command to enable the Cloud Storage APIs."},{"l":"C","t":"Open the Google Cloud console and enable all Google Cloud APIs from the API dashboard."},{"l":"D","t":"Open the Google Cloud console and run gcloud init --project in a Cloud Shell."}],"a":"B","t":["API Enablement","gcloud CLI"]},{"n":233,"s":"Your application development team has created Docker images for an application that will be deployed on Google Cloud. Your team does not want to manage the infrastructure associated with this application. You need to ensure that the application can scale automatically as it gains popularity. What should you do?","o":[{"l":"A","t":"Create an instance template with the container image, and deploy a Managed Instance Group with Autoscaling."},{"l":"B","t":"Upload Docker images to Artifact Registry, and deploy the application on Google Kubernetes Engine using Standard mode."},{"l":"C","t":"Upload Docker images to the Cloud Storage, and deploy the application on Google Kubernetes Engine using Standard mode."},{"l":"D","t":"Upload Docker images to Artifact Registry, and deploy the application on Cloud Run."}],"a":"D","t":["Cloud Run","Artifact Registry","Compute Selection"]},{"n":234,"s":"You are migrating a business critical application from your local data center into Google Cloud. As part of your high-availability strategy, you want to ensure that any data used by the application will be immediately available if a zonal failure occurs. What should you do?","o":[{"l":"A","t":"Store the application data on a zonal persistent disk. Create a snapshot schedule for the disk. If an outage occurs, create a new disk from the most recent snapshot and attach it to a new VM in another zone."},{"l":"B","t":"Store the application data on a zonal persistent disk. If an outage occurs, create an instance in another zone with this disk attached."},{"l":"C","t":"Store the application data on a regional persistent disk. Create a snapshot schedule for the disk. If an outage occurs, create a new disk from the most recent snapshot and attach it to a new VM in another zone."},{"l":"D","t":"Store the application data on a regional persistent disk. If an outage occurs, create an instance in another zone with this disk attached."}],"a":"D","t":["Persistent Disk","High Availability"]},{"n":235,"s":"The DevOps group in your organization needs full control of Compute Engine resources in your development project. However, they should not have permission to create or update any other resources in the project. You want to follow Google’s recommendations for setting permissions for the DevOps group. What should you do?","o":[{"l":"A","t":"Grant the basic role roles/viewer and the predefined role roles/compute.admin to the DevOps group."},{"l":"B","t":"Create an IAM policy and grant all compute.instanceAdmin.* permissions to the policy. Attach the policy to the DevOps group."},{"l":"C","t":"Create a custom role at the folder level and grant all compute.instanceAdmin.* permissions to the role. Grant the custom role to the DevOps group."},{"l":"D","t":"Grant the basic role roles/editor to the DevOps group."}],"a":"A","t":["IAM","IAM Predefined Roles","Least Privilege"]},{"n":236,"s":"Your team is running an on-premises ecommerce application. The application contains a complex set of microservices written in Python, and each microservice is running on Docker containers. Configurations are injected by using environment variables. You need to deploy your current application to a serverless Google Cloud cloud solution. What should you do?","o":[{"l":"A","t":"Use your existing CI/CD pipeline. Use the generated Docker images and deploy them to Cloud Run. Update the configurations and the required endpoints."},{"l":"B","t":"Use your existing continuous integration and delivery (CI/CD) pipeline. Use the generated Docker images and deploy them to Cloud Function. Use the same configuration as on-premises."},{"l":"C","t":"Use the existing codebase and deploy each service as a separate Cloud Function. Update the configurations and the required endpoints."},{"l":"D","t":"Use your existing codebase and deploy each service as a separate Cloud Run. Use the same configurations as on-premises."}],"a":"A","t":["Cloud Run","Compute Selection","Migration","CI/CD"]},{"n":237,"s":"You are running multiple microservices in a Kubernetes Engine cluster. One microservice is rendering images. The microservice responsible for the image rendering requires a large amount of CPU time compared to the memory it requires. The other microservices are workloads that are optimized for n2-standard machine types. You need to optimize your cluster so that all workloads are using resources as efficiently as possible. What should you do?","o":[{"l":"A","t":"Assign the pods of the image rendering microservice a higher pod priority than the other microservices."},{"l":"B","t":"Create a node pool with compute-optimized machine type nodes for the image rendering microservice. Use the node pool with general-purpose machine type nodes for the other microservices."},{"l":"C","t":"Use the node pool with general-purpose machine type nodes for the image rendering microservice. Create a node pool with compute-optimized machine type nodes for the other microservices."},{"l":"D","t":"Configure the required amount of CPU and memory in the resource requests specification of the image rendering microservice deployment. Keep the resource requests for the other microservices at the default."}],"a":"B","t":["GKE","GKE Node Pool","Machine Types"]},{"n":238,"s":"You are working in a team that has developed a new application that needs to be deployed on Kubernetes. The production application is business critical and should be optimized for reliability. You need to provision a Kubernetes cluster and want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create a GKE Autopilot cluster. Enroll the cluster in the rapid release channel."},{"l":"B","t":"Create a GKE Autopilot cluster. Enroll the cluster in the stable release channel."},{"l":"C","t":"Create a zonal GKE standard cluster. Enroll the cluster in the stable release channel."},{"l":"D","t":"Create a regional GKE standard cluster. Enroll the cluster in the rapid release channel."}],"a":"B","t":["GKE","GKE Autopilot","GKE Release Channels"]},{"n":239,"s":"You are responsible for a web application on Compute Engine. You want your support team to be notified automatically if users experience high latency for at least 5 minutes. You need a Google-recommended solution with no development cost. What should you do?","o":[{"l":"A","t":"Export Cloud Monitoring metrics to BigQuery and use a Looker Studio dashboard to monitor your web application’s latency."},{"l":"B","t":"Create an alert policy to send a notification when the HTTP response latency exceeds the specified threshold."},{"l":"C","t":"Implement an App Engine service which invokes the Cloud Monitoring API and sends a notification in case of anomalies."},{"l":"D","t":"Use the Cloud Monitoring dashboard to observe latency and take the necessary actions when the response latency exceeds the specified threshold."}],"a":"B","t":["Compute Engine","Cloud Monitoring","Alerting"]},{"n":240,"s":"You have an on-premises data analytics set of binaries that processes data files in memory for about 45 minutes every midnight. The sizes of those data files range from 1 gigabyte to 16 gigabytes. You want to migrate this application to Google Cloud with minimal effort and cost. What should you do?","o":[{"l":"A","t":"Create a container for the set of binaries. Use Cloud Scheduler to start a Cloud Run job for the container."},{"l":"B","t":"Create a container for the set of binaries. Deploy the container to Google Kubernetes Engine (GKE) and use the Kubernetes scheduler to start the application."},{"l":"C","t":"Upload the code to Cloud Functions. Use Cloud Scheduler to start the application."},{"l":"D","t":"Lift and shift to a VM on Compute Engine. Use an instance schedule to start and stop the instance."}],"a":"D","t":["Compute Engine","Compute Selection","Migration","Cost Optimization"]},{"n":241,"s":"You used the gcloud container clusters command to create two Google Cloud Kubernetes (GKE) clusters: prod-cluster and dev-cluster.\n• prod-cluster is a standard cluster.\n• dev-cluster is an auto-pilot cluster.\nWhen you run the kubectl get nodes command, you only see the nodes from prod-cluster. Which commands should you run to check the node status for dev-cluster?","o":[{"l":"A","t":"gcloud container clusters get-credentials dev-cluster\nkubectl get nodes"},{"l":"B","t":"gcloud container clusters update -generate-password dev-cluster kubectl get nodes"},{"l":"C","t":"kubectl config set-context dev-cluster\nkubectl cluster-info"},{"l":"D","t":"kubectl config set-credentials dev-cluster\nkubectl cluster-info"}],"a":"A","t":["GKE","kubectl","gcloud CLI"]},{"n":242,"s":"You recently discovered that your developers are using many service account keys during their development process. While you work on a long term improvement, you need to quickly implement a process to enforce short-lived service account credentials in your company. You have the following requirements:\n• All service accounts that require a key should be created in a centralized project called pj-sa.\n• Service account keys should only be valid for one day.\nYou need a Google-recommended solution that minimizes cost. What should you do?","o":[{"l":"A","t":"Implement a Cloud Run job to rotate all service account keys periodically in pj-sa. Enforce an org policy to deny service account key creation with an exception to pj-sa."},{"l":"B","t":"Implement a Kubernetes CronJob to rotate all service account keys periodically. Disable attachment of service accounts to resources in all projects with an exception to pj-sa."},{"l":"C","t":"Enforce an org policy constraint allowing the lifetime of service account keys to be 24 hours. Enforce an org policy constraint denying service account key creation with an exception on pj-sa."},{"l":"D","t":"Enforce a DENY org policy constraint over the lifetime of service account keys for 24 hours. Disable attachment of service accounts to resources in all projects with an exception to pj-sa."}],"a":"C","t":["Service Account","Service Account Key","Organization Policy"]},{"n":243,"s":"Your company is running a three-tier web application on virtual machines that use a MySQL database. You need to create an estimated total cost of cloud infrastructure to run this application on Google Cloud instances and Cloud SQL. What should you do?","o":[{"l":"A","t":"Create a Google spreadsheet with multiple Google Cloud resource combinations. On a separate sheet, import the current Google Cloud prices and use these prices for the calculations within formulas."},{"l":"B","t":"Use the Google Cloud Pricing Calculator and select the Cloud Operations template to define your web application with as much detail as possible."},{"l":"C","t":"Implement a similar architecture on Google Cloud, and run a reasonable load test on a smaller scale. Check the billing information, and calculate the estimated costs based on the real load your system usually handles."},{"l":"D","t":"Use the Google Cloud Pricing Calculator to determine the cost of every Google Cloud resource you expect to use. Use similar size instances for the web server, and use your current on-premises machines as a comparison for Cloud SQL."}],"a":"D","t":["Pricing Calculator"]},{"n":244,"s":"You have a Bigtable instance that consists of three nodes that store personally identifiable information (PII) data. You need to log all read or write operations, including any metadata or configuration reads of this database table, in your company’s Security Information and Event Management (SIEM) system. What should you do?","o":[{"l":"A","t":"• Navigate to Cloud Monitoring in the Google Cloud console, and create a custom monitoring job for the Bigtable instance to track all changes.\n• Create an alert by using webhook endpoints, with the SIEM endpoint as a receiver."},{"l":"B","t":"• Navigate to the Audit Logs page in the Google Cloud console, and enable Admin Write logs for the Bigtable instance.\n• Create a Cloud Functions instance to export logs from Cloud Logging to your SIEM."},{"l":"C","t":"• Navigate to the Audit Logs page in the Google Cloud console, and enable Data Read, Data Write and Admin Read logs for the Bigtable instance.\n• Create a Pub/Sub topic as a Cloud Logging sink destination, and add your SIEM as a subscriber to the topic."},{"l":"D","t":"• Install the Ops Agent on the Bigtable instance during configuration.\n• Create a service account with read permissions for the Bigtable instance.\n• Create a custom Dataflow job with this service account to export logs to the company’s SIEM system."}],"a":"C","t":["Bigtable","Cloud Audit Logs","Log Sink","Pub/Sub"]},{"n":245,"s":"You want to set up a Google Kubernetes Engine cluster. Verifiable node identity and integrity are required for the cluster, and nodes cannot be accessed from the internet. You want to reduce the operational cost of managing your cluster, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Deploy a private autopilot cluster."},{"l":"B","t":"Deploy a public autopilot cluster."},{"l":"C","t":"Deploy a standard public cluster and enable shielded nodes."},{"l":"D","t":"Deploy a standard private cluster and enable shielded nodes."}],"a":"A","t":["GKE","GKE Autopilot","GKE Private Cluster","Shielded Nodes"]},{"n":246,"s":"Your company wants to migrate their on-premises workloads to Google Cloud. The current on-premises workloads consist of:\n• A Flask web application\n• A backend API\n• A scheduled long-running background job for ETL and reporting\nYou need to keep operational costs low. You want to follow Google-recommended practices to migrate these workloads to serverless solutions on Google Cloud. What should you do?","o":[{"l":"A","t":"Migrate the web application to App Engine and the backend API to Cloud Run. Use Cloud Tasks to run your background job on Compute Engine."},{"l":"B","t":"Migrate the web application to App Engine and the backend API to Cloud Run. Use Cloud Tasks to run your background job on Cloud Run."},{"l":"C","t":"Run the web application on a Cloud Storage bucket and the backend API on Cloud Run. Use Cloud Tasks to run your background job on Cloud Run."},{"l":"D","t":"Run the web application on a Cloud Storage bucket and the backend API on Cloud Run. Use Cloud Tasks to run your background job on Compute Engine."}],"a":"B","t":["App Engine","Cloud Run","Cloud Tasks","Compute Selection","Migration"]},{"n":247,"s":"Your company is moving its continuous integration and delivery (CI/CD) pipeline to Compute Engine instances. The pipeline will manage the entire cloud infrastructure through code. How can you ensure that the pipeline has appropriate permissions while your system is following security best practices?","o":[{"l":"A","t":"• Attach a single service account to the compute instances.\n• Add minimal rights to the service account.\n• Allow the service account to impersonate a Cloud Identity user with elevated permissions to create, update, or delete resources."},{"l":"B","t":"• Add a step for human approval to the CI/CD pipeline before the execution of the infrastructure provisioning.\n• Use the human approvals IAM account for the provisioning."},{"l":"C","t":"• Attach a single service account to the compute instances.\n• Add all required Identity and Access Management (IAM) permissions to this service account to create, update, or delete resources."},{"l":"D","t":"• Create multiple service accounts, one for each pipeline with the appropriate minimal Identity and Access Management (IAM) permissions.\n• Use a secret manager service to store the key files of the service accounts.\n• Allow the CI/CD pipeline to request the appropriate secrets during the execution of the pipeline."}],"a":"D","t":["CI/CD","Service Account","Service Account Key","Secret Manager","Least Privilege"]},{"n":248,"s":"Your application stores files on Cloud Storage by using the Standard Storage class. The application only requires access to files created in the last 30 days. You want to automatically save costs on files that are no longer accessed by the application. What should you do?","o":[{"l":"A","t":"Create an object lifecycle on the storage bucket to change the storage class to Archive Storage for objects with an age over 30 days."},{"l":"B","t":"Create a cron job in Cloud Scheduler to call a Cloud Functions instance every day to delete files older than 30 days."},{"l":"C","t":"Create a retention policy on the storage bucket of 30 days, and lock the bucket by using a retention policy lock."},{"l":"D","t":"Enable object versioning on the storage bucket and add lifecycle rules to expire non-current versions after 30 days."}],"a":"A","t":["Cloud Storage","Storage Class","Object Lifecycle","Cost Optimization"]},{"n":249,"s":"Your manager asks you to deploy a workload to a Kubernetes cluster. You are not sure of the workload's resource requirements or how the requirements might vary depending on usage patterns, external dependencies, or other factors. You need a solution that makes cost-effective recommendations regarding CPU and memory requirements, and allows the workload to function consistently in any situation. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Configure the Horizontal Pod Autoscaler for availability, and configure the cluster autoscaler for suggestions."},{"l":"B","t":"Configure the Horizontal Pod Autoscaler for availability, and configure the Vertical Pod Autoscaler recommendations for suggestions."},{"l":"C","t":"Configure the Vertical Pod Autoscaler recommendations for availability, and configure the Cluster autoscaler for suggestions."},{"l":"D","t":"Configure the Vertical Pod Autoscaler recommendations for availability, and configure the Horizontal Pod Autoscaler for suggestions."}],"a":"B","t":["GKE","GKE Autoscaling"]},{"n":250,"s":"You need to migrate invoice documents stored on-premises to Cloud Storage. The documents have the following storage requirements:\n• Documents must be kept for five years.\n• Up to five revisions of the same invoice document must be stored, to allow for corrections.\n• Documents older than 365 days should be moved to lower cost storage tiers.\nYou want to follow Google-recommended practices to minimize your operational and development costs. What should you do?","o":[{"l":"A","t":"Enable retention policies on the bucket, and use Cloud Scheduler to invoke a Cloud Function to move or delete your documents based on their metadata."},{"l":"B","t":"Enable retention policies on the bucket, use lifecycle rules to change the storage classes of the objects, set the number of versions, and delete old files."},{"l":"C","t":"Enable object versioning on the bucket, and use Cloud Scheduler to invoke a Cloud Functions instance to move or delete your documents based on their metadata."},{"l":"D","t":"Enable object versioning on the bucket, use lifecycle conditions to change the storage class of the objects, set the number of versions, and delete old files."}],"a":"D","t":["Cloud Storage","Object Versioning","Object Lifecycle","Storage Class"]},{"n":251,"s":"You installed the Google Cloud CLI on your workstation and set the proxy configuration. However, you are worried that your proxy credentials will be recorded in the gcloud CLI logs. You want to prevent your proxy credential from being logged. What should you do?","o":[{"l":"A","t":"Configure username and password by using gcloud config set proxy/username and gcloud config set proxy/password commands."},{"l":"B","t":"Encode username and password in sha256 encoding, and save in to a text file. Use filename as a value in the gcloud config set core/custom_ca_certs_file command."},{"l":"C","t":"Provide values for CLOUDSDK_PROXY_USERNAME and CLOUDSDK_PROXY_PASSWORD in the gcloud CLI tool configuration file."},{"l":"D","t":"Set the CLOUDSDK_PROXY_USERNAME and CLOUDSDK_PROXY_PASSWORD properties by using environment variables in your command line tool."}],"a":"D","t":["gcloud CLI"]},{"n":252,"s":"Your company developed an application to deploy on Google Kubernetes Engine. Certain parts of the application are not fault-tolerant and are allowed to have downtime. Other parts of the application are critical and must always be available. You need to configure a Google Kubernetes Engine cluster while optimizing for cost. What should you do?","o":[{"l":"A","t":"Create a cluster with a single node-pool by using standard VMs. Label he fault-tolerant Deployments as spot_true."},{"l":"B","t":"Create a cluster with a single node-pool by using Spot VMs. Label the critical Deployments as spot_false."},{"l":"C","t":"Create a cluster with both a Spot VM node pool and a node pool by using standard VMs. Deploy the critical deployments on the Spot VM node pool and the fault-tolerant deployments on the node pool by using standard VMs."},{"l":"D","t":"Create a cluster with both a Spot VM node pool and a nods pool by using standard VMs. Deploy the critical deployments on the node pool by using standard VMs and the fault-tolerant deployments on the Spot VM node pool."}],"a":"D","t":["GKE","GKE Node Pool","Spot VM","Cost Optimization"]},{"n":253,"s":"You need to deploy an application in Google Cloud using serverless technology. You want to test a new version of the application with a small percentage of production traffic. What should you do?","o":[{"l":"A","t":"Deploy the application to Cloud Run. Use gradual rollouts for traffic splitting."},{"l":"B","t":"Deploy the application to Google Kubernetes Engine. Use Anthos Service Mash for traffic splitting."},{"l":"C","t":"Deploy the application to Cloud Functions. Specify the version number in the functions name."},{"l":"D","t":"Deploy the application to App Engine. For each new version, create a new service."}],"a":"A","t":["Cloud Run","Traffic Splitting","Canary Deployment","Compute Selection"]},{"n":254,"s":"Your company's security vulnerability management policy wants a member of the security team to have visibility into vulnerabilities and other OS metadata for a specific Compute Engine instance. This Compute Engine instance hosts a critical application in your Google Cloud project. You need to implement your company's security vulnerability management policy. What should you do?","o":[{"l":"A","t":"• Ensure that the Ops Agent is installed on the Compute Engine instance.\n• Create a custom metric in the Cloud Monitoring dashboard.\n• Provide the security team member with access to this dashboard."},{"l":"B","t":"• Ensure that the Ops Agent is installed on the Compute Engine instance.\n• Provide the security team member roles/osconfig.inventoryViewer permission."},{"l":"C","t":"• Ensure that the OS Config agent is installed on the Compute Engine instance.\n• Provide the security team member roles/osconfig.vulnerabilityReportViewer permission."},{"l":"D","t":"• Ensure that the OS Config agent is installed on the Compute Engine instance.\n• Create a log sink to BigQuery dataset.\n• Provide the security team member with access to this dataset."}],"a":"C","t":["Compute Engine","VM Manager","IAM"]},{"n":255,"s":"You want to enable your development team to deploy new features to an existing Cloud Run service in production. To minimize the risk associated with a new revision, you want to reduce the number of customers who might be affected by an outage without introducing any development or operational costs to your customers. You want to follow Google-recommended practices for managing revisions to a service. What should you do?","o":[{"l":"A","t":"Ask your customers to retry access to your service with exponential backoff to mitigate any potential problems after the new revision is deployed."},{"l":"B","t":"Gradually roll out the new revision and split customer traffic between the revisions to allow rollback in case a problem occurs."},{"l":"C","t":"Send all customer traffic to the new revision, and roll back to a previous revision if you witness any problems in production."},{"l":"D","t":"Deploy your application to a second Cloud Run service, and ask your customers to use the second Cloud Run service."}],"a":"B","t":["Cloud Run","Traffic Splitting","Canary Deployment"]},{"n":256,"s":"You have deployed an application on a Compute Engine instance. An external consultant needs to access the Linux-based instance. The consultant is connected to your corporate network through a VPN connection, but the consultant has no Google account. What should you do?","o":[{"l":"A","t":"Instruct the external consultant to use the gcloud compute ssh command line tool by using Identity-Aware Proxy to access the instance."},{"l":"B","t":"Instruct the external consultant to use the gcloud compute ssh command line tool by using the public IP address of the instance to access it."},{"l":"C","t":"Instruct the external consultant to generate an SSH key pair, and request the public key from the consultant. Add the public key to the instance yourself, and have the consultant access the instance through SSH with their private key."},{"l":"D","t":"Instruct the external consultant to generate an SSH key pair, and request the private key from the consultant. Add the private key to the instance yourself, and have the consultant access the instance through SSH with their public key."}],"a":"C","t":["Compute Engine","SSH Access"]},{"n":257,"s":"After a recent security incident, your startup company wants better insight into what is happening in the Google Cloud environment. You need to monitor unexpected firewall changes and instance creation. Your company prefers simple solutions. What should you do?","o":[{"l":"A","t":"Create a log sink to forward Cloud Audit Logs filtered for firewalls and compute instances to Cloud Storage. Use BigQuery to periodically analyze log events in the storage bucket."},{"l":"B","t":"Use Cloud Logging filters to create log-based metrics for firewall and instance actions. Monitor the changes and set up reasonable alerts."},{"l":"C","t":"Install Kibana on a compute instance. Create a log sink to forward Cloud Audit Logs filtered for firewalls and compute instances to Pub/Sub. Target the Pub/Sub topic to push messages to the Kibana instance. Analyze the logs on Kibana in real time."},{"l":"D","t":"Turn on Google Cloud firewall rules logging, and set up alerts for any insert, update, or delete events."}],"a":"B","t":["Cloud Logging","Cloud Audit Logs","Log-based Metrics","Alerting"]},{"n":258,"s":"You are configuring service accounts for an application that spans multiple projects. Virtual machines (VMs) running in the web-applications project need access to BigQuery datasets in the crm-databases project. You want to follow Google-recommended practices to grant access to the service account in the web-applications project. What should you do?","o":[{"l":"A","t":"Grant \"project owner\" for web-applications appropriate roles to crm-databases."},{"l":"B","t":"Grant \"project owner\" role to crm-databases and the web-applications project."},{"l":"C","t":"Grant \"project owner\" role to crm-databases and roles/bigquery.dataViewer role to web-applications."},{"l":"D","t":"Grant roles/bigquery.dataViewer role to crm-databases and appropriate roles to web-applications."}],"a":"D","t":["IAM","Service Account","BigQuery","Cross-Project Access"]},{"n":259,"s":"Your Dataproc cluster runs in a single Virtual Private Cloud (VPC) network in a single subnetwork with range 172.16.20.128/25. There are no private IP addresses available in the subnetwork. You want to add new VMs to communicate with your cluster using the minimum number of steps. What should you do?","o":[{"l":"A","t":"Modify the existing subnet range to 172.16.20.0/24."},{"l":"B","t":"Create a new Secondary IP Range in the VPC and configure the VMs to use that range."},{"l":"C","t":"Create a new VPC network for the VMs. Enable VPC Peering between the VMs'VPC network and the Dataproc cluster VPC network."},{"l":"D","t":"Create a new VPC network for the VMs with a subnet of 172.32.0.0/16. Enable VPC network Peering between the Dataproc VPC network and the VMs VPC network. Configure a custom Route exchange."}],"a":"A","t":["VPC","Subnets","Dataproc"]},{"n":260,"s":"You are building a backend service for an ecommerce platform that will persist transaction data from mobile and web clients. After the platform is launched, you expect a large volume of global transactions. Your business team wants to run SQL queries to analyze the data. You need to build a highly available and scalable data store for the platform. What should you do?","o":[{"l":"A","t":"Create a multi-region Cloud Spanner instance with an optimized schema."},{"l":"B","t":"Create a multi-region Firestore database with aggregation query enabled."},{"l":"C","t":"Create a multi-region Cloud SQL for PostgreSQL database with optimized indexes."},{"l":"D","t":"Create a multi-region BigQuery dataset with optimized tables."}],"a":"A","t":["Spanner","Database Selection"]},{"n":261,"s":"You are in charge of provisioning access for all Google Cloud users in your organization. Your company recently acquired a startup company that has their own Google Cloud organization. You need to ensure that your Site Reliability Engineers (SREs) have the same project permissions in the startup company's organization as in your own organization. What should you do?","o":[{"l":"A","t":"In the Google Cloud console for your organization, select Create role from selection, and choose destination as the startup company's organization."},{"l":"B","t":"In the Google Cloud console for the startup company, select Create role from selection and choose source as the startup company's Google Cloud organization."},{"l":"C","t":"Use the gcloud iam roles copy command, and provide the Organization ID of the startup company's Google Cloud Organization as the destination."},{"l":"D","t":"Use the gcloud iam roles copy command, and provide the project IDs of all projects in the startup company's organization as the destination."}],"a":"C","t":["IAM","IAM Custom Role","gcloud CLI"]},{"n":262,"s":"You need to extract text from audio files by using the Speech-to-Text API. The audio files are pushed to a Cloud Storage bucket. You need to implement a fully managed, serverless compute solution that requires authentication and aligns with Google-recommended practices. You want to automate the call to the API by submitting each file to the API as the audio file arrives in the bucket. What should you do?","o":[{"l":"A","t":"Create an App Engine standard environment triggered by Cloud Storage bucket events to submit the file URI to the Google Speech-to-TextAPI."},{"l":"B","t":"Run a Kubernetes job to scan the bucket regularly for incoming files, and call the Speech-to-Text API for each unprocessed file."},{"l":"C","t":"Run a Python script by using a Linux cron job in Compute Engine to scan the bucket regularly for incoming files, and call the Speech-to-Text API for each unprocessed file."},{"l":"D","t":"Create a Cloud Function triggered by Cloud Storage bucket events to submit the file URI to the Google Speech-to-Text API."}],"a":"D","t":["Cloud Functions","Cloud Storage","Event-Driven","Speech-to-Text API"]},{"n":263,"s":"Your customer wants you to create a secure website with autoscaling based on the compute instance CPU load. You want to enhance performance by storing static content in Cloud Storage. Which resources are needed to distribute the user traffic?","o":[{"l":"A","t":"An external HTTP(S) load balancer with a managed SSL certificate to distribute the load and a URL map to target the requests for the static content to the Cloud Storage backend."},{"l":"B","t":"An external network load balancer pointing to the backend instances to distribute the load evenly. The web servers will forward the request to the Cloud Storage as needed."},{"l":"C","t":"An internal HTTP(S) load balancer together with Identity-Aware Proxy to allow only HTTPS traffic."},{"l":"D","t":"An external HTTP(S) load balancer to distribute the load and a URL map to target the requests for the static content to the Cloud Storage backend. Install the HTTPS certificates on the instance."}],"a":"A","t":["Load Balancing","Cloud Storage","SSL Certificates"]},{"n":264,"s":"The core business of your company is to rent out construction equipment at large scale. All the equipment that is being rented out has been equipped with multiple sensors that send event information every few seconds. These signals can vary from engine status, distance traveled, fuel level, and more. Customers are billed based on the consumption monitored by these sensors. You expect high throughput – up to thousands of events per hour per device – and need to retrieve consistent data based on the time of the event. Storing and retrieving individual signals should be atomic. What should you do?","o":[{"l":"A","t":"Create files in Cloud Storage as data comes in."},{"l":"B","t":"Create a file in Filestore per device, and append new data to that file."},{"l":"C","t":"Ingest the data into Cloud SQL. Use multiple read replicas to match the throughput."},{"l":"D","t":"Ingest the data into Bigtable. Create a row key based on the event timestamp."}],"a":"D","t":["Bigtable","Database Selection"]},{"n":265,"s":"You just installed the Google Cloud CLI on your new corporate laptop. You need to list the existing instances of your company on Google Cloud. What must you do before you run the gcloud compute instances list command? (Choose two.)","o":[{"l":"A","t":"Run gcloud auth login, enter your login credentials in the dialog window, and paste the received login token to gcloud CLI."},{"l":"B","t":"Create a Google Cloud service account, and download the service account key. Place the key file in a folder on your machine where gcloud CLI can find it."},{"l":"C","t":"Download your Cloud Identity user account key. Place the key file in a folder on your machine where gcloud CLI can find it."},{"l":"D","t":"Run gcloud config set compute/zone $my_zone to set the default zone for gcloud CLI."},{"l":"E","t":"Run gcloud config set project $my_project to set the default project for gcloud CLI."}],"a":"A","t":["gcloud CLI"],"note":"題目要求選兩個，但來源 PDF 只列出答案 A，這裡以 A 計分。"},{"n":266,"s":"You are planning to migrate your on-premises data to Google Cloud. The data includes:\n• 200 TB of video files in SAN storage\n• Data warehouse data stored on Amazon Redshift\n• 20 GB of PNG files stored on an S3 bucket\nYou need to load the video files into a Cloud Storage bucket, transfer the data warehouse data into BigQuery, and load the PNG files into a second Cloud Storage bucket. You want to follow Google-recommended practices and avoid writing any code for the migration. What should you do?","o":[{"l":"A","t":"Use gcloud storage for the video files, Dataflow for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"B","t":"Use Transfer Appliance for the videos, BigQuery Data Transfer Service for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"C","t":"Use Storage Transfer Service for the video files, BigQuery Data Transfer Service for the data warehouse data, and Storage Transfer Service for the PNG files."},{"l":"D","t":"Use Cloud Data Fusion for the video files, Dataflow for the data warehouse data, and Storage Transfer Service for the PNG files."}],"a":"B","t":["Migration","Data Transfer","Transfer Appliance","Storage Transfer Service","BigQuery Data Transfer Service"]},{"n":267,"s":"You want to deploy a new containerized application into Google Cloud by using a Kubernetes manifest. You want to have full control over the Kubernetes deployment, and at the same time, you want to minimize configuring infrastructure. What should you do?","o":[{"l":"A","t":"Deploy the application on GKE Autopilot."},{"l":"B","t":"Deploy the application on Cloud Run."},{"l":"C","t":"Deploy the application on GKE Standard."},{"l":"D","t":"Deploy the application on Cloud Functions."}],"a":"A","t":["GKE","GKE Autopilot","Compute Selection"]},{"n":268,"s":"Your team is building a website that handles votes from a large user population. The incoming votes will arrive at various rates. You want to optimize the storage and processing of the votes. What should you do?","o":[{"l":"A","t":"Save the incoming votes to Firestore. Use Cloud Scheduler to trigger a Cloud Functions instance to periodically process the votes."},{"l":"B","t":"Use a dedicated instance to process the incoming votes. Send the votes directly to this instance."},{"l":"C","t":"Save the incoming votes to a JSON file on Cloud Storage. Process the votes in a batch at the end of the day."},{"l":"D","t":"Save the incoming votes to Pub/Sub. Use the Pub/Sub topic to trigger a Cloud Functions instance to process the votes."}],"a":"D","t":["Pub/Sub","Cloud Functions","Event-Driven"]},{"n":269,"s":"You are deploying an application on Google Cloud that requires a relational database for storage. To satisfy your company’s security policies, your application must connect to your database through an encrypted and authenticated connection that requires minimal management and integrates with Identity and Access Management (IAM). What should you do?","o":[{"l":"A","t":"Deploy a Cloud SQL database with the SSL mode set to encrypted only, configure SSL/TLS client certificates, and configure a database user and password."},{"l":"B","t":"Deploy a Cloud SQL database with the SSL mode set to encrypted only, configure SSL/TLS client certificates, and configure IAM database authentication."},{"l":"C","t":"Deploy a Cloud SQL database and configure IAM database authentication. Access the database through the Cloud SQL Auth Proxy."},{"l":"D","t":"Deploy a Cloud SQL database and configure a database user and password. Access the database through the Cloud SQL Auth Proxy."}],"a":"C","t":["Cloud SQL","Cloud SQL Auth Proxy","IAM"]},{"n":270,"s":"You have two Google Cloud projects: project-a with VPC vpc-a (10.0.0.0/16) and project-b with VPC vpc-b (10.8.0.0/16). Your frontend application resides in vpc-a and the backend API services are deployed in vpc-b. You need to efficiently and cost-effectively enable communication between these Google Cloud projects. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create an OpenVPN connection between vpc-a and vpc-b."},{"l":"B","t":"Create VPC Network Peering between vpc-a and vpc-b."},{"l":"C","t":"Configure a Cloud Router in vpc-a and another Cloud Router in vpc-b."},{"l":"D","t":"Configure a Cloud Interconnect connection between vpc-a and vpc-b."}],"a":"B","t":["VPC","VPC Peering"]},{"n":271,"s":"Your company is running a critical workload on a single Compute Engine VM instance. Your company's disaster recovery policies require you to back up the entire instance’s disk data every day. The backups must be retained for 7 days. You must configure a backup solution that complies with your company’s security policies and requires minimal setup and configuration. What should you do?","o":[{"l":"A","t":"Configure the instance to use persistent disk asynchronous replication."},{"l":"B","t":"Configure daily scheduled persistent disk snapshots with a retention period of 7 days."},{"l":"C","t":"Configure Cloud Scheduler to trigger a Cloud Function each day that creates a new machine image and deletes machine images that are older than 7 days."},{"l":"D","t":"Configure a bash script using gsutil to run daily through a cron job. Copy the disk’s files to a Cloud Storage bucket with archive storage class and an object lifecycle rule to delete the objects after 7 days."}],"a":"B","t":["Persistent Disk","Snapshot","Backup & Recovery"]},{"n":272,"s":"Your company requires that Google Cloud products are created with a specific configuration to comply with your company’s security policies. You need to implement a mechanism that will allow software engineers at your company to deploy and update Google Cloud products in a preconfigured and approved manner. What should you do?","o":[{"l":"A","t":"Create Java packages that utilize the Google Cloud Client Libraries for Java to configure Google Cloud products. Store and share the packages in a source code repository."},{"l":"B","t":"Create bash scripts that utilize the Google Cloud CLI to configure Google Cloud products. Store and share the bash scripts in a source code repository."},{"l":"C","t":"Use the Google Cloud APIs by using curl to configure Google Cloud products. Store and share the curl commands in a source code repository."},{"l":"D","t":"Create Terraform modules that utilize the Google Cloud Terraform Provider to configure Google Cloud products. Store and share the modules in a source code repository."}],"a":"D","t":["IAC","Terraform"]},{"n":273,"s":"You are a Google Cloud organization administrator. You need to configure organization policies and log sinks on Google Cloud projects that cannot be removed by project users to comply with your company's security policies. The security policies are different for each company department. Each company department has a user with the Project Owner role assigned to their projects. What should you do?","o":[{"l":"A","t":"Use a standard naming convention for projects that includes the department name. Configure organization policies on the organization and log sinks on the projects."},{"l":"B","t":"Use a standard naming convention for projects that includes the department name. Configure both organization policies and log sinks on the projects."},{"l":"C","t":"Organize projects under folders for each department. Configure both organization policies and log sinks on the folders."},{"l":"D","t":"Organize projects under folders for each department. Configure organization policies on the organization and log sinks on the folders."}],"a":"C","t":["Resource Hierarchy","Organization Policy","Log Sink"]},{"n":274,"s":"You are deploying a web application using Compute Engine. You created a managed instance group (MIG) to host the application. You want to follow Google-recommended practices to implement a secure and highly available solution. What should you do?","o":[{"l":"A","t":"Use SSL proxy load balancing for the MIG and an A record in your DNS private zone with the load balancer's IP address."},{"l":"B","t":"Use SSL proxy load balancing for the MIG and a CNAME record in your DNS public zone with the load balancer’s IP address."},{"l":"C","t":"Use HTTP(S) load balancing for the MIG and a CNAME record in your DNS private zone with the load balancer’s IP address."},{"l":"D","t":"Use HTTP(S) load balancing for the MIG and an A record in your DNS public zone with the load balancer’s IP address."}],"a":"D","t":["MIG","Load Balancing","Cloud DNS","High Availability"]},{"n":275,"s":"You have several hundred microservice applications running in a Google Kubernetes Engine (GKE) cluster. Each microservice is a deployment with resource limits configured for each container in the deployment. You've observed that the resource limits for memory and CPU are not appropriately set for many of the microservices. You want to ensure that each microservice has right sized limits for memory and CPU. What should you do?","o":[{"l":"A","t":"Configure a Vertical Pod Autoscaler for each microservice."},{"l":"B","t":"Modify the cluster's node pool machine type and choose a machine type with more memory and CPU."},{"l":"C","t":"Configure a Horizontal Pod Autoscaler for each microservice."},{"l":"D","t":"Configure GKE cluster autoscaling."}],"a":"A","t":["GKE","GKE Autoscaling"]},{"n":276,"s":"Your company uses BigQuery to store and analyze data. Upon submitting your query in BigQuery, the query fails with a quotaExceeded error. You need to diagnose the issue causing the error. What should you do? (Choose two.)","o":[{"l":"A","t":"Use BigQuery BI Engine to analyze the issue."},{"l":"B","t":"Use the INFORMATION_SCHEMA views to analyze the underlying issue."},{"l":"C","t":"Configure Cloud Trace to analyze the issue."},{"l":"D","t":"Search errors in Cloud Audit Logs to analyze the issue."},{"l":"E","t":"View errors in Cloud Monitoring to analyze the issue."}],"a":"BD","t":["BigQuery","Quotas","Cloud Audit Logs","Troubleshooting"]},{"n":277,"s":"Your team has developed a stateless application which requires it to be run directly on virtual machines. The application is expected to receive a fluctuating amount of traffic and needs to scale automatically. You need to deploy the application. What should you do?","o":[{"l":"A","t":"Deploy the application on a managed instance group and configure autoscaling."},{"l":"B","t":"Deploy the application on a Kubernetes Engine cluster and configure node pool autoscaling."},{"l":"C","t":"Deploy the application on Cloud Functions and configure the maximum number instances."},{"l":"D","t":"Deploy the application on Cloud Run and configure autoscaling."}],"a":"A","t":["MIG","MIG Autoscaling","Compute Selection"]},{"n":278,"s":"Your web application is hosted on Cloud Run and needs to query a Cloud SQL database. Every morning during a traffic spike, you notice API quota errors in Cloud SQL logs. The project has already reached the maximum API quota. You want to make a configuration change to mitigate the issue. What should you do?","o":[{"l":"A","t":"Modify the minimum number of Cloud Run instances."},{"l":"B","t":"Use traffic splitting."},{"l":"C","t":"Modify the maximum number of Cloud Run instances."},{"l":"D","t":"Set a minimum concurrent requests environment variable for the application."}],"a":"A","t":["Cloud Run","Cloud Run Scaling","Cloud SQL","Quotas"]},{"n":279,"s":"You need to deploy a single stateless web application with a web interface and multiple endpoints. For security reasons, the web application must be reachable from an internal IP address from your company's private VPC and on-premises network. You also need to update the web application multiple times per day with minimal effort and want to manage a minimal amount of cloud infrastructure. What should you do?","o":[{"l":"A","t":"Deploy the web application on Google Kubernetes Engine standard edition with an internal ingress."},{"l":"B","t":"Deploy the web application on Cloud Run with Private Google Access configured."},{"l":"C","t":"Deploy the web application on Cloud Run with Private Service Connect configured."},{"l":"D","t":"Deploy the web application to GKE Autopilot with Private Google Access configured."}],"a":"C","t":["Cloud Run","Private Service Connect","Compute Selection"]},{"n":280,"s":"You use Cloud Logging to capture application logs. You now need to use SQL to analyze the application logs in Cloud Logging, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Develop SQL queries by using Gemini for Google Cloud."},{"l":"B","t":"Enable Log Analytics for the log bucket and create a linked dataset in BigQuery."},{"l":"C","t":"Create a schema for the storage bucket and run SQL queries for the data in the bucket."},{"l":"D","t":"Export logs to a storage bucket and create an external view in BigQuery."}],"a":"B","t":["Cloud Logging","Log Analytics","BigQuery"]},{"n":281,"s":"You need to deploy a third-party software application onto a single Compute Engine VM instance. The application requires the highest speed read and write disk access for the internal database. You need to ensure the instance will recover on failure. What should you do?","o":[{"l":"A","t":"Create an instance template. Set the disk type to be an SSD Persistent Disk. Launch the instance template as part of a stateful managed instance group."},{"l":"B","t":"Create an instance template. Set the disk type to be an SSD Persistent Disk. Launch the instance template as part of a stateless managed instance group."},{"l":"C","t":"Create an instance template. Set the disk type to be Hyperdisk Extreme. Launch the instance template as part of a stateful managed instance group."},{"l":"D","t":"Create an instance template. Set the disk type to be Hyperdisk Extreme. Launch the instance template as part of a stateless managed instance group."}],"a":"C","t":["Compute Engine","MIG","Instance Template","Hyperdisk"]},{"n":282,"s":"You have a VM instance running in a VPC with single-stack subnets. You need to ensure that the VM instance has a fixed IP address so that other services hosted in the same VPC can communicate with the VM. You want to follow Google-recommended practices while minimizing cost. What should you do?","o":[{"l":"A","t":"Promote the existing IP address of the VM to become a static external IP address."},{"l":"B","t":"Promote the existing IP address of the VM to become a static internal IP address."},{"l":"C","t":"Reserve a new static external IPv6 address and assign the new IP address to the VM."},{"l":"D","t":"Reserve a new static external IP address and assign the new IP address to the VM."}],"a":"B","t":["Compute Engine","VPC","Static IP"]},{"n":283,"s":"Your preview application, deployed on a single-zone Google Kubernetes Engine (GKE) cluster in us-central1, has gained popularity. You are now ready to make the application generally available. You need to deploy the application to production while ensuring high availability and resilience. You also want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use the gcloud container clusters create command with the options --enable-multi-networking and\n--enable-autoscaling to create an autoscaling zonal cluster and deploy the application to it."},{"l":"B","t":"Use the gcloud container clusters create-auto command to create an autopilot cluster and deploy the application to it."},{"l":"C","t":"Use the gcloud container clusters update command with the option --region us-central1 to update the cluster and deploy the application to it."},{"l":"D","t":"Use the gcloud container clusters update command with the option --node-locations us-central1-a,us-central1-b to update the cluster and deploy the application to the nodes."}],"a":"B","t":["GKE","GKE Autopilot","High Availability","gcloud CLI"]},{"n":284,"s":"You are developing an application that will be deployed on Google Cloud. The application will use a service account to retrieve data from BigQuery. Before you deploy your application, you want to test the permissions of this service account from your local machine to ensure there will be no authentication issues. You want to ensure that you use the most secure method while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Generate a service account key, and configure the gcloud CLI to use this key. Issue a relevant BigQuery request through the gdoud CLI to test the access."},{"l":"B","t":"Grant the service account the BigQuery Administrator IAM role to ensure the service account has all required access."},{"l":"C","t":"Configure the gcloud CLI to use service account impersonation. Issue a relevant BigQuery request through the gcloud CLI to test the access."},{"l":"D","t":"Configure the gcloud CLI with Application Default Credentials using your user account. Issue a relevant BigQuery request through the gcloud CLI to test the access."}],"a":"C","t":["Service Account","Service Account Impersonation","BigQuery","gcloud CLI"]},{"n":285,"s":"Your organization is migrating to Google Cloud. You want only users with company-issued Google accounts to access your Google Cloud environment. You must ensure that users of the same department can only access resources within their own department. You want to minimize operational costs while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Assign users to the relevant Google Groups, and provide access to cloud resources through Identity and Access Management (IAM) roles. Periodically identify and remove non-company issued Google accounts."},{"l":"B","t":"Assign users to the relevant Google Groups, and provide access to cloud resources through Identity and Access Management (IAM) roles. Use organization policies to block non-company issued emails."},{"l":"C","t":"Create a folder for each department in Resource Manager. Grant the users of each department the Folder Admin role on the folder of their department."},{"l":"D","t":"Create a folder for each department in Resource Manager. Grant all company users the Folder Admin role on the organization level."}],"a":"B","t":["IAM","Google Groups","Organization Policy"]},{"n":286,"s":"You are deploying an application to Cloud Run. Your application requires the use of an API that runs on Google Kubernetes Engine (GKE). You need to ensure that your Cloud Run service can privately reach the API on GKE, and you want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Deploy an ingress resource on the GKE cluster to expose the API to the internet. Use Cloud Armor to filter for IP addresses that can connect to the API. On the Cloud Run service, configure the application to fetch its public IP address and update the Cloud Armor policy on startup to allow this IP address to call the API on ports 80 and 443."},{"l":"B","t":"Create an ingress firewall rule on the VPC to allow connections from 0.0.0.0/0 on ports 80 and 443."},{"l":"C","t":"Create an egress firewall rule on the VPC to allow connections to 0.0.0.0/ on ports 80 and 443."},{"l":"D","t":"Deploy an internal Application Load Balancer to expose the API on GKE to the VPC. Configure Cloud DNS with the IP address of the internal Application Load Balancer. Deploy a Serverless VPC Access connector to allow the Cloud Run service to call the API through the FQDN on Cloud DNS."}],"a":"D","t":["Cloud Run","GKE","Serverless VPC Access","Load Balancing","Cloud DNS"]},{"n":287,"s":"Your company uses a multi-cloud strategy that includes Google Cloud. You want to centralize application logs in a third-party software-as-a-service (SaaS) tool from all environments. You need to integrate logs originating from Cloud Logging, and you want to ensure the export occurs with the least amount of delay possible. What should you do?","o":[{"l":"A","t":"Create a Cloud Logging sink and configure BigQuery as the destination. Configure the SaaS tool to query BigQuery to retrieve the logs."},{"l":"B","t":"Create a Cloud Logging sink and configure Pub/Sub as the destination. Configure the SaaS tool to subscribe to the Pub/Sub topic to retrieve the logs."},{"l":"C","t":"Create a Cloud Logging sink and configure Cloud Storage as the destination. Configure the SaaS tool to read the Cloud Storage bucket to retrieve the logs."},{"l":"D","t":"Use a Cloud Scheduler cron job to trigger a Cloud Function that queries Cloud Logging and sends the logs to the SaaS tool."}],"a":"B","t":["Cloud Logging","Log Sink","Pub/Sub"]},{"n":288,"s":"You are planning to migrate a database and a backend application to a Standard Google Kubernetes Engine (GKE) cluster. You need to prevent data loss and make sure there are enough nodes available for your backend application based on the demands of your workloads. You want to follow Google-recommended practices and minimize the amount of manual work required. What should you do?","o":[{"l":"A","t":"Run your database as a StatefulSet. Configure cluster autoscaling to handle changes in the demands of your workloads."},{"l":"B","t":"Run your database as a single Pod. Run the resize command when you notice changes in the demands of your workloads."},{"l":"C","t":"Run your database as a DaemonSet. Run the resize command when you notice changes in the demands of your workloads."},{"l":"D","t":"Run your database as a Deployment. Configure cluster autoscaling to handle changes in the demands of your workloads."}],"a":"A","t":["GKE","Kubernetes Workloads","GKE Autoscaling","Migration"]},{"n":289,"s":"You are the Organization Administrator for your company's Google Cloud resources. Your company has strict compliance rules that require you to be notified about any modifications to files and documents hosted on Cloud Storage. In a recent incident, one of your team members was able to modify files and you did not receive any notifications, causing other production jobs to fail. You must ensure that you receive notifications for all changes to files and documents in Cloud Storage while minimizing management overhead. What should you do?","o":[{"l":"A","t":"View Cloud Audit logs for all Cloud Storage files in Logs Explorer. Filter by Admin Activity logs."},{"l":"B","t":"Enable Cloud Storage object versioning on your bucket. Configure Pub/Sub notifications for your Cloud Storage buckets."},{"l":"C","t":"Enable versioning on the Cloud Storage bucket. Set up a custom script that scans versions of Cloud Storage objects being modified and alert the admin by using the script."},{"l":"D","t":"Configure Object change notifications on the Cloud Storage buckets. Send the events to Pub/Sub."}],"a":"D","t":["Cloud Storage","Cloud Storage Notifications","Pub/Sub"]},{"n":290,"s":"Your company would like to store invoices and other financial documents in Google Cloud. You need to identify a Google-managed solution to store this information for your company. You must ensure that the documents are kept for a duration of three years. Your company’s analysts need frequent access to invoices from the past six months. After six months, invoices should be archived for audit purposes only. You want to minimize costs and follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Use Cloud Storage with Object Lifecycle Management to change the object storage class to Coldline after six months."},{"l":"B","t":"Use Cloud Storage with Object Lifecycle Management to change the object storage class to Standard after six months."},{"l":"C","t":"Store your documents on Filestore, and move the documents to Cloud Storage with object storage class set to Coldline after six months."},{"l":"D","t":"Store your documents on Filestore, and move the documents to Cloud Storage with object storage class set to Standard after six months."}],"a":"A","t":["Cloud Storage","Storage Class","Object Lifecycle","Cost Optimization"]},{"n":291,"s":"You are planning to migrate your containerized workloads to Google Kubernetes Engine (GKE). You need to determine which GKE option to use. Your solution must have high availability, minimal downtime, and the ability to promptly apply security updates to your nodes. You also want to pay only for the compute resources that your workloads use without managing nodes. You want to follow Google-recommended practices and minimize operational costs. What should you do?","o":[{"l":"A","t":"Configure a Standard regional GKE duster."},{"l":"B","t":"Configure a Standard zonal GKE duster."},{"l":"C","t":"Configure a Standard multi-zonal GKE cluster."},{"l":"D","t":"Configure an Autopilot GKE cluster."}],"a":"D","t":["GKE","GKE Autopilot","High Availability"]},{"n":292,"s":"Your company stores data from multiple sources that have different data storage requirements. These data include:\n1. Customer data that is structured and read with complex queries\n2. Historical log data that is large in volume and accessed infrequently\n3. Real-time sensor data with high-velocity writes, which needs to be available for analysis but can tolerate some data loss\nYou need to design the most cost-effective storage solution that fulfills all data storage requirements. What should you do?","o":[{"l":"A","t":"Use Firestore for customer data, Cloud Storage (Nearline) for historical logs, and Bigtable for sensor data."},{"l":"B","t":"Use Cloud SQL for customer data. Cloud Storage (Coldline) for historical logs, and BigQuery for sensor data."},{"l":"C","t":"Use Cloud SQL for customer data. Cloud Storage (Archive) for historical logs, and Bigtable for sensor data."},{"l":"D","t":"Use Spanner for all data."}],"a":"C","t":["Database Selection","Cloud SQL","Bigtable","Cloud Storage","Storage Class","Cost Optimization"]},{"n":293,"s":"You work for a financial services company that operates as a stock market broker. Your company is planning to migrate to Google Cloud. You need to plan the network design in Google Cloud. Your design must:\n• Minimize the latency between all production systems.\n• Minimize costs related to your development environment.\nWhat should you do?","o":[{"l":"A","t":"Create a VPC in the Standard Tier and one in the Premium Tier. Deploy production workloads in the Standard Tier and development workloads in the Premium Tier."},{"l":"B","t":"Create a VPC in the Standard Tier and one in the Premium Tier. Deploy development workloads in the Standard Tier and production workloads in the Premium Tier."},{"l":"C","t":"Create a VPC in the Premium Tier, and deploy both production and development workloads on this VPC."},{"l":"D","t":"Create a VPC in the Standard Tier, and deploy both production and development workloads on this VPC."}],"a":"B","t":["VPC","Network Service Tiers","Cost Optimization"]},{"n":294,"s":"You are managing a fleet of Compute Engine Linux instances in a Google Cloud project. Your company's engineering team requires SSH access to all instances to perform routine maintenance tasks. You need to manage the SSH access for the engineering team, and you want to minimize operational overhead when engineers join or leave the team. What should you do?","o":[{"l":"A","t":"Create a single SSH key pair to be shared by all engineering team members. Add the public SSH key to project metadata."},{"l":"B","t":"Create an SSH key pair for each engineer on the team, and add the public SSH key to the metadata of the relevant instances."},{"l":"C","t":"Create a Google Group for all engineering team members, and grant them the Compute Viewer IAM role. Manage group membership when engineers join or leave the team."},{"l":"D","t":"Create a Google Group for all engineering team members, and set up OS Login for this group on the project. Manage group membership when engineers join or leave the team."}],"a":"D","t":["Compute Engine","SSH Access","OS Login","Google Groups"]},{"n":295,"s":"Your company was recently impacted by a service disruption that caused multiple Dataflow jobs to get stuck, resulting in significant downtime in downstream applications and revenue loss. You were able to resolve the issue by identifying and fixing an error you found in the code. You need to design a solution with minimal management effort to identify when jobs are stuck in the future to ensure that this issue does not occur again. What should you do?","o":[{"l":"A","t":"Update the Dataflow job configurations to send messages to a Pub/Sub topic when there are delays. Configure a backup Dataflow job to process jobs that are delayed. Use Cloud Tasks to trigger an alert when messages are pushed to the Pub/Sub topic."},{"l":"B","t":"Set up Cloud Monitoring alerts on the data freshness metric for the Dataflow jobs to receive a notification when a certain threshold is reached."},{"l":"C","t":"Set up Error Reporting to identify stack traces that indicate slowdowns in Dataflow jobs. Set up alerts based on these log entries."},{"l":"D","t":"Use the Personalized Service Health dashboard to identify issues with Dataflow jobs across regions."}],"a":"B","t":["Dataflow","Cloud Monitoring","Alerting"]},{"n":296,"s":"Your company is modernizing its applications and refactoring them to containerized microservices. You need to deploy the infrastructure on Google Cloud so that teams can deploy their applications. The applications cannot be exposed publicly. You want to minimize management and operational overhead. What should you do?","o":[{"l":"A","t":"Provision a Google Kubernetes Engine (GKE) Autopilot cluster."},{"l":"B","t":"Provision a fleet of Compute Engine instances and install Kubernetes."},{"l":"C","t":"Provision a Standard regional Google Kubernetes Engine (GKE) cluster."},{"l":"D","t":"Provision a Standard zonal Google Kubernetes Engine (GKE) cluster."}],"a":"A","t":["GKE","GKE Autopilot","Compute Selection"]},{"n":297,"s":"You have an application running inside a Compute Engine instance. You want to provide the application with secure access to a BigQuery dataset. You must ensure that credentials are only valid for a short period of time, and your application will only have access to the intended BigQuery dataset. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Attach a new service account to the instance every hour, and grant the service account the BigQuery Data Viewer IAM role on the project."},{"l":"B","t":"Attach a custom service account to the instance, and grant the service account the BigQuery Data Viewer IAM role on the dataset."},{"l":"C","t":"Attach a new service account to the instance every hour, and grant the service account the BigQuery Data Viewer IAM role on the dataset."},{"l":"D","t":"Attach a custom service account to the instance, and grant the service account the BigQuery Data Viewer IAM role on the project."}],"a":"B","t":["Compute Engine","Service Account","BigQuery","Least Privilege"]},{"n":298,"s":"You have an application that is currently processing transactions by using a group of managed VM instances. You need to migrate the application so that it is serverless and scalable. You want to implement an asynchronous transaction processing system, while minimizing management overhead. What should you do?","o":[{"l":"A","t":"Install Kafka on VM instances to acknowledge incoming transactions. Use Cloud Run to process transactions."},{"l":"B","t":"Use Pub/Sub to acknowledge incoming transactions. Use VM instances to process transactions."},{"l":"C","t":"Use Pub/Sub to acknowledge incoming transactions. Use Cloud Run to process transactions."},{"l":"D","t":"Install Kafka on VM instances to acknowledge incoming transactions. Use VM instances to process transactions."}],"a":"C","t":["Pub/Sub","Cloud Run","Event-Driven","Migration"]},{"n":299,"s":"Your company has many legacy third-party applications that rely on a shared NFS server for file sharing between these workloads. You want to modernize the NFS server by using a Google Cloud managed service. You need to select the solution that requires the least amount of change to the application. What should you do?","o":[{"l":"A","t":"Create a Compute Engine instance and configure an NFS server on the instance. Point all NFS mounts to the Compute Engine instance."},{"l":"B","t":"Deploy a Filestore instance. Replace all NFS mounts with a Filestore mount."},{"l":"C","t":"Configure Firestore. Configure all applications to use Firestore instead of the NFS server."},{"l":"D","t":"Create a Cloud Storage bucket. Configure all applications to use Cloud Storage client libraries instead of the NFS server."}],"a":"B","t":["Filestore","Migration"]},{"n":300,"s":"Your company is seeking a scalable solution to retain and explore application logs hosted on Compute Engine. You must be able to analyze your logs with SQL queries, and you want to be able to create charts to identify patterns and trends in your logs over time. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Use a custom script to push your application logs to BigQuery for exploration."},{"l":"B","t":"Ingest your application logs to Cloud Logging by using Ops Agent, and explore your logs in Logs Explorer."},{"l":"C","t":"Ingest your application logs to Cloud Logging by using Ops Agent, and explore your logs with Log Analytics."},{"l":"D","t":"Use a custom script to push your application logs to Cloud SQL for exploration."}],"a":"C","t":["Compute Engine","Ops Agent","Cloud Logging","Log Analytics"]},{"n":301,"s":"You are deploying an application to Google Kubernetes Engine (GKE). The application needs to make API calls to a private Cloud Storage bucket. You need to configure your application Pods to authenticate to the Cloud Storage API, but your organization policy prevents the usage of service account keys. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create the GKE cluster with Workload Identity Federation. Configure the default node service account to access the bucket. Deploy the application into the cluster so the application can use the node service account permissions. Use Identity and Access Management (IAM) to grant the service account access to the bucket."},{"l":"B","t":"Create the GKE cluster with Workload Identity Federation. Create a Google service account and a Kubernetes ServiceAccount, and configure both service accounts to use Workload Identity Federation. Attach the Kubernetes ServiceAccount to the application Pods and configure the Google service account to access the bucket with Identity and Access Management (IAM)."},{"l":"C","t":"Create the GKE cluster and deploy the application. Request a security exception to create a Google service account key. Set the constraints/iam.serviceAccountKeyExpiryHours organization policy to 24 hours."},{"l":"D","t":"Create the GKE cluster and deploy the application. Request a security exception to create a Google service account key. Set the constraints/iam.serviceAccountKeyExpiryHours organization policy to 8 hours."}],"a":"B","t":["GKE","Workload Identity","Service Account","Cloud Storage"]},{"n":302,"s":"Your company’s developers use an automation that you recently built to provision Linux VMs in Compute Engine within a Google Cloud project to perform various tasks. You need to manage the Linux account lifecycle and access for these users. You want to follow Google-recommended practices to simplify access management while minimizing operational costs. What should you do?","o":[{"l":"A","t":"Enable OS Login for all VMs. Use IAM roles to grant user permissions."},{"l":"B","t":"Require your developers to create public SSH keys. Write custom startup scripts to update user permissions."},{"l":"C","t":"Require your developers to create public SSH keys. Make the owner of the public key the root user."},{"l":"D","t":"Enable OS Login for all VMs. Write custom startup scripts to update user permissions."}],"a":"A","t":["Compute Engine","SSH Access","OS Login","IAM"]},{"n":303,"s":"You are managing the security configuration of your company’s Google Cloud organization. The Operations team needs specific permissions on both a Google Kubernetes Engine (GKE) cluster and a Cloud SQL instance. Two predefined Identity and Access Management (IAM) roles exist that contain a subset of the permissions needed by the team. You need to configure the necessary IAM permissions for this team while following Google-recommended practices. What should you do?","o":[{"l":"A","t":"Create a custom IAM role that combines the permissions from the two relevant predefined roles."},{"l":"B","t":"Grant the team the two predefined IAM roles."},{"l":"C","t":"Create a custom IAM role that includes only the required permissions from the predefined roles."},{"l":"D","t":"Grant the team the IAM roles of Kubernetes Engine Admin and Cloud SQL Admin."}],"a":"C","t":["IAM","IAM Custom Role","Least Privilege"]},{"n":304,"s":"Your organization has decided to deploy all its compute workloads to Kubernetes on Google Cloud and two other cloud providers. You want to build an Infrastructure-as-code solution to automate the provisioning process for all cloud resources. What should you do?","o":[{"l":"A","t":"Build the solution by using Config Connector, and provision the resources."},{"l":"B","t":"Build the solution by using Terraform, and provision the resources."},{"l":"C","t":"Build solution by using Python and the cloud SDKs from all providers to provision the resources."},{"l":"D","t":"Build the solution by using YAML manifests, and provision the resources."}],"a":"B","t":["IAC","Terraform","Multi-Cloud"]},{"n":305,"s":"You are planning to deploy an application to Google Cloud. Your application processes asynchronous events from Google services and must be accessible from the public Internet. You need to identify how to deploy your application. You want to follow a standardized process while minimizing development costs. You also want to have no costs when your workloads are not in use. What should you do?","o":[{"l":"A","t":"Deploy your code to GKE. Use Pub/Sub for event delivery."},{"l":"B","t":"Deploy your code to Compute Engine. Use Pub/Sub for event delivery."},{"l":"C","t":"Deploy your code to GKE. Use Eventarc for event delivery."},{"l":"D","t":"Deploy your code to Cloud Run. Use Eventarc for event delivery."}],"a":"D","t":["Cloud Run","Eventarc","Event-Driven","Compute Selection","Cost Optimization"]},{"n":306,"s":"Your company is migrating its workloads to Google Cloud due to an expiring data center contract. The on-premises environment and Google Cloud are not connected. You have decided to follow a lift-and-shift approach, and you plan to modernize the workloads in a future project. Several old applications connect to each other through hard-coded internal IP addresses. You want to migrate these workloads quickly without modifying the application code. You also want to maintain all functionality. What should you do?","o":[{"l":"A","t":"Migrate your DNS server first. Configure Cloud DNS with a forwarding zone to your migrated DNS server. Then migrate all other workloads with ephemeral internal IP addresses."},{"l":"B","t":"Create a VPC with non-overlapping CIDR ranges compared to your on-premises network. When migrating individual workloads, assign each workload a new static internal IP address."},{"l":"C","t":"Create a VPC with the same CIDR ranges as your on-premises network. When migrating individual workloads, assign each workload the same static internal IP address."},{"l":"D","t":"Migrate all workloads to a single VPC subnet. Configure Cloud NAT for the subnet and manually assign a static IP address to the Cloud NAT gateway."}],"a":"C","t":["VPC","Subnets","Static IP","Migration"]},{"n":307,"s":"You are migrating your company’s on-premises compute resources to Google Cloud. You need to deploy batch processing jobs that run every night. The jobs require significant CPU and memory for several hours but can tolerate interruptions. You must ensure that the deployment is cost-effective. What should you do?","o":[{"l":"A","t":"Use the M1 machine series on Compute Engine."},{"l":"B","t":"Containerize the batch processing jobs and deploy them on Compute Engine."},{"l":"C","t":"Use Spot VMs on Compute Engine."},{"l":"D","t":"Use custom machine types on Compute Engine."}],"a":"C","t":["Compute Engine","Spot VM","Migration","Cost Optimization"]},{"n":308,"s":"Your company has a rapidly growing social media platform and a user base primarily located in North America. Due to increasing demand, your current on-premises PostgreSQL database, hosted in your United States headquarters data center, no longer meets your needs. You need to identify a cloud-based database solution that offers automatic scaling, multi-region support for future expansion, and maintains low latency. What should you do?","o":[{"l":"A","t":"Use BigQuery."},{"l":"B","t":"Use Spanner."},{"l":"C","t":"Use Cloud SQL for PostgreSQL."},{"l":"D","t":"Use Bigtable."}],"a":"B","t":["Spanner","Database Selection"]},{"n":309,"s":"You are migrating your on-premises workload to Google Cloud. Your company is implementing its Cloud Billing configuration and requires access to a granular breakdown of its Google Cloud costs. You need to ensure that the Cloud Billing datasets are available in BigQuery so you can conduct a detailed analysis of costs. What should you do?","o":[{"l":"A","t":"Enable Cloud Billing data export to BigQuery when you create a Cloud Billing account."},{"l":"B","t":"Enable Cloud Billing on the project, and link a Cloud Billing account. Then view the billing data table in the BigQuery dataset."},{"l":"C","t":"Create a Cloud Billing account. Enable the BigQuery Data Transfer Service API to export pricing data."},{"l":"D","t":"Enable the BigQuery API, and ensure that the BigQuery User IAM role is selected. Change the BigQuery dataset to select a data location."}],"a":"A","t":["Cloud Billing","Billing Export","BigQuery"]},{"n":310,"s":"Your company’s accounting department needs to run an overnight batch workload every day. You must implement a solution that minimizes the cost to run this workload and automatically retries the batch if an execution fails. What should you do?","o":[{"l":"A","t":"Develop an application that runs the batch workload, and deploy the application as a Google Kubernetes Engine (GKE) CronJob."},{"l":"B","t":"Develop a web application that listens for incoming requests, and deploy the application as a Cloud Run service. Use Cloud Scheduler to call the HTTP endpoint."},{"l":"C","t":"Develop an application that runs the batch workload, and deploy the application as a Cloud Run job. Use Cloud Scheduler to trigger the job."},{"l":"D","t":"Develop a web application that listens for incoming requests, and deploy the application as a Google Kubernetes Engine (GKE) Deployment. Use Cloud Scheduler to call the HTTP endpoint."}],"a":"C","t":["Cloud Run","Cloud Run Jobs","Cloud Scheduler","Compute Selection","Cost Optimization"]},{"n":311,"s":"You need to migrate multiple PostgreSQL databases from your on-premises data center to Google Cloud. You want to significantly improve the performance of your databases while minimizing changes to your data schema and application code. You expect to exceed 150 TB of data per geographical region. You want to follow Google-recommended practices and minimize your operational costs. What should you do?","o":[{"l":"A","t":"Migrate your data to AlloyDB."},{"l":"B","t":"Migrate your data to Spanner."},{"l":"C","t":"Migrate your data to Firebase."},{"l":"D","t":"Migrate your data to Bigtable."}],"a":"A","t":["AlloyDB","Database Selection","Migration"]},{"n":312,"s":"Your company's machine learning team requires a scalable and flexible platform to fine-tune large language models utilizing a large volume of proprietary data on Google Cloud. You are tasked with building a solution for this team. What should you do?","o":[{"l":"A","t":"Use Dataflow as a platform to run the fine-tuning jobs"},{"l":"B","t":"Use a Compute Engine managed instance group as a platform to deploy Jupyter Notebooks and run fine-tuning jobs."},{"l":"C","t":"Use Cloud Run and GPU as a platform to run the fine-tuning jobs."},{"l":"D","t":"Use Google Kubernetes Engine (GKE) and hardware accelerators as a platform to run the fine-tuning jobs."}],"a":"D","t":["GKE","Hardware Accelerators","AI/ML Workloads"
