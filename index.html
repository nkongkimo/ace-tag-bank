<style>
/* Layout concept: an optical answer sheet. Sticky tag index on the left, question sheets on the right, answers filled in as bubbles. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunken:#E2E7EE; --ink:#18212E; --muted:#566374; --line:#CDD5E0;
  --accent:#0A6E78; --accent-soft:#D5ECEE; --on-accent:#FFFFFF;
  --good:#1B7A43; --good-soft:#DDF1E4; --bad:#BC2F3F; --bad-soft:#F9E1E3; --star:#A86A00;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#19202A; --sunken:#232C38; --ink:#E7ECF3; --muted:#9CA9BA; --line:#323D4C;
  --accent:#5CC6CF; --accent-soft:#17393F; --on-accent:#08242A;
  --good:#63CF90; --good-soft:#173A27; --bad:#F2838F; --bad-soft:#47202A; --star:#EDB95A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#19202A; --sunken:#232C38; --ink:#E7ECF3; --muted:#9CA9BA; --line:#323D4C;
  --accent:#5CC6CF; --accent-soft:#17393F; --on-accent:#08242A;
  --good:#63CF90; --good-soft:#173A27; --bad:#F2838F; --bad-soft:#47202A; --star:#EDB95A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - 40px);overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-right:6px;scrollbar-width:thin}
h1{font:600 21px/1.2 var(--mono);letter-spacing:-.01em;margin:0}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.progress{display:grid;gap:6px}
.progress-row{display:flex;justify-content:space-between;gap:8px;font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;background:var(--sunken);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .r{background:var(--good)} .bar .w{background:var(--bad)}
.sync{font-size:12px;color:var(--muted);margin:0}
.field{display:grid;gap:5px}
.label{font:600 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
input[type=search],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:4px 9px;border:1px solid var(--line);border-radius:4px;font-size:13px;background:var(--surface)}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.group{border-top:1px solid var(--line);padding-top:8px}
.group summary{cursor:pointer;font-weight:700;font-size:13.5px;padding-block:2px}
.taglist{display:flex;flex-wrap:wrap;gap:5px;padding-top:8px}
.tag{display:inline-flex;align-items:baseline;gap:5px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font:500 12px/1.5 var(--mono)}
.tag small{color:var(--muted);font:inherit;font-size:11px;font-variant-numeric:tabular-nums}
.tag[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag[aria-pressed=true] small{color:inherit}
.tag:disabled{opacity:.38}
main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.tabs{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:5px}
.tabs button{padding:5px 13px;border-radius:3px;font-size:14px}
.tabs button[aria-selected=true]{background:var(--surface);font-weight:700}
.count{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.filters-btn{display:none;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:14px}
.selected{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.selected .tag{background:var(--accent-soft);border-color:transparent}
.clear{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.sheet-head{display:flex;align-items:center;gap:10px}
.num{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.pill{font:500 11.5px var(--mono);padding:1px 6px;border-radius:3px;background:var(--accent-soft)}
.star{margin-left:auto;font-size:13px;color:var(--muted);padding:2px 8px;border:1px solid var(--line);border-radius:4px}
.star[aria-pressed=true]{color:var(--star);border-color:var(--star);font-weight:700}
.stem{margin:0;white-space:pre-line;overflow-wrap:anywhere;max-width:72ch}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:7px 8px;border-radius:4px}
.opt:not(:disabled):hover{background:var(--sunken)}
.bubble{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 12.5px var(--mono);color:var(--muted)}
.otext{white-space:pre-line;overflow-wrap:anywhere;padding-top:1px}
.flag{display:inline-block;margin-left:8px;font-size:12px;font-weight:700}
.opt.picked .bubble{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{background:var(--good-soft)} .opt.right .bubble{background:var(--good);border-color:var(--good);color:var(--surface)} .opt.right .flag{color:var(--good)}
.opt.wrong{background:var(--bad-soft)} .opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--surface)} .opt.wrong .flag{color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px}
.verdict{font-weight:700} .verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.redo{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.note{margin:0;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;border-top:1px dashed var(--line);padding-top:10px}
.tags .tag{background:transparent}
.tags .tag.on{background:var(--accent-soft);border-color:transparent}
.empty{padding:36px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pager .btn{padding:6px 16px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.pager .btn:disabled{opacity:.4}
.hint{font-size:12.5px;color:var(--muted);margin-left:auto}
.map{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.map-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.map-tools select{width:auto}
.map h2{font-size:14px;font-weight:700;margin:0 0 4px}
.row{display:grid;grid-template-columns:minmax(0,210px) minmax(60px,1fr) 118px;gap:12px;align-items:center;width:100%;text-align:left;padding:5px 6px;border-radius:3px}
.row:hover{background:var(--sunken)}
.row b{font:500 13px var(--mono);overflow-wrap:anywhere}
.row span{font:400 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.danger{color:var(--bad);text-decoration:underline;text-underline-offset:2px;font-size:13px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px}
  .panel{position:static;max-height:none;overflow:visible;padding-right:0}
  .panel .collapsible{display:none}
  .panel.open .collapsible{display:grid;gap:16px}
  .filters-btn{display:inline-block}
  .row{grid-template-columns:minmax(0,1fr) 96px}
  .row .bar{grid-column:1/-1;grid-row:2}
  .hint{display:none}
}
@media (min-width:861px){.panel .collapsible{display:grid;gap:16px}}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s}}
</style>

<script type="application/json" id="data">{"q":[{"n":151,"s":"You are working with a user to set up an application in a new VPC behind a firewall. The user is concerned about data egress. You want to configure the fewest open egress ports. What should you do?","o":[{"l":"A","t":"Set up a low-priority (65534) rule that blocks all egress and a high-priority rule (1000) that allows only the appropriate ports."},{"l":"B","t":"Set up a high-priority (1000) rule that pairs both ingress and egress ports."},{"l":"C","t":"Set up a high-priority (1000) rule that blocks all egress and a low-priority (65534) rule that allows only the appropriate ports."},{"l":"D","t":"Set up a high-priority (1000) rule to allow the appropriate ports."}],"a":"A","t":["VPC","Firewall Rules"]},{"n":152,"s":"Your company runs its Linux workloads on Compute Engine instances. Your company will be working with a new operations partner that does not use Google Accounts. You need to grant access to the instances to your operations partner so they can maintain the installed tooling. What should you do?","o":[{"l":"A","t":"Enable Cloud IAP for the Compute Engine instances, and add the operations partner as a Cloud IAP Tunnel User."},{"l":"B","t":"Tag all the instances with the same network tag. Create a firewall rule in the VPC to grant TCP access on port 22 for traffic from the operations partner to instances with the network tag."},{"l":"C","t":"Set up Cloud VPN between your Google Cloud VPC and the internal network of the operations partner."},{"l":"D","t":"Ask the operations partner to generate SSH key pairs, and add the public keys to the VM instances."}],"a":"D","t":["Compute Engine","SSH Access"]},{"n":153,"s":"You have created a code snippet that should be triggered whenever a new file is uploaded to a Cloud Storage bucket. You want to deploy this code snippet. What should you do?","o":[{"l":"A","t":"Use App Engine and configure Cloud Scheduler to trigger the application using Pub/Sub."},{"l":"B","t":"Use Cloud Functions and configure the bucket as a trigger resource."},{"l":"C","t":"Use Google Kubernetes Engine and configure a CronJob to trigger the application using Pub/Sub."},{"l":"D","t":"Use Dataflow as a batch job, and configure the bucket as a data source."}],"a":"B","t":["Cloud Functions","Cloud Storage","Event-Driven"]},{"n":154,"s":"You have been asked to set up Object Lifecycle Management for objects stored in storage buckets. The objects are written once and accessed frequently for 30 days. After 30 days, the objects are not read again unless there is a special need. The objects should be kept for three years, and you need to minimize cost. What should you do?","o":[{"l":"A","t":"Set up a policy that uses Nearline storage for 30 days and then moves to Archive storage for three years."},{"l":"B","t":"Set up a policy that uses Standard storage for 30 days and then moves to Archive storage for three years."},{"l":"C","t":"Set up a policy that uses Nearline storage for 30 days, then moves the Coldline for one year, and then moves to Archive storage for two years."},{"l":"D","t":"Set up a policy that uses Standard storage for 30 days, then moves to Coldline for one year, and then moves to Archive storage for two years."}],"a":"B","t":["Cloud Storage","Storage Class","Object Lifecycle","Cost Optimization"]},{"n":155,"s":"You are storing sensitive information in a Cloud Storage bucket. For legal reasons, you need to be able to record all requests that read any of the stored data. You want to make sure you comply with these requirements. What should you do?","o":[{"l":"A","t":"Enable the Identity Aware Proxy API on the project."},{"l":"B","t":"Scan the bucket using the Data Loss Prevention API."},{"l":"C","t":"Allow only a single Service Account access to read the data."},{"l":"D","t":"Enable Data Access audit logs for the Cloud Storage API."}],"a":"D","t":["Cloud Storage","Cloud Audit Logs"]},{"n":156,"s":"You are the team lead of a group of 10 developers. You provided each developer with an individual Google Cloud Project that they can use as their personal sandbox to experiment with different Google Cloud solutions. You want to be notified if any of the developers are spending above $500 per month on their sandbox environment. What should you do?","o":[{"l":"A","t":"Create a single budget for all projects and configure budget alerts on this budget."},{"l":"B","t":"Create a separate billing account per sandbox project and enable BigQuery billing exports. Create a Data Studio dashboard to plot the spending per billing account."},{"l":"C","t":"Create a budget per project and configure budget alerts on all of these budgets."},{"l":"D","t":"Create a single billing account for all sandbox projects and enable BigQuery billing exports. Create a Data Studio dashboard to plot the spending per project."}],"a":"C","t":["Cloud Billing","Budget Alerts"]},{"n":157,"s":"You are deploying a production application on Compute Engine. You want to prevent anyone from accidentally destroying the instance by clicking the wrong button. What should you do?","o":[{"l":"A","t":"Disable the flag ג€Delete boot disk when instance is deleted.ג€"},{"l":"B","t":"Enable delete protection on the instance."},{"l":"C","t":"Disable Automatic restart on the instance."},{"l":"D","t":"Enable Preemptibility on the instance."}],"a":"B","t":["Compute Engine","Deletion Protection"]},{"n":158,"s":"Your company uses a large number of Google Cloud services centralized in a single project. All teams have specific projects for testing and development. The DevOps team needs access to all of the production services in order to perform their job. You want to prevent Google Cloud product changes from broadening their permissions in the future. You want to follow Google-recommended practices. What should you do?","o":[{"l":"A","t":"Grant all members of the DevOps team the role of Project Editor on the organization level."},{"l":"B","t":"Grant all members of the DevOps team the role of Project Editor on the production project."},{"l":"C","t":"Create a custom role that combines the required permissions. Grant the DevOps team the custom role on the production project."},{"l":"D","t":"Create a custom role that combines the required permissions. Grant the DevOps team the custom role on the organization level."}],"a":"C","t":["IAM","IAM Custom Role","Least Privilege"]},{"n":159,"s":"You are building an application that processes data files uploaded from thousands of suppliers. Your primary goals for the application are data security and the expiration of aged data. You need to design the application to:\n* Restrict access so that suppliers can access only their own data.\n* Give suppliers write access to data only for 30 minutes.\n* Delete data that is over 45 days old.\nYou have a very short development cycle, and you need to make sure that the application requires minimal maintenance. Which two strategies should you use? (Choose two.)","o":[{"l":"A","t":"Build a lifecycle policy to delete Cloud Storage objects after 45 days."},{"l":"B","t":"Use signed URLs to allow suppliers limited time access to store their objects."},{"l":"C","t":"Set up an SFTP server for your application, and create a separate user for each supplier."},{"l":"D","t":"Build a Cloud function that triggers a timer of 45 days to delete objects that have expired."},{"l":"E","t":"Develop a script that loops through all Cloud Storage buckets and deletes any buckets that are older than 45 days."}],"a":"AB","t":["Cloud Storage","Object Lifecycle","Signed URL"]},{"n":160,"s":"Your company wants to standardize the creation and management of multiple Google Cloud resources using Infrastructure as Code. You want to minimize the amount of repetitive code needed to manage the environment. What should you do?","o":[{"l":"A","t":"Develop templates for the environment using Cloud Deployment Manager."},{"l":"B","t":"Use curl in a terminal to send a REST request to the relevant Google API for each individual resource."},{"l":"C","t":"Use the Cloud Console interface to provision and manage all related resources."},{"l":"D","t":"Create a bash script that contains all requirement steps as gcloud commands."}],"a":"A","t":["IAC","Deployment Manager"]},{"n":161,"s":"You are performing a monthly security check of your Google Cloud environment and want to know who has access to view data stored in your Google Cloud Project. What should you do?","o":[{"l":"A","t":"Enable Audit Logs for all APIs that are related to data storage."},{"l":"B","t":"Review the IAM permissions for any role that allows for data access."},{"l":"C","t":"Review the Identity-Aware Proxy settings for each resource."},{"l":"D","t":"Create a Data Loss Prevention job."}],"a":"B","t":["IAM"]},{"n":162,"s":"Your company has embraced a hybrid cloud strategy where some of the applications are deployed on Google Cloud. A Virtual Private Network (VPN) tunnel connects your Virtual Private Cloud (VPC) in Google Cloud with your company's on-premises network. Multiple applications in Google Cloud need to connect to an on-premises database server, and you want to avoid having to change the IP configuration in all of your applications when the IP of the database changes. What should you do?","o":[{"l":"A","t":"Configure Cloud NAT for all subnets of your VPC to be used when egressing from the VM instances."},{"l":"B","t":"Create a private zone on Cloud DNS, and configure the applications with the DNS name."},{"l":"C","t":"Configure the IP of the database as custom metadata for each instance, and query the metadata server."},{"l":"D","t":"Query the Compute Engine internal DNS from the applications to retrieve the IP of the database."}],"a":"B","t":["Cloud DNS","Cloud VPN","Hybrid Connectivity"]},{"n":163,"s":"You have developed a containerized web application that will serve internal colleagues during business hours. You want to ensure that no costs are incurred outside of the hours the application is used. You have just created a new Google Cloud project and want to deploy the application. What should you do?","o":[{"l":"A","t":"Deploy the container on Cloud Run for Anthos, and set the minimum number of instances to zero."},{"l":"B","t":"Deploy the container on Cloud Run (fully managed), and set the minimum number of instances to zero."},{"l":"C","t":"Deploy the container on App Engine flexible environment with autoscaling, and set the value min_instances to zero in the app.yaml."},{"l":"D","t":"Deploy the container on App Engine flexible environment with manual scaling, and set the value instances to zero in the app.yaml."}],"a":"B","t":["Cloud Run","Compute Selection","Cost Optimization"]},{"n":164,"s":"You have experimented with Google Cloud using your own credit card and expensed the costs to your company. Your company wants to streamline the billing process and charge the costs of your projects to their monthly invoice. What should you do?","o":[{"l":"A","t":"Grant the financial team the IAM role of ג€Billing Account Userג€ on the billing account linked to your credit card."},{"l":"B","t":"Set up BigQuery billing export and grant your financial department IAM access to query the data."},{"l":"C","t":"Create a ticket with Google Billing Support to ask them to send the invoice to your company."},{"l":"D","t":"Change the billing account of your projects to the billing account of your company."}],"a":"D","t":["Cloud Billing"]},{"n":165,"s":"You are running a data warehouse on BigQuery. A partner company is offering a recommendation engine based on the data in your data warehouse. The partner company is also running their application on Google Cloud. They manage the resources in their own project, but they need access to the BigQuery dataset in your project. You want to provide the partner company with access to the dataset. What should you do?","o":[{"l":"A","t":"Create a Service Account in your own project, and grant this Service Account access to BigQuery in your project."},{"l":"B","t":"Create a Service Account in your own project, and ask the partner to grant this Service Account access to BigQuery in their project."},{"l":"C","t":"Ask the partner to create a Service Account in their project, and have them give the Service Account access to BigQuery in their project."},{"l":"D","t":"Ask the partner to create a Service Account in their project, and grant their Service Account access to the BigQuery dataset in your project."}],"a":"D","t":["BigQuery","IAM","Service Account","Cross-Project Access"]},{"n":166,"s":"Your web application has been running successfully on Cloud Run for Anthos. You want to evaluate an updated version of the application with a specific percentage of your production users (canary deployment). What should you do?","o":[{"l":"A","t":"Create a new service with the new version of the application. Split traffic between this version and the version that is currently running."},{"l":"B","t":"Create a new revision with the new version of the application. Split traffic between this version and the version that is currently running."},{"l":"C","t":"Create a new service with the new version of the application. Add an HTTP Load Balancer in front of both services."},{"l":"D","t":"Create a new revision with the new version of the application. Add an HTTP Load Balancer in front of both revisions."}],"a":"B","t":["Cloud Run","Traffic Splitting","Canary Deployment"]},{"n":167,"s":"Your company developed a mobile game that is deployed on Google Cloud. Gamers are connecting to the game with their personal phones over the Internet. The game sends UDP packets to update the servers about the gamers' actions while they are playing in multiplayer mode. Your game backend can scale over multiple virtual machines (VMs), and you want to expose the VMs over a single IP address. What should you do?","o":[{"l":"A","t":"Configure an SSL Proxy load balancer in front of the application servers."},{"l":"B","t":"Configure an Internal UDP load balancer in front of the application servers."},{"l":"C","t":"Configure an External HTTP(s) load balancer in front of the application servers."},{"l":"D","t":"Configure an External Network load balancer in front of the application servers."}],"a":"D","t":["Load Balancing"]},{"n":168,"s":"You are working for a hospital that stores its medical images in an on-premises data room. The hospital wants to use Cloud Storage for archival storage of these images. The hospital wants an automated process to upload any new medical images to Cloud Storage. You need to design and implement a solution. What should you do?","o":[{"l":"A","t":"Create a Pub/Sub topic, and enable a Cloud Storage trigger for the Pub/Sub topic. Create an application that sends all medical images to the Pub/Sub topic."},{"l":"B","t":"Deploy a Dataflow job from the batch template, ג€Datastore to Cloud Storage.ג€ Schedule the batch job on the desired interval."},{"l":"C","t":"Create a script that uses the gsutil command line interface to synchronize the on-premises storage with Cloud Storage. Schedule the script as a cron job."},{"l":"D","t":"In the Cloud Console, go to Cloud Storage. Upload the relevant images to the appropriate bucket."}],"a":"C","t":["Cloud Storage","Data Transfer","gcloud storage"]},{"n":169,"s":"Your auditor wants to view your organization's use of data in Google Cloud. The auditor is most interested in auditing who accessed data in Cloud Storage buckets. You need to help the auditor access the data they need. What should you do?","o":[{"l":"A","t":"Turn on Data Access Logs for the buckets they want to audit, and then build a query in the log viewer that filters on Cloud Storage."},{"l":"B","t":"Assign the appropriate permissions, and then create a Data Studio report on Admin Activity Audit Logs."},{"l":"C","t":"Assign the appropriate permissions, and then use Cloud Monitoring to review metrics."},{"l":"D","t":"Use the export logs API to provide the Admin Activity Audit Logs in the format they want."}],"a":"A","t":["Cloud Storage","Cloud Audit Logs"]},{"n":170,"s":"You received a JSON file that contained a private key of a Service Account in order to get access to several resources in a Google Cloud project. You downloaded and installed the Cloud SDK and want to use this private key for authentication and authorization when performing gcloud commands. What should you do?","o":[{"l":"A","t":"Use the command gcloud auth login and point it to the private key."},{"l":"B","t":"Use the command gcloud auth activate-service-account and point it to the private key."},{"l":"C","t":"Place the private key file in the installation directory of the Cloud SDK and rename it to ג€credentials.jsonג€."},{"l":"D","t":"Place the private key file in your home directory and rename it to ג€GOOGLE_APPLICATION_CREDENTIALSג€."}],"a":"B","t":["gcloud CLI","Service Account","Service Account Key"]},{"n":171,"s":"You are working with a Cloud SQL MySQL database at your company. You need to retain a month-end copy of the database for three years for audit purposes. What should you do?","o":[{"l":"A","t":"Set up an export job for the first of the month. Write the export file to an Archive class Cloud Storage bucket."},{"l":"B","t":"Save the automatic first-of-the-month backup for three years. Store the backup file in an Archive class Cloud Storage bucket."},{"l":"C","t":"Set up an on-demand backup for the first of the month. Write the backup to an Archive class Cloud Storage bucket."},{"l":"D","t":"Convert the automatic first-of-the-month backup to an export file. Write the export file to a Coldline class Cloud Storage bucket."}],"a":"A","t":["Cloud SQL","Backup & Recovery","Cloud Storage","Storage Class"]},{"n":172,"s":"You are monitoring an application and receive user feedback that a specific error is spiking. You notice that the error is caused by a Service Account having insufficient permissions. You are able to solve the problem but want to be notified if the problem recurs. What should you do?","o":[{"l":"A","t":"In the Log Viewer, filter the logs on severity 'Error' and the name of the Service Account."},{"l":"B","t":"Create a sink to BigQuery to export all the logs. Create a Data Studio dashboard on the exported logs."},{"l":"C","t":"Create a custom log-based metric for the specific error to be used in an Alerting Policy."},{"l":"D","t":"Grant Project Owner access to the Service Account."}],"a":"C","t":["Cloud Logging","Log-based Metrics","Alerting"]},{"n":173,"s":"You are developing a financial trading application that will be used globally. Data is stored and queried using a relational structure, and clients from all over the world should get the exact identical state of the data. The application will be deployed in multiple regions to provide the lowest latency to end users. You need to select a storage option for the application data while minimizing latency. What should you do?","o":[{"l":"A","t":"Use Cloud Bigtable for data storage."},{"l":"B","t":"Use Cloud SQL for data storage."},{"l":"C","t":"Use Cloud Spanner for data storage."},{"l":"D","t":"Use Firestore for data storage."}],"a":"C","t":["Spanner","Database Selection"]},{"n":174,"s":"You are about to deploy a new Enterprise Resource Planning (ERP) system on Google Cloud. The application holds the full database in-memory for fast data access, and you need to configure the most appropriate resources on Google Cloud for this application. What should you do?","o":[{"l":"A","t":"Provision preemptible Compute Engine instances."},{"l":"B","t":"Provision Compute Engine instances with GPUs attached."},{"l":"C","t":"Provision Compute Engine instances with local SSDs attached."},{"l":"D","t":"Provision Compute Engine instances with M1 machine type."}],"a":"D","t":["Compute Engine","Machine Types"]},{"n":175,"s":"You have developed an application that consists of multiple microservices, with each microservice packaged in its own Docker container image. You want to deploy the entire application on Google Kubernetes Engine so that each microservice can be scaled individually. What should you do?","o":[{"l":"A","t":"Create and deploy a Custom Resource Definition per microservice."},{"l":"B","t":"Create and deploy a Docker Compose File."},{"l":"C","t":"Create and deploy a Job per microservice."},{"l":"D","t":"Create and deploy a Deployment per microservice."}],"a":"D","t":["GKE","Kubernetes Workloads"]},{"n":176,"s":"You will have several applications running on different Compute Engine instances in the same project. You want to specify at a more granular level the service account each instance uses when calling Google Cloud APIs. What should you do?","o":[{"l":"A","t":"When creating the instances, specify a Service Account for each instance."},{"l":"B","t":"When creating the instances, assign the name of each Service Account as instance metadata."},{"l":"C","t":"After starting the instances, use gcloud compute instances update to specify a Service Account for each instance."},{"l":"D","t":"After starting the instances, use gcloud compute instances update to assign the name of the relevant Service Account as instance metadata."}],"a":"A","t":["Compute Engine","Service Account"]},{"n":177,"s":"You are creating an application that will run on Google Kubernetes Engine. You have identified MongoDB as the most suitable database system for your application and want to deploy a managed MongoDB environment that provides a support SLA. What should you do?","o":[{"l":"A","t":"Create a Cloud Bigtable cluster, and use the HBase API."},{"l":"B","t":"Deploy MongoDB Atlas from the Google Cloud Marketplace."},{"l":"C","t":"Download a MongoDB installation package, and run it on Compute Engine instances."},{"l":"D","t":"Download a MongoDB installation package, and run it on a Managed Instance Group."}],"a":"B","t":["Cloud Marketplace","Database Selection"]},{"n":178,"s":"You are managing a project for the Business Intelligence (BI) department in your company. A data pipeline ingests data into BigQuery via streaming. You want the users in the BI department to be able to run the custom SQL queries against the latest data in BigQuery. What should you do?","o":[{"l":"A","t":"Create a Data Studio dashboard that uses the related BigQuery tables as a source and give the BI team view access to the Data Studio dashboard."},{"l":"B","t":"Create a Service Account for the BI team and distribute a new private key to each member of the BI team."},{"l":"C","t":"Use Cloud Scheduler to schedule a batch Dataflow job to copy the data from BigQuery to the BI team's internal data warehouse."},{"l":"D","t":"Assign the IAM role of BigQuery User to a Google Group that contains the members of the BI team."}],"a":"D","t":["BigQuery","IAM","Google Groups"]},{"n":179,"s":"Your company is moving its entire workload to Compute Engine. Some servers should be accessible through the Internet, and other servers should only be accessible over the internal network. All servers need to be able to talk to each other over specific ports and protocols. The current on-premises network relies on a demilitarized zone (DMZ) for the public servers and a Local Area Network (LAN) for the private servers. You need to design the networking infrastructure on Google Cloud to match these requirements. What should you do?","o":[{"l":"A","t":"1. Create a single VPC with a subnet for the DMZ and a subnet for the LAN. 2. Set up firewall rules to open up relevant traffic between the DMZ and the LAN subnets, and another firewall rule to allow public ingress traffic for the DMZ."},{"l":"B","t":"1. Create a single VPC with a subnet for the DMZ and a subnet for the LAN. 2. Set up firewall rules to open up relevant traffic between the DMZ and the LAN subnets, and another firewall rule to allow public egress traffic for the DMZ."},{"l":"C","t":"1. Create a VPC with a subnet for the DMZ and another VPC with a subnet for the LAN. 2. Set up firewall rules to open up relevant traffic between the DMZ and the LAN subnets, and another firewall rule to allow public ingress traffic for the DMZ."},{"l":"D","t":"1. Create a VPC with a subnet for the DMZ and another VPC with a subnet for the LAN. 2. Set up firewall rules to open up relevant traffic between the DMZ and the LAN subnets, and another firewall rule to allow public egress traffic for the DMZ."}],"a":"A","t":["VPC","Subnets","Firewall Rules"]},{"n":180,"s":"You have just created a new project which will be used to deploy a globally distributed application. You will use Cloud Spanner for data storage. You want to create a Cloud Spanner instance. You want to perform the first step in preparation of creating the instance. What should you do?","o":[{"l":"A","t":"Enable the Cloud Spanner API."},{"l":"B","t":"Configure your Cloud Spanner instance to be multi-regional."},{"l":"C","t":"Create a new VPC network with subnetworks in all desired regions."},{"l":"D","t":"Grant yourself the IAM role of Cloud Spanner Admin."}],"a":"A","t":["Spanner","API Enablement"]},{"n":181,"s":"You have created a new project in Google Cloud through the gcloud command line interface (CLI) and linked a billing account. You need to create a new Compute Engine instance using the CLI. You need to perform the prerequisite steps. What should you do?","o":[{"l":"A","t":"Create a Cloud Monitoring Workspace."},{"l":"B","t":"Create a VPC network in the project."},{"l":"C","t":"Enable the compute googleapis.com API."},{"l":"D","t":"Grant yourself the IAM role of Computer Admin."}],"a":"C","t":["Compute Engine","API Enablement","gcloud CLI"]},{"n":182,"s":"Your company has developed a new application that consists of multiple microservices. You want to deploy the application to Google Kubernetes Engine (GKE), and you want to ensure that the cluster can scale as more applications are deployed in the future. You want to avoid manual intervention when each new application is deployed. What should you do?","o":[{"l":"A","t":"Deploy the application on GKE, and add a HorizontalPodAutoscaler to the deployment."},{"l":"B","t":"Deploy the application on GKE, and add a VerticalPodAutoscaler to the deployment."},{"l":"C","t":"Create a GKE cluster with autoscaling enabled on the node pool. Set a minimum and maximum for the size of the node pool."},{"l":"D","t":"Create a separate node pool for each application, and deploy each application to its dedicated node pool."}],"a":"C","t":["GKE","GKE Autoscaling"]},{"n":183,"s":"You need to manage a third-party application that will run on a Compute Engine instance. Other Compute Engine instances are already running with default configuration. Application installation files are hosted on Cloud Storage. You need to access these files from the new instance without allowing other virtual machines (VMs) to access these files. What should you do?","o":[{"l":"A","t":"Create the instance with the default Compute Engine service account. Grant the service account permissions on Cloud Storage."},{"l":"B","t":"Create the instance with the default Compute Engine service account. Add metadata to the objects on Cloud Storage that matches the metadata on the new instance."},{"l":"C","t":"Create a new service account and assign this service account to the new instance. Grant the service account permissions on Cloud Storage."},{"l":"D","t":"Create a new service account and assign this service account to the new instance. Add metadata to the objects on Cloud Storage that matches the metadata on the new instance."}],"a":"C","t":["Compute Engine","Service Account","Cloud Storage","Least Privilege"]},{"n":184,"s":"You need to configure optimal data storage for files stored in Cloud Storage for minimal cost. The files are used in a mission-critical analytics pipeline that is used continually. The users are in Boston, MA (United States). What should you do?","o":[{"l":"A","t":"Configure regional storage for the region closest to the users. Configure a Nearline storage class."},{"l":"B","t":"Configure regional storage for the region closest to the users. Configure a Standard storage class."},{"l":"C","t":"Configure dual-regional storage for the dual region closest to the users. Configure a Nearline storage class."},{"l":"D","t":"Configure dual-regional storage for the dual region closest to the users. Configure a Standard storage class."}],"a":"B","t":["Cloud Storage","Storage Class","Cost Optimization"]},{"n":185,"s":"You are developing a new web application that will be deployed on Google Cloud Platform. As part of your release cycle, you want to test updates to your application on a small portion of real user traffic. The majority of the users should still be directed towards a stable version of your application. What should you do?","o":[{"l":"A","t":"Deploy the application on App Engine. For each update, create a new version of the same service. Configure traffic splitting to send a small percentage of traffic to the new version."},{"l":"B","t":"Deploy the application on App Engine. For each update, create a new service. Configure traffic splitting to send a small percentage of traffic to the new service."},{"l":"C","t":"Deploy the application on Kubernetes Engine. For a new release, update the deployment to use the new version."},{"l":"D","t":"Deploy the application on Kubernetes Engine. For a new release, create a new deployment for the new version. Update the service to use the new deployment."}],"a":"A","t":["App Engine","Traffic Splitting","Canary Deployment"]},{"n":186,"s":"You need to add a group of new users to Cloud Identity. Some of the users already have existing Google accounts. You want to follow one of Google's recommended practices and avoid conflicting accounts. What should you do?","o":[{"l":"A","t":"Invite the user to transfer their existing account."},{"l":"B","t":"Invite the user to use an email alias to resolve the conflict."},{"l":"C","t":"Tell the user that they must delete their existing account."},{"l":"D","t":"Tell the user to remove all personal email from the existing account."}],"a":"A","t":["Cloud Identity"]},{"n":187,"s":"You need to manage a Cloud Spanner instance for best query performance. Your instance in production runs in a single Google Cloud region. You need to improve performance in the shortest amount of time. You want to follow Google best practices for service configuration. What should you do?","o":[{"l":"A","t":"Create an alert in Cloud Monitoring to alert when the percentage of high priority CPU utilization reaches 45%. If you exceed this threshold, add nodes to your instance."},{"l":"B","t":"Create an alert in Cloud Monitoring to alert when the percentage of high priority CPU utilization reaches 45%. Use database query statistics to identify queries that result in high CPU usage, and then rewrite those queries to optimize their resource usage."},{"l":"C","t":"Create an alert in Cloud Monitoring to alert when the percentage of high priority CPU utilization reaches 65%. If you exceed this threshold, add nodes to your instance."},{"l":"D","t":"Create an alert in Cloud Monitoring to alert when the percentage of high priority CPU utilization reaches 65%. Use database query statistics to identify queries that result in high CPU usage, and then rewrite those queries to optimize their resource usage."}],"a":"C","t":["Spanner","Cloud Monitoring","Alerting"]},{"n":188,"s":"Your company has an internal application for managing transactional orders. The application is used exclusively by employees in a single physical location. The application requires strong consistency, fast queries, and ACID guarantees for multi-table transactional updates. The first version of the application is implemented in PostgreSQL, and you want to deploy it to the cloud with minimal code changes. Which database is most appropriate for this application?","o":[{"l":"A","t":"BigQuery"},{"l":"B","t":"Cloud SQL"},{"l":"C","t":"Cloud Spanner"},{"l":"D","t":"Cloud Datastore"}],"a":"B","t":["Cloud SQL","Database Selection"]},{"n":189,"s":"You are assigned to maintain a Google Kubernetes Engine (GKE) cluster named 'dev' that was deployed on Google Cloud. You want to manage the GKE configuration using the command line interface (CLI). You have just downloaded and installed the Cloud SDK. You want to ensure that future CLI commands by default address this specific cluster What should you do?","o":[{"l":"A","t":"Use the command gcloud config set container/cluster dev."},{"l":"B","t":"Use the command gcloud container clusters update dev."},{"l":"C","t":"Create a file called gke.default in the ~/.gcloud folder that contains the cluster name."},{"l":"D","t":"Create a file called defaults.json in the ~/.gcloud folder that contains the cluster name."}],"a":"A","t":["GKE","gcloud CLI"]},{"n":190,"s":"The sales team has a project named Sales Data Digest that has the ID acme-data-digest. You need to set up similar Google Cloud resources for the marketing team but their resources must be organized independently of the sales team. What should you do?","o":[{"l":"A","t":"Grant the Project Editor role to the Marketing team for acme-data-digest."},{"l":"B","t":"Create a Project Lien on acme-data-digest and then grant the Project Editor role to the Marketing team."},{"l":"C","t":"Create another project with the ID acme-marketing-data-digest for the Marketing team and deploy the resources there."},{"l":"D","t":"Create a new project named Marketing Data Digest and use the ID acme-data-digest. Grant the Project Editor role to the Marketing team."}],"a":"C","t":["Resource Hierarchy"]},{"n":191,"s":"You have deployed multiple Linux instances on Compute Engine. You plan on adding more instances in the coming weeks. You want to be able to access all of these instances through your SSH client over the internet without having to configure specific access on the existing and new instances. You do not want the Compute Engine instances to have a public IP. What should you do?","o":[{"l":"A","t":"Configure Cloud Identity-Aware Proxy for HTTPS resources."},{"l":"B","t":"Configure Cloud Identity-Aware Proxy for SSH and TCP resources"},{"l":"C","t":"Create an SSH keypair and store the public key as a project-wide SSH Key."},{"l":"D","t":"Create an SSH keypair and store the private key as a project-wide SSH Key."}],"a":"B","t":["IAP","SSH Access","Compute Engine"]},{"n":192,"s":"You have created an application that is packaged into a Docker image. You want to deploy the Docker image as a workload on Google Kubernetes Engine. What should you do?","o":[{"l":"A","t":"Upload the image to Cloud Storage and create a Kubernetes Service referencing the image."},{"l":"B","t":"Upload the image to Cloud Storage and create a Kubernetes Deployment referencing the image."},{"l":"C","t":"Upload the image to Container Registry and create a Kubernetes Service referencing the image."},{"l":"D","t":"Upload the image to Container Registry and create a Kubernetes Deployment referencing the image."}],"a":"D","t":["GKE","Kubernetes Workloads","Artifact Registry"]},{"n":193,"s":"You are using Data Studio to visualize a table from your data warehouse that is built on top of BigQuery. Data is appended to the data warehouse during the day. At night, the daily summary is recalculated by overwriting the table. You just noticed that the charts in Data Studio are broken, and you want to analyze the problem. What should you do?","o":[{"l":"A","t":"Review the Error Reporting page in the Cloud Console to find any errors."},{"l":"B","t":"Use the BigQuery interface to review the nightly job and look for any errors."},{"l":"C","t":"Use Cloud Debugger to find out why the data was not refreshed correctly."},{"l":"D","t":"In Cloud Logging, create a filter for your Data Studio report."}],"a":"B","t":["BigQuery","Looker Studio","Troubleshooting"]},{"n":194,"s":"You have been asked to set up the billing configuration for a new Google Cloud customer. Your customer wants to group resources that share common IAM policies. What should you do?","o":[{"l":"A","t":"Use labels to group resources that share common IAM policies."},{"l":"B","t":"Use folders to group resources that share common IAM policies."},{"l":"C","t":"Set up a proper billing account structure to group IAM policies."},{"l":"D","t":"Set up a proper project naming structure to group IAM policies."}],"a":"B","t":["Resource Hierarchy","IAM"]},{"n":195,"s":"You have been asked to create robust Virtual Private Network (VPN) connectivity between a new Virtual Private Cloud (VPC) and a remote site. Key requirements include dynamic routing, a shared address space of 10.19.0.1/22, and no overprovisioning of tunnels during a failover event. You want to follow Google- recommended practices to set up a high availability Cloud VPN. What should you do?","o":[{"l":"A","t":"Use a custom mode VPC network, configure static routes, and use active/passive routing."},{"l":"B","t":"Use an automatic mode VPC network, configure static routes, and use active/active routing."},{"l":"C","t":"Use a custom mode VPC network, use Cloud Router border gateway protocol (BGP) routes, and use active/passive routing."},{"l":"D","t":"Use an automatic mode VPC network, use Cloud Router border gateway protocol (BGP) routes, and configure policy-based routing."}],"a":"C","t":["Cloud VPN","Cloud Router","High Availability"]},{"n":196,"s":"You are running multiple microservices in a Kubernetes Engine cluster. One microservice is rendering images. The microservice responsible for the image rendering requires a large amount of CPU time compared to the memory it requires. The other microservices are workloads that are optimized for n1-standard machine types. You need to optimize your cluster so that all workloads are using resources as efficiently as possible. What should you do?","o":[{"l":"A","t":"Assign the pods of the image rendering microservice a higher pod priority than the other microservices."},{"l":"B","t":"Create a node pool with compute-optimized machine type nodes for the image rendering microservice. Use the node pool with general-purpose machine type nodes for the other microservices."},{"l":"C","t":"Use the node pool with general-purpose machine type nodes for the image rendering microservice. Create a node pool with compute-optimized machine type nodes for the other microservices."},{"l":"D","t":"Configure the required amount of CPU and memory in the resource requests specification of the image rendering microservice deployment. Keep the resource requests for the other microservices at the default."}],"a":"B","t":["GKE","GKE Node Pool","Machine Types"]},{"n":197,"s":"Your organization has three existing Google Cloud projects. You need to bill the Marketing department for only their Google Cloud services for a new initiative within their group. What should you do?","o":[{"l":"A","t":"1. Verify that you are assigned the Billing Administrator IAM role for your organization's Google Cloud Project for the Marketing department. 2. Link the new project to a Marketing Billing Account."},{"l":"B","t":"1. Verify that you are assigned the Billing Administrator IAM role for your organization's Google Cloud account. 2. Create a new Google Cloud Project for the Marketing department. 3. Set the default key-value project labels to department:marketing for all services in this project."},{"l":"C","t":"1. Verify that you are assigned the Organization Administrator IAM role for your organization's Google Cloud account. 2. Create a new Google Cloud Project for the Marketing department. 3. Link the new project to a Marketing Billing Account."},{"l":"D","t":"1. Verify that you are assigned the Organization Administrator IAM role for your organization's Google Cloud account. 2. Create a new Google Cloud Project for the Marketing department. 3. Set the default key-value project labels to department:marketing for all services in this project."}],"a":"A","t":["Cloud Billing","IAM"]},{"n":198,"s":"You deployed an application on a managed instance group in Compute Engine. The application accepts Transmission Control Protocol (TCP) traffic on port 389 and requires you to preserve the IP address of the client who is making a request. You want to expose the application to the internet by using a load balancer. What should you do?","o":[{"l":"A","t":"Expose the application by using an external TCP Network Load Balancer."},{"l":"B","t":"Expose the application by using a TCP Proxy Load Balancer."},{"l":"C","t":"Expose the application by using an SSL Proxy Load Balancer."},{"l":"D","t":"Expose the application by using an internal TCP Network Load Balancer."}],"a":"A","t":["Load Balancing","MIG"]},{"n":199,"s":"You are building a multi-player gaming application that will store game information in a database. As the popularity of the application increases, you are concerned about delivering consistent performance. You need to ensure an optimal gaming performance for global users, without increasing the management complexity. What should you do?","o":[{"l":"A","t":"Use Cloud SQL database with cross-region replication to store game statistics in the EU, US, and APAC regions."},{"l":"B","t":"Use Cloud Spanner to store user data mapped to the game statistics."},{"l":"C","t":"Use BigQuery to store game statistics with a Redis on Memorystore instance in the front to provide global consistency."},{"l":"D","t":"Store game statistics in a Bigtable database partitioned by username."}],"a":"B","t":["Spanner","Database Selection"]},{"n":200,"s":"You are building an application that stores relational data from users. Users across the globe will use this application. Your CTO is concerned about the scaling requirements because the size of the user base is unknown. You need to implement a database solution that can scale with your user growth with minimum configuration changes. Which storage solution should you use?","o":[{"l":"A","t":"Cloud SQL"},{"l":"B","t":"Firestore"},{"l":"C","t":"Cloud Spanner"},{"l":"D","t":"Bigtable"}],"a":"C","t":["Spanner","Database Selection"]},{"n":201,"s":"Your company has multiple projects linked to a single billing account in Google Cloud. You need to visualize the costs with specific metrics that should be dynamically calculated based on company-specific criteria. You want to automate the process. What should you do?","o":[{"l":"A","t":"In the Google Cloud console, visualize the costs related to the projects in the Reports section."},{"l":"B","t":"In the Google Cloud console, visualize the costs related to the projects in the Cost breakdown section."},{"l":"C","t":"In the Google Cloud console, use the export functionality of the Cost table. Create a Looker Studio dashboard on top of the CSV export."},{"l":"D","t":"Configure Cloud Billing data export to BigQuery for the billing account. Create a Looker Studio dashboard on top of the BigQuery export."}],"a":"D","t":["Cloud Billing","Billing Export","BigQuery","Looker Studio"]},{"n":202,"s":"You have an application that runs on Compute Engine VM instances in a custom Virtual Private Cloud (VPC). Your company’s security policies only allow the use of internal IP addresses on VM instances and do not let VM instances connect to the internet. You need to ensure that the application can access a file hosted in a Cloud Storage bucket within your project. What should you do?","o":[{"l":"A","t":"Enable Private Service Access on the Cloud Storage Bucket."},{"l":"B","t":"Add storage.googleapis.com to the list of restricted services in a VPC Service Controls perimeter and add your project to the list of protected projects."},{"l":"C","t":"Enable Private Google Access on the subnet within the custom VPC."},{"l":"D","t":"Deploy a Cloud NAT instance and route the traffic to the dedicated IP address of the Cloud Storage bucket."}],"a":"C","t":["VPC","Private Google Access","Cloud Storage"]},{"n":203,"s":"Your company completed the acquisition of a startup and is now merging the IT systems of both companies. The startup had a production Google Cloud project in their organization. You need to move this project into your organization and ensure that the project is billed to your organization. You want to accomplish this task with minimal effort. What should you do?","o":[{"l":"A","t":"Use the projects.move method to move the project to your organization. Update the billing account of the project to that of your organization."},{"l":"B","t":"Ensure that you have an Organization Administrator Identity and Access Management (IAM) role assigned to you in both organizations. Navigate to the Resource Manager in the startup’s Google Cloud organization, and drag the project to your company's organization."},{"l":"C","t":"Create a Private Catalog for the Google Cloud Marketplace, and upload the resources of the startup's production project to the Catalog. Share the Catalog with your organization, and deploy the resources in your company’s project."},{"l":"D","t":"Create an infrastructure-as-code template for all resources in the project by using Terraform, and deploy that template to a new project in your organization. Delete the project from the startup’s Google Cloud organization."}],"a":"A","t":["Resource Hierarchy","Cloud Billing"]},{"n":204,"s":"All development (dev) teams in your organization are located in the United States. Each dev team has its own Google Cloud project. You want to restrict access so that each dev team can only create cloud resources in the United States (US). What should you do?","o":[{"l":"A","t":"Create a folder to contain all the dev projects. Create an organization policy to limit resources in US locations."},{"l":"B","t":"Create an organization to contain all the dev projects. Create an Identity and Access Management (IAM) policy to limit the resources in US regions."},{"l":"C","t":"Create an Identity and Access Management (IAM) policy to restrict the resources locations in the US. Apply the policy to all dev projects."},{"l":"D","t":"Create an Identity and Access Management (IAM) policy to restrict the resources locations in all dev projects. Apply the policy to all dev roles."}],"a":"A","t":["Organization Policy","Resource Hierarchy"]},{"n":205,"s":"You are configuring Cloud DNS. You want to create DNS records to point home.mydomain.com, mydomain.com, and www.mydomain.com to the IP address of your Google Cloud load balancer. What should you do?","o":[{"l":"A","t":"Create one CNAME record to point mydomain.com to the load balancer, and create two A records to point WWW and HOME to mydomain.com respectively."},{"l":"B","t":"Create one CNAME record to point mydomain.com to the load balancer, and create two AAAA records to point WWW and HOME to mydomain.com respectively."},{"l":"C","t":"Create one A record to point mydomain.com to the load balancer, and create two CNAME records to point WWW and HOME to mydomain.com respectively."},{"l":"D","t":"Create one A record to point mydomain.com to the load balancer, and create two NS records to point WWW and HOME to mydomain.com respectively."}],"a":"C","t":["Cloud DNS","Load Balancing"]},{"n":206,"s":"You have two subnets (subnet-a and subnet-b) in the default VPC. Your database servers are running in subnet-a. Your application servers and web servers are running in subnet-b. You want to configure a firewall rule that only allows database traffic from the application servers to the database servers. What should you do?","o":[{"l":"A","t":"• Create service accounts sa-app and sa-db.\n• Associate service account sa-app with the application servers and the service account sa-db with the database servers.\n• Create an ingress firewall rule to allow network traffic from source service account sa-app to target service account sa-db."},{"l":"B","t":"• Create network tags app-server and db-server.\n• Add the app-server tag to the application servers and the db-server tag to the database servers.\n• Create an egress firewall rule to allow network traffic from source network tag app-server to target network tag db-server."},{"l":"C","t":"• Create a service account sa-app and a network tag db-server.\n• Associate the service account sa-app with the application servers and the network tag db-server with the database servers.\n• Create an ingress firewall rule to allow network traffic from source VPC IP addresses and target the subnet-a IP addresses."},{"l":"D","t":"• Create a network tag app-server and service account sa-db.\n• Add the tag to the application servers and associate the service account with the database servers.\n• Create an egress firewall rule to allow network traffic from source network tag app-server to target service account sa-db."}],"a":"A","t":["Firewall Rules","Service Account","VPC"]},{"n":207,"s":"Your team wants to deploy a specific content management system (CMS) solution to Google Cloud. You need a quick and easy way to deploy and install the solution. What should you do?","o":[{"l":"A","t":"Search for the CMS solution in Google Cloud Marketplace. Use gcloud CLI to deploy the solution."},{"l":"B","t":"Search for the CMS solution in Google Cloud Marketplace. Deploy the solution directly from Cloud Marketplace."},{"l":"C","t":"Search for the CMS solution in Google Cloud Marketplace. Use Terraform and the Cloud Marketplace ID to deploy the solution with the appropriate parameters."},{"l":"D","t":"Use the installation guide of the CMS provider. Perform the installation through your configuration management system."}],"a":"B","t":["Cloud Marketplace"]},{"n":208,"s":"You are working for a startup that was officially registered as a business 6 months ago. As your customer base grows, your use of Google Cloud increases. You want to allow all engineers to create new projects without asking them for their credit card information. What should you do?","o":[{"l":"A","t":"Create a Billing account, associate a payment method with it, and provide all project creators with permission to associate that billing account with their projects."},{"l":"B","t":"Grant all engineers permission to create their own billing accounts for each new project."},{"l":"C","t":"Apply for monthly invoiced billing, and have a single invoice for the project paid by the finance team."},{"l":"D","t":"Create a billing account, associate it with a monthly purchase order (PO), and send the PO to Google Cloud."}],"a":"A","t":["Cloud Billing"]},{"n":209,"s":"Your continuous integration and delivery (CI/CD) server can’t execute Google Cloud actions in a specific project because of permission issues. You need to validate whether the used service account has the appropriate roles in the specific project. What should you do?","o":[{"l":"A","t":"Open the Google Cloud console, and check the Identity and Access Management (IAM) roles assigned to the service account at the project or inherited from the folder or organization levels."},{"l":"B","t":"Open the Google Cloud console, and check the organization policies."},{"l":"C","t":"Open the Google Cloud console, and run a query to determine which resources this service account can access."},{"l":"D","t":"Open the Google Cloud console, and run a query of the audit logs to find permission denied errors for this service account."}],"a":"A","t":["IAM","Service Account","CI/CD","Troubleshooting"]},{"n":210,"s":"Your team is using Linux instances on Google Cloud. You need to ensure that your team logs in to these instances in the most secure and cost efficient way. What should you do?","o":[{"l":"A","t":"Attach a public IP to the instances and allow incoming connections from the internet on port 22 for SSH."},{"l":"B","t":"Use the gcloud compute ssh command with the --tunnel-through-iap flag. Allow ingress traffic from the IP range 35.235.240.0/20 on port 22."},{"l":"C","t":"Use a third party tool to provide remote access to the instances."},{"l":"D","t":"Create a bastion host with public internet access. Create the SSH tunnel to the instance through the bastion host."}],"a":"B","t":["IAP","SSH Access","Firewall Rules","Compute Engine"]},{"n":211,"s":"An external member of your team needs list access to compute images and disks in one of your projects. You want to follow Google-recommended practices when you grant the required permissions to this user. What should you do?","o":[{"l":"A","t":"Create a custom role, and add all the required compute.disks.list and compute.images.list permissions as includedPermissions. Grant the custom role to the user at the project level."},{"l":"B","t":"Create a custom role based on the Compute Image User role. Add the compute.disks.list to the includedPermissions field. Grant the custom role to the user at the project level."},{"l":"C","t":"Create a custom role based on the Compute Storage Admin role. Exclude unnecessary permissions from the custom role. Grant the custom role to the user at the project level."},{"l":"D","t":"Grant the Compute Storage Admin role at the project level."}],"a":"A","t":["IAM","IAM Custom Role","Least Privilege"]},{"n":212,"s":"You are running a web application on Cloud Run for a few hundred users. Some of your users complain that the initial web page of the application takes much longer to load than the following pages. You want to follow Google’s recommendations to mitigate the issue. What should you do?","o":[{"l":"A","t":"Set the minimum number of instances for your Cloud Run service to 3."},{"l":"B","t":"Set the concurrency number to 1 for your Cloud Run service."},{"l":"C","t":"Set the maximum number of instances for your Cloud Run service to 100."},{"l":"D","t":"Update your web application to use the protocol HTTP/2 instead of HTTP/1.1."}],"a":"A","t":["Cloud Run","Cloud Run Scaling"]},{"n":213,"s":"You are building a data lake on Google Cloud for your Internet of Things (IoT) application. The IoT application has millions of sensors that are constantly streaming structured and unstructured data to your backend in the cloud. You want to build a highly available and resilient architecture based on Google-recommended practices. What should you do?","o":[{"l":"A","t":"Stream data to Pub/Sub, and use Dataflow to send data to Cloud Storage."},{"l":"B","t":"Stream data to Pub/Sub, and use Storage Transfer Service to send data to BigQuery."},{"l":"C","t":"Stream data to Dataflow, and use Dataprep by Trifacta to send data to Bigtable."},{"l":"D","t":"Stream data to Dataflow, and use Storage Transfer Service to send data to BigQuery."}],"a":"A","t":["Pub/Sub","Dataflow","Cloud Storage"]},{"n":214,"s":"You are running out of primary internal IP addresses in a subnet for a custom mode VPC. The subnet has the IP range 10.0.0.0/20, and the IP addresses are primarily used by virtual machines in the project. You need to provide more IP addresses for the virtual machines. What should you do?","o":[{"l":"A","t":"Add a secondary IP range 10.1.0.0/20 to the subnet."},{"l":"B","t":"Change the subnet IP range from 10.0.0.0/20 to 10.0.0.0/18."},{"l":"C","t":"Change the subnet IP range from 10.0.0.0/20 to 10.0.0.0/22."},{"l":"D","t":"Convert the subnet IP range from IPv4 to IPv6."}],"a":"B","t":["VPC","Subnets"]},{"n":215,"s":"Your company requires all developers to have the same permissions, regardless of the Google Cloud project they are working on. Your company’s security policy also restricts developer permissions to Compute Engine, Cloud Functions, and Cloud SQL. You want to implement the security policy with minimal effort. What should you do?","o":[{"l":"A","t":"• Create a custom role with Compute Engine, Cloud Functions, and Cloud SQL permissions in one project within the Google Cloud organization.\n• Copy the role across all projects created within the organization with the gcloud iam roles copy command.\n• Assign the role to developers in those projects."},{"l":"B","t":"• Add all developers to a Google group in Google Groups for Workspace.\n• Assign the predefined role of Compute Admin to the Google group at the Google Cloud organization level."},{"l":"C","t":"• Add all developers to a Google group in Cloud Identity.\n• Assign predefined roles for Compute Engine, Cloud Functions, and Cloud SQL permissions to the Google group for each project in the Google Cloud organization."},{"l":"D","t":"• Add all developers to a Google group in Cloud Identity.\n• Create a custom role with Compute Engine, Cloud Functions, and Cloud SQL permissions at the Google Cloud organization level.\n• Assign the custom role to the Google group."}],"a":"D","t":["IAM","IAM Custom Role","Google Groups","Resource Hierarchy"]},{"n":216,"s":"You are working for a hospital that stores its medical images in an on-premises data room. The hospital wants to use Cloud Storage for archival storage of these images. The hospital wants an automated process to upload any new medical images to Cloud Storage. You need to design and implement a solution. What should you do?","o":[{"l":"A","t":"Create a Pub/Sub topic, and enable a Cloud Storage trigger for the Pub/Sub topic. Create an application that sends all medical images to the Pub/Sub topic."},{"l":"B","t":"Create a script that uses the gcloud storage command to synchronize the on-premises storage with Cloud Storage, Schedule the script as a cron job."},{"l":"C","t":"Create a Pub/Sub topic, and create a Cloud Function connected to the topic that writes data to Cloud Storage. Create an application that sends all medical images to the Pub/Sub topic."},{"l":"D","t":"In the Google Cloud console, go to Cloud Storage. Upload the relevant images to the appropriate bucket."}],"a":"B","t":["Cloud Storage","Data Transfer","gcloud storage"]},{"n":217,"s":"Your company has an internal application for managing transactional orders. The application is used exclusively by employees in a single physical location. The application requires strong consistency, fast queries, and ACID guarantees for multi-table transactional updates. The first version of the application is implemented in PostgreSQL, and you want to deploy it to the cloud with minimal code changes. Which database is most appropriate for this application?","o":[{"l":"A","t":"Bigtable"},{"l":"B","t":"BigQuery"},{"l":"C","t":"Cloud SQL"},{"l":"D","t":"Firestore"}],"a":"C","t":["Cloud SQL","Database Selection"]},{"n":218,"s":"Your company runs one batch process in an on-premises server that takes around 30 hours to complete. The task runs monthly, can be performed offline, and must be restarted if interrupted. You want to migrate this workload to the cloud while minimizing cost. What should you do?","o":[{"l":"A","t":"Create an Instance Template with Spot VMs On. Create a Managed Instance Group from the template and adjust Target CPU Utilization. Migrate the workload."},{"l":"B","t":"Migrate the workload to a Compute Engine VM. Start and stop the instance as needed."},{"l":"C","t":"Migrate the workload to a Google Kubernetes Engine cluster with Spot nodes."},{"l":"D","t":"Migrate the workload to a Compute Engine Spot VM."}],"a":"B","t":["Compute Engine","Spot VM","Migration","Cost Optimization"]},{"n":219,"s":"You are planning to migrate the following on-premises data management solutions to Google Cloud:\n• One MySQL cluster for your main database\n• Apache Kafka for your event streaming platform\n• One Cloud SQL for PostgreSQL database for your analytical and reporting needs\nYou want to implement Google-recommended solutions for the migration. You need to ensure that the new solutions provide global scalability and require minimal operational and infrastructure management. What should you do?","o":[{"l":"A","t":"Migrate from MySQL to Cloud SQL, from Kafka to Pub/Sub, and from Cloud SQL for PostgreSQL to BigQuery."},{"l":"B","t":"Migrate from MySQL to Cloud Spanner, from Kafka to Pub/Sub, and from Cloud SQL for PostgreSQL to BigQuery."},{"l":"C","t":"Migrate from MySQL to Cloud Spanner, from Kafka to Memorystore, and from Cloud SQL for PostgreSQL to Cloud SQL."},{"l":"D","t":"Migrate from MySQL to Cloud SQL, from Kafka to Memorystore, and from Cloud SQL for PostgreSQL to Cloud SQL."}],"a":"B","t":["Database Selection","Spanner","Pub/Sub","BigQuery","Migration"]},{"n":220,"s":"During a recent audit of your existing Google Cloud resources, you discovered several users with email addresses outside of your Google Workspace domain. You want to ensure that your resources are only shared with users whose email addresses match your domain. You need to remove any mismatched users, and you want to avoid having to audit your resources to identify mismatched users. What should you do?","o":[{"l":"A","t":"Create a Cloud Scheduler task to regularly scan your projects and delete mismatched users."},{"l":"B","t":"Create a Cloud Scheduler task to regularly scan your resources and delete mismatched users."},{"l":"C","t":"Set an organizational policy constraint to limit identities by domain to automatically remove mismatched users."},{"l":"D","t":"Set an organizational policy constraint to limit identities by domain, and then retroactively remove the existing mismatched users"}],"a":"D","t":["Organization Policy","IAM"]},{"n":221,"s":"Your application is running on Google Cloud in a managed instance group (MIG). You see errors in Cloud Logging for one VM that one of the processes is not responsive. You want to replace this VM in the MIG quickly. What should you do?","o":[{"l":"A","t":"Use the gcloud compute instances update command with a REFRESH action for the VM."},{"l":"B","t":"Use the gcloud compute instance-groups managed recreate-instances command to recreate the VM."},{"l":"C","t":"Select the MIG from the Compute Engine console and, in the menu, select Replace VMs."},{"l":"D","t":"Update and apply the instance template of the MIG."}],"a":"B","t":["MIG","gcloud CLI"]},{"n":222,"s":"You want to permanently delete a Pub/Sub topic managed by Config Connector in your Google Cloud project. What should you do?","o":[{"l":"A","t":"Use kubectl to create the label deleted-by-cnrm and to change its value to true for the topic resource."},{"l":"B","t":"Use kubectl to delete the topic resource."},{"l":"C","t":"Use gcloud CLI to delete the topic."},{"l":"D","t":"Use gcloud CLI to update the topic label managed-by-cnrm to false."}],"a":"B","t":["IAC","Config Connector","Pub/Sub","kubectl"]},{"n":223,"s":"Your company is using Google Workspace to manage employee accounts. Anticipated growth will increase the number of personnel from 100 employees to 1,000 employees within 2 years. Most employees will need access to your company’s Google Cloud account. The systems and processes will need to support 10x growth without performance degradation, unnecessary complexity, or security issues. What should you do?","o":[{"l":"A","t":"Migrate the users to Active Directory. Connect the Human Resources system to Active Directory. Turn on Google Cloud Directory Sync (GCDS) for Cloud Identity. Turn on Identity Federation from Cloud Identity to Active Directory."},{"l":"B","t":"Organize the users in Cloud Identity into groups. Enforce multi-factor authentication in Cloud Identity."},{"l":"C","t":"Turn on identity federation between Cloud Identity and Google Workspace. Enforce multi-factor authentication for domain wide delegation."},{"l":"D","t":"Use a third-party identity provider service through federation. Synchronize the users from Google Workplace to the third-party provider in real time."}],"a":"B","t":["Cloud Identity","Google Groups","MFA"]},{"n":224,"s":"You want to host your video encoding software on Compute Engine. Your user base is growing rapidly, and users need to be able to encode their videos at any time without interruption or CPU limitations. You must ensure that your encoding solution is highly available, and you want to follow Google-recommended practices to automate operations. What should you do?","o":[{"l":"A","t":"Deploy your solution on multiple standalone Compute Engine instances, and increase the number of existing instances when CPU utilization on Cloud Monitoring reaches a certain threshold."},{"l":"B","t":"Deploy your solution on multiple standalone Compute Engine instances, and replace existing instances with high-CPU instances when CPU utilization on Cloud Monitoring reaches a certain threshold."},{"l":"C","t":"Deploy your solution to an instance group, and increase the number of available instances whenever you see high CPU utilization in Cloud Monitoring."},{"l":"D","t":"Deploy your solution to an instance group, and set the autoscaling based on CPU utilization."}],"a":"D","t":["Compute Engine","MIG","MIG Autoscaling","High Availability"]},{"n":225,"s":"Your managed instance group raised an alert stating that new instance creation has failed to create new instances. You need to solve the instance creation problem. What should you do?","o":[{"l":"A","t":"Create an instance template that contains valid syntax which will be used by the instance group. Delete any persistent disks with the same name as instance names."},{"l":"B","t":"Create an instance template that contains valid syntax that will be used by the instance group. Verify that the instance name and persistent disk name values are not the same in the template."},{"l":"C","t":"Verify that the instance template being used by the instance group contains valid syntax. Delete any persistent disks with the same name as instance names. Set the disks.autoDelete property to true in the instance template."},{"l":"D","t":"Delete the current instance template and replace it with a new instance template. Verify that the instance name and persistent disk name values are not the same in the template. Set the disks.autoDelete property to true in the instance template."}],"a":"A","t":["MIG","Instance Template","Troubleshooting"]},{"n":226,"s":"You have created an application that is packaged into a Docker image. You want to deploy the Docker image as a workload on Google Kubernetes Engine. What should you do?","o":[{"l":"A","t":"Upload the image to Cloud Storage and create a Kubernetes Service referencing the image."},{"l":"B","t":"Upload the image to Cloud Storage and create a Kubernetes Deployment referencing the image."},{"l":"C","t":"Upload the image to Artifact Registry and create a Kubernetes Service referencing the image."},{"l":"D","t":"Upload the image to Artifact Registry and create a Kubernetes Deployment referencing the image."}],"a":"D","t":["GKE","Kubernetes Workloads","Artifact Registry"]},{"n":227,"s":"You are using Looker Studio to visualize a table from your data warehouse that is built on top of BigQuery. Data is appended to the data warehouse during the day. At night, the daily summary is recalculated by overwriting the table. You just noticed that the charts in Looker Studio are broken, and you want to analyze the problem. What should you do?","o":[{"l":"A","t":"In Cloud Logging, create a filter for your Looker Studio report."},{"l":"B","t":"Use the open source CLI tool, Snapshot Debugger, to find out why the data was not refreshed correctly."},{"l":"C","t":"Review the Error Reporting page in the Google Cloud console to find any errors."},{"l":"D","t":"Use the BigQuery interface to review the nightly job and look for any errors."}],"a":"D","t":["BigQuery","Looker Studio","Troubleshooting"]},{"n":228,"s":"You have a batch workload that runs every night and uses a large number of virtual machines (VMs). It is fault-tolerant and can tolerate some of the VMs being terminated. The current cost of VMs is too high. What should you do?","o":[{"l":"A","t":"Run a test using simulated maintenance events. If the test is successful, use Spot N2 Standard VMs when running future jobs."},{"l":"B","t":"Run a test using simulated maintenance events. If the test is successful, use N2 Standard VMs when running future jobs."},{"l":"C","t":"Run a test using a managed instance group. If the test is successful, use N2 Standard VMs in the managed instance group when running future jobs."},{"l":"D","t":"Run a test using N1 standard VMs instead of N2. If the test is successful, use N1 Standard VMs when running future jobs."}],"a":"A","t":["Compute Engine","Spot VM","Cost Optimization"]},{"n":229,"s":"You created several resources in multiple Google Cloud projects. All projects are linked to different billing accounts. To better estimate future charges, you want to have a single visual representation of all costs incurred. You want to include new cost data as soon as possible. What should you do?","o":[{"l":"A","t":"Fill all resources in the Pricing Calculator to get an estimate of the monthly cost."},{"l":"B","t":"Use the Reports view in the Cloud Billing Console to view the desired cost information."},{"l":"C","t":"Visit the Cost Table page to get a CSV export and visualize it using Looker Studio."},{"l":"D","t":"Configure Billing Data Export to BigQuery and visualize the data in Looker Studio."}],"a":"D","t":["Cloud Billing","Billing Export","BigQuery","Looker Studio"]},{"n":230,"s":"Your company has a large quantity of unstructured data in different file formats. You want to perform ETL transformations on the data. You need to make the data accessible on Google Cloud so it can be processed by a Dataflow job. What should you do?","o":[{"l":"A","t":"Upload the data to BigQuery using the bq command line tool."},{"l":"B","t":"Upload the data to Cloud Storage using the gcloud storage command."},{"l":"C","t":"Upload the data into Cloud SQL using the import function in the Google Cloud console."},{"l":"D","t":"Upload the data into Cloud Spanner using the import function in the Google Cloud console."}],"a":"B","t":["Cloud Storage","Data Transfer","gcloud storage","Dataflow"]},{"n":231,"s":"You have deployed an application on a single Compute Engine instance. The application writes logs to disk. Users start reporting errors with the application. You want to diagnose the problem. What should you do?","o":[{"l":"A","t":"Navigate to Cloud Logging and view the application logs."},{"l":"B"
